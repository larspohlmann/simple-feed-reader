# Shared by both Docker stacks (dev bind-mount + prod web image), mirroring
# deploy/strato/.htaccess (#254, #1101). text/html is omitted deliberately:
# nginx compresses it by default, so listing it here would double-configure it.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript
           text/javascript text/css text/plain application/xml image/svg+xml;
