# HTTPS is not optional locally: the __Host-oauth_flow cookie is Secure, and
# Safari (unlike Chrome) grants no Secure-cookie leniency to http://localhost.
server {
    listen 80;
    # Hardcoding the published port is fine for a local-only server block.
    return 301 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    root /app/public;

    # One cap for the whole server, because a per-route cap cannot work here:
    # try_files sends every request through an internal redirect into the
    # `location ~ ^/index\.php(/|$)` block below, and nginx enforces
    # client_max_body_size in the location that finally reads the body. A
    # `client_max_body_size` on a route's own location is therefore decorative
    # -- an earlier 25m on the restore route was measured to 413 a 12 MiB POST
    # all the same. Giving one route a real cap of its own would mean
    # duplicating the whole fastcgi block for it, which buys nothing on a
    # local-only stack (production runs on Strato through .htaccess).
    #
    # 25m is sized for the account restore, the one route with a large body:
    # a real backup is ~4 MiB gzipped, and a heavy account still fits well
    # inside this. nginx's 1m default would answer even an OPML import with a
    # raw 413 before Symfony ever saw the request.
    client_max_body_size 25m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        # $realpath_root works because php and nginx mount ./backend at the
        # same path (/app), so resolved script paths agree between containers.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # A recommendation tick spends one provider call, and OpenAiCompatible
        # ChatClient caps that at 120 s. nginx's 60 s default cut the client off
        # first, so PHP kept the per-user lock for another minute on a request
        # nobody was reading any more. Keep this above that cap.
        fastcgi_read_timeout 180s;
        internal;
    }

    # Only index.php is a valid entrypoint; any other .php request is a probe.
    location ~ \.php$ {
        return 404;
    }
}
