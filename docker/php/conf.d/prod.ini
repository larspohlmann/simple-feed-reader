; Production runtime limits. The dev image uses conf.d/app.ini instead.
memory_limit = 256M
expose_php = 0

; The account restore POSTs a gzipped backup as a raw body, and PHP's 8M
; default is below what a real account produces (~11 MiB). Above post_max_size
; PHP does not answer 413: it discards the body and the client gets an empty
; 200 it cannot interpret. Keep this at or above nginx's client_max_body_size
; (25m in docker/web/http.conf and tls.conf), or that failure mode comes back
; for bodies between the two limits. #458.
post_max_size = 25M

; The source is baked into the image, so a file can never change under a
; running container -- skipping the mtime check on every request is free
; speed. A code change arrives as a new image, which starts an empty opcache.
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
