; Dev-friendly limits; production values are a prod-stage concern.
memory_limit = 512M

; The account restore (#412) POSTs a gzipped backup as a raw body, and PHP's
; 8M default is below what a real account produces. Above post_max_size PHP
; does not answer 413: it stalls reading the body until nginx's
; fastcgi_read_timeout fires, and the client gets an empty 200 three minutes
; later. Keep this at or above nginx's client_max_body_size (25m), or that
; failure mode comes back for bodies between the two limits.
post_max_size = 25M
