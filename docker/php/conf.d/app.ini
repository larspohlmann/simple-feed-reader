; Dev-friendly limits; production values are a prod-stage concern.
memory_limit = 512M

; The account restore (#412) POSTs a gzipped backup as a raw body, and PHP's
; The 8M default is below the measured ~34.5 MiB compressed backup.
; Above post_max_size PHP does not answer 413: it stalls reading the body
; until nginx's fastcgi_read_timeout fires, and the client gets an empty 200
; three minutes later. This number is declared in five files across both
; Docker stacks and they must all agree -- RequestBodyLimitAgreementTest fails
; the build
; otherwise, and names the file that drifted. Change them together
; (#458, #1063).
post_max_size = 64M

; #[WithSpan] methods become child spans (#1011). Off by default in the extension.
opentelemetry.attr_hooks_enabled = 1
