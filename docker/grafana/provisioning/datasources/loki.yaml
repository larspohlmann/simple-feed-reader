apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      derivedFields:
        # trace_id rides inside the JSON log line, not as a stream label, so the
        # matcher must read the line, not a label.
        - name: TraceID
          matcherType: regex
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: tempo
          # $$ escapes Grafana's config env-var interpolation, so the literal
          # ${__value.raw} reaches the datasource and resolves to the captured
          # trace id at click time. A single $ is expanded to empty at load.
          url: '$${__value.raw}'
