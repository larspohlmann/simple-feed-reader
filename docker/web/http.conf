# Plain-HTTP mode: chosen when no certificate is mounted. For an operator's
# reverse proxy terminating TLS in front, or a localhost/LAN instance.
# Same routing as tls.conf, minus TLS -- keep the two files in step.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Sized for the account restore (#458), not for OPML: a real export is
    # ~11 MiB, so the former 10m refused it with a raw 413 before Symfony ever
    # ran. This number is declared in five files across both Docker stacks and
    # they must all agree -- RequestBodyLimitAgreementTest fails the build
    # otherwise, and names the file that drifted. Change them together.
    client_max_body_size 25m;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
