# Plain-HTTP mode: chosen when no certificate is mounted. For an operator's
# reverse proxy terminating TLS in front, or a localhost/LAN instance.
# Same routing as tls.conf, minus TLS -- keep the two files in step.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    include /etc/nginx/snippets/gzip.conf;

    # Account restore needs 64m (#458, #1063), not OPML. A measured real export
    # grew to ~34.5 MiB gzipped. This number is declared in five files across
    # both Docker stacks and they must all agree --
    # RequestBodyLimitAgreementTest fails the build otherwise, and names the
    # file that drifted. Change them together.
    client_max_body_size 64m;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    # Content-hashed bundles change name whenever their bytes change (#254), so
    # a named copy is safe to pin for a year.
    location ~ "-[A-Z0-9]{8}\.(?:js|mjs|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html carries the hashed bundle names, so a cached shell would pin
    # the browser to the previous release's JavaScript.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
