<ng-content />
<button
  class="toggle"
  type="button"
  (click)="toggle()"
  (mousedown)="$event.preventDefault()"
  [attr.aria-pressed]="revealed()"
  [attr.aria-label]="(revealed() ? 'passwordInput.hide' : 'passwordInput.show') | transloco"
>
  <app-icon [name]="revealed() ? 'visibility_off' : 'visibility'" size="sm" />
</button>
