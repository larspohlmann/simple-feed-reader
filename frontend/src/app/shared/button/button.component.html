<button
  [type]="type()"
  [disabled]="inert()"
  [class]="variant() + ' ' + size()"
  [class.off]="disabled() && !loading()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.cdkFocusInitial]="focusInitial() ? '' : null"
>
  @if (loading()) {
    <app-spinner [size]="16" />
  } @else {
    <ng-content />
  }
</button>
