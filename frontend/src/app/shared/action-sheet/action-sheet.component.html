<div class="grabber" aria-hidden="true"></div>
<nav role="menu" [attr.aria-label]="data.title">
  <p class="title">{{ data.title }}</p>
  @for (action of data.actions; track action.id) {
    <button
      role="menuitem"
      type="button"
      [class.danger]="action.danger"
      (click)="ref.close(action.id)"
    >
      {{ action.label }}
    </button>
  }
</nav>
