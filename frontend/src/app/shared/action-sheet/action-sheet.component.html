<nav #menu role="menu" [attr.aria-label]="data.title">
  @for (item of data.actions; track $index) {
    @if (isDivider(item)) {
      <hr role="separator" />
    } @else {
      <button
        role="menuitem"
        type="button"
        [class.danger]="item.danger"
        [disabled]="item.disabled"
        (click)="ref.close(item.id)"
      >
        @if (item.logo) {
          <app-masked-logo [src]="item.logo.url" [color]="item.logo.color" />
        } @else if (item.symbol) {
          <app-icon [name]="item.symbol" size="sm" />
        }
        {{ item.label }}
      </button>
    }
  }
</nav>
<header class="head">
  <div class="grabber" aria-hidden="true"></div>
  <p class="title" aria-hidden="true">{{ data.title }}</p>
  <button
    type="button"
    class="close boxed round"
    appIconButton
    [attr.aria-label]="'common.close' | transloco"
    (click)="ref.close()"
  >
    <app-icon name="close" size="md" />
  </button>
</header>
