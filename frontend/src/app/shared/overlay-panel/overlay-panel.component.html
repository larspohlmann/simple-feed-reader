<section
  class="panel"
  [class.fill-mobile]="fillOnMobile()"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="headingId"
>
  <header class="head">
    @if (headingLevel() === 1) {
      <h1 [id]="headingId">{{ heading() }}</h1>
    } @else {
      <h2 [id]="headingId">{{ heading() }}</h2>
    }
    <ng-content select="[headerActions]" />
  </header>
  <div class="body">
    <ng-content />
  </div>
  <footer class="footer">
    <ng-content select="[footer]" />
  </footer>
</section>
