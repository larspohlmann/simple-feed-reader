<app-overlay-panel [heading]="data.title" cdkTrapFocus>
  <p class="msg">{{ data.message }}</p>

  <app-button footer (click)="ref.close(false)">
    {{ 'dialog.cancel' | transloco }}
  </app-button>
  <app-button
    footer
    focusInitial
    [variant]="data.danger ? 'danger' : 'primary'"
    (click)="ref.close(true)"
  >
    {{ data.confirmLabel }}
  </app-button>
</app-overlay-panel>
