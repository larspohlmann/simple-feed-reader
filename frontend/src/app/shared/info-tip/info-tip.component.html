<span class="wrap" [appDismissOnOutside]="open()" (dismiss)="close()">
  <button
    type="button"
    class="trigger"
    [class.is-open]="open()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="open() ? panelId : null"
    [attr.aria-label]="label()"
    (click)="toggle($event)"
  >
    <app-icon name="info" size="text" />
  </button>
  @if (open()) {
    <!-- The handler suppresses an activation rather than performing one: the
         panel may sit inside a <label> or a <summary>, where a click reaching
         the container would toggle the control or collapse the row. There is
         nothing for a key handler to do — the panel is not operable, and a
         keyboard user never activates a label by way of its text. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
    <span
      class="panel"
      [id]="panelId"
      role="note"
      [style.top.px]="panelTop()"
      [style.left.px]="panelLeft()"
      [style.max-width.px]="panelMaxWidth()"
      (click)="swallow($event)"
      >{{ text() }}</span
    >
  }
</span>
