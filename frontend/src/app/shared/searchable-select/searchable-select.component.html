<div class="wrap" [appDismissOnOutside]="open()" (dismiss)="close()">
  <button
    type="button"
    class="trigger"
    [id]="inputId()"
    [class.open]="open()"
    [disabled]="disabled()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="current" [class.empty-value]="!selectedLabel()">
      {{ selectedLabel() || placeholder() }}
    </span>
    <app-icon class="caret" name="expand_more" size="sm" />
  </button>

  @if (open()) {
    <div class="panel">
      <input
        class="search"
        type="text"
        autocomplete="off"
        role="combobox"
        aria-autocomplete="list"
        [attr.aria-label]="'searchableSelect.filter' | transloco"
        [placeholder]="'searchableSelect.filter' | transloco"
        [value]="filter()"
        [attr.aria-expanded]="open()"
        [attr.aria-controls]="open() ? listboxId() : null"
        [attr.aria-activedescendant]="activeOptionId()"
        (input)="applyFilter($any($event.target).value)"
        (keydown)="onKeydown($event)"
      />

      @if (matches().length) {
        <ul class="list" role="listbox" [id]="listboxId()">
          @for (option of matches(); track option.value; let i = $index) {
            <!-- No click-handling keyboard event on the <li> itself: keyboard
                 selection is the ARIA combobox pattern above (role="combobox"
                 plus aria-activedescendant on the .search input tracks the
                 highlighted option), so these options are a mouse shortcut onto
                 the same choose(), not a second focusable stop. -->
            <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
            <li
              class="option"
              role="option"
              [id]="optionId(i)"
              [class.active]="i === activeIndex()"
              [attr.aria-selected]="option.value === value()"
              (click)="choose(option)"
            >
              {{ option.label }}
            </li>
          }
        </ul>
      } @else {
        <p class="empty">{{ 'searchableSelect.noMatch' | transloco }}</p>
      }
    </div>
  }
</div>
