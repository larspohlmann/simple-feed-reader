<!-- src/app/shared/disclosure/disclosure.component.html -->
<details #details [open]="startOpen()" (toggle)="onToggle(details)">
  <summary
    [class.is-row]="appearance() === 'row'"
    [class.is-card-header]="appearance() === 'card-header'"
    [class.is-drill-in]="appearance() === 'drill-in'"
  >
    <ng-content select="[summary]">{{ label() }}</ng-content>
  </summary>
  <ng-content />
</details>
