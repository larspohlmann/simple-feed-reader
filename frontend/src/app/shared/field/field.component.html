<!-- The control is projected, so the association is real but only exists at
     runtime: the linter sees an ng-content and cannot follow it. Wrapping the
     control in the label gives it its accessible name, so no for/id pair is needed. -->
<!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
<label>
  <span class="lbl-row">
    <span class="lbl">
      {{ label() }}
      @if (required()) {
        <span class="required" aria-hidden="true">*</span>
      }
    </span>
    @if (info(); as text) {
      <app-info-tip [text]="text" [label]="label()" />
    }
  </span>
  <ng-content />
</label>
@if (hint(); as text) {
  <p class="hint">{{ text }}</p>
}
@if (error(); as text) {
  <p class="error" role="alert">{{ text }}</p>
}
