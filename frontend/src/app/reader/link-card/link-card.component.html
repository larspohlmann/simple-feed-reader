<a appOwnInstanceHref [href]="card().url" target="_blank" rel="noopener noreferrer">
  @if (card().imageUrl && !imageFailed()) {
    <img
      appProxiedImage
      [src]="card().imageUrl"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (imageFailed)="imageFailed.set(true)"
    />
  }
  @if (siteLineFirst()) {
    <small>{{ card().siteName }}</small>
  }
  <strong>{{ card().title }}</strong>
  @if (card().description) {
    <span>{{ card().description }}</span>
  }
  @if (!siteLineFirst()) {
    <small>{{ card().siteName }}</small>
  }
</a>
@if (opensInReader(); as opening) {
  <app-open-in-reader [card]="card()" [opening]="opening" />
}
