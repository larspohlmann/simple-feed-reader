<a [href]="card().url" target="_blank" rel="noopener noreferrer">
  @if (card().imageUrl && !imageFailed()) {
    <img
      appProxiedImage
      [src]="card().imageUrl"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (imageFailed)="imageFailed.set(true)"
    />
  }
  @if (layout() === 'block') {
    <small>{{ card().siteName }}</small>
  }
  <strong>{{ card().title }}</strong>
  @if (card().description) {
    <span>{{ card().description }}</span>
  }
  @if (layout() === 'article') {
    <small>{{ card().siteName }}</small>
  }
</a>
@if (openableInReader()) {
  <button
    type="button"
    class="open-in-reader"
    [attr.aria-label]="'reader.openInReader' | transloco"
    [attr.title]="'reader.openInReader' | transloco"
    (click)="onOpenInReader($event)"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <app-icon name="chrome_reader_mode" size="sm" />
    <span class="open-in-reader-label">{{ 'reader.openInReader' | transloco }}</span>
  </button>
}
