<ng-content />
@if (entry(); as e) {
  @if (e.recommendationReason) {
    <p class="reason">
      @if (e.recommendationScore !== null && e.recommendationScore !== undefined) {
        <span class="score">Score: {{ e.recommendationScore }}</span>
      }
      {{ e.recommendationReason }}
    </p>
  }
}
