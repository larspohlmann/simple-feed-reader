<article
  class="row"
  role="button"
  tabindex="0"
  [class.read]="entry().isHidden"
  [class.img-left]="imageSide() === 'left'"
  (click)="open.emit(entry())"
  (keydown.enter)="open.emit(entry())"
  (keydown.space)="$event.preventDefault(); open.emit(entry())"
>
  <div class="body">
    <h3 class="title">
      @if (marking()) {
        <app-marked-text [text]="entry().title" [terms]="terms()" />
      } @else {
        {{ entry().title }}
      }
    </h3>
    <p class="meta">
      <app-favicon [url]="entry().faviconUrl" [size]="14" />{{ entry().source }} · {{ when() }}
      <span class="dot" [class.on]="!entry().isHidden" aria-hidden="true"></span>
    </p>
    <p class="snippet">
      @if (marking()) {
        <app-marked-text [text]="snippet()" [terms]="terms()" />
      } @else {
        {{ snippet() }}
      }
    </p>
    <div class="tagline">
      <app-source-tags [tags]="tags()" />
      <app-entry-actions
        [entry]="entry()"
        size="md"
        (favorite)="favorite.emit($event)"
        (keep)="keep.emit($event)"
        (read)="read.emit($event)"
      />
    </div>
  </div>
  @if (image() && !imgError()) {
    <img
      class="thumb"
      [src]="image()!"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="imgError.set(true)"
    />
  }
</article>
