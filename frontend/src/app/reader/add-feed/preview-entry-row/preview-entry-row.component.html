<article class="prow">
  <div class="body">
    <h3 class="title">{{ item().title }}</h3>
    <p class="meta">
      <app-favicon [url]="faviconUrl()" [size]="14" />{{ source() }}
      @if (when()) {
        · {{ when() }}
      }
    </p>
    @if (item().summary) {
      <p class="snippet">{{ item().summary }}</p>
    }
  </div>
  @if (showThumb()) {
    <img
      class="thumb"
      [src]="item().imageUrl"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="failedImageUrl.set(item().imageUrl)"
    />
  }
</article>
