<app-overlay-panel [heading]="data.title" cdkTrapFocus>
  <p class="msg">{{ data.message }}</p>

  <button footer class="act" type="button" (click)="ref.close(false)">
    {{ 'dialog.cancel' | transloco }}
  </button>
  <button
    footer
    class="act"
    type="button"
    [class.primary]="!data.danger"
    [class.danger]="data.danger"
    cdkFocusInitial
    (click)="ref.close(true)"
  >
    {{ data.confirmLabel }}
  </button>
</app-overlay-panel>
