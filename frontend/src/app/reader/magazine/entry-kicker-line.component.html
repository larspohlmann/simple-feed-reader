<p class="kicker">
  @if (showDot()) {
    <span class="dot" [class.on]="!entry().isRead" aria-hidden="true"></span>
  }
  @if (showSource()) {
    <app-favicon [url]="entry().faviconUrl" [size]="faviconSize()" />
    <a
      class="source"
      [routerLink]="[]"
      [queryParams]="selectionQueryParams({ subscription: entry().subscriptionId })"
      queryParamsHandling="merge"
      (click)="$event.stopPropagation()"
      >{{ entry().source }}</a
    >
    <span class="separator" aria-hidden="true">·</span>
  }
  <span class="when">{{ when() }}</span>
  <ng-content />
</p>
