<p class="kicker">
  @if (showSource()) {
    <app-favicon [url]="entry().faviconUrl" [size]="faviconSize()" />
    <a
      class="source"
      [routerLink]="[]"
      [queryParams]="selectionQueryParams({ subscription: entry().subscriptionId })"
      queryParamsHandling="merge"
      (click)="$event.stopPropagation()"
      >{{ entry().source }}</a
    >
    <span class="separator" aria-hidden="true">·</span>
  }
  <span class="when">{{ when() }}</span>
  <span class="dot" [class.on]="!entry().isHidden" aria-hidden="true"></span>
  @if (entry().savedSearchTerm; as term) {
    <span
      class="saved-search-pill"
      [attr.title]="term"
      [attr.aria-label]="'reader.matchedSavedSearch' | transloco: { term }"
      >{{ term }}</span
    >
  }
  <ng-content />
</p>
