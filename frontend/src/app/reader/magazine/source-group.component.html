<div class="group">
  <div class="ghead">
    <p class="gname">
      <app-favicon [url]="entries()[0]?.faviconUrl ?? null" [size]="14" /><a
        class="gsource"
        [routerLink]="[]"
        [queryParams]="selectionQueryParams({ subscription: subscriptionId() })"
        queryParamsHandling="merge"
        >{{ source() }}</a
      >
    </p>
    <app-source-tags [tags]="tags()" />
  </div>
  <div class="items">
    @for (item of visibleEntries(); track item.id) {
      <div class="item">
        <app-entry-compact
          [entry]="item"
          [showSource]="false"
          (favorite)="favorite.emit($event)"
          (keep)="keep.emit($event)"
          (read)="read.emit($event)"
          (open)="open.emit($event)"
        />
      </div>
    }
  </div>
  @if (hiddenCount() > 0) {
    <button class="more" type="button" [attr.aria-expanded]="expanded()" (click)="toggle()">
      @if (expanded()) {
        {{ 'reader.showLess' | transloco }}
        <app-icon name="expand_less" size="sm" />
      } @else {
        {{ 'reader.moreFromCount' | transloco: { count: hiddenCount(), source: source() } }}
        <app-icon name="expand_more" size="sm" />
      }
    </button>
  }
</div>
