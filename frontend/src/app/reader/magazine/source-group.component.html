<div class="group">
  <div class="ghead">
    <p class="gname">
      <app-favicon [url]="entries()[0]?.faviconUrl ?? null" [size]="14" /><a
        class="gsource"
        [routerLink]="[]"
        [queryParams]="{ subscription: subscriptionId(), view: null, tag: null, entry: null }"
        queryParamsHandling="merge"
        >{{ source() }}</a
      >
    </p>
    <app-source-tags [tags]="tags()" />
  </div>
  <div class="items">
    @for (item of visibleEntries(); track item.id) {
      <div class="item">
        <app-entry-compact [entry]="item" [showSource]="false" (open)="open.emit($event)" />
      </div>
    }
  </div>
  @if (hiddenCount() > 0) {
    <p class="more">
      {{ 'reader.moreFromCount' | transloco: { count: hiddenCount(), source: source() } }}
    </p>
  }
</div>
