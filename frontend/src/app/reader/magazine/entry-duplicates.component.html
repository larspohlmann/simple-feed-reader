@if (copies().length) {
  <div class="also-foot">
    <span class="layers" aria-hidden="true">⧉</span>
    <span class="lead">{{ 'reader.alsoIn' | transloco }}</span>
    @for (copy of copies(); track copy.id) {
      <button
        type="button"
        class="also-entry"
        [attr.aria-expanded]="selected() === copy"
        [attr.aria-controls]="selected() === copy ? panelId : null"
        (click)="toggle(copy, $event)"
      >
        {{ copy.source }} <span class="sep">·</span>
        <span class="t">{{ when(copy) }}</span>
      </button>
    }
  </div>
  @if (origin(); as trigger) {
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="!!selected()"
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (overlayOutsideClick)="close()"
      (overlayKeydown)="$event.key === 'Escape' && close()"
    >
      @if (displayed(); as copy) {
        <div class="dup-popover" [id]="panelId" role="note">
          <span class="popover-heading">{{ 'reader.alsoPublishedAs' | transloco }}</span>
          <app-entry-row
            [entry]="copy"
            (open)="openCopy($event)"
            (favorite)="favoriteCopy($event)"
            (keep)="keepCopy($event)"
            (read)="readCopy($event)"
          />
        </div>
      }
    </ng-template>
  }
}
