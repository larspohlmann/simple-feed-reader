@if (copies().length) {
  <div class="also-foot">
    <app-icon class="layers" name="layers" size="sm" aria-hidden="true" />
    <span class="lead">{{ 'reader.alsoIn' | transloco }}</span>
    @for (item of copies(); track item.copy.id) {
      <button
        type="button"
        class="also-entry"
        [attr.aria-expanded]="displayed()?.id === item.copy.id"
        [attr.aria-controls]="displayed()?.id === item.copy.id ? panelId : null"
        (click)="toggle(item.copy, $event)"
      >
        {{ item.copy.source }} <span class="sep">·</span>
        <span class="t">{{ item.when }}</span>
      </button>
    }
  </div>
  @if (origin(); as trigger) {
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="!!displayed()"
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (overlayOutsideClick)="close()"
      (overlayKeydown)="$event.key === 'Escape' && close()"
    >
      @if (displayed(); as copy) {
        <div class="dup-popover" [id]="panelId" role="note">
          <span class="popover-heading">{{ 'reader.alsoPublishedAs' | transloco }}</span>
          <app-entry-row
            [entry]="copy"
            (open)="openCopy($event)"
            (favorite)="favoriteCopy($event)"
            (keep)="keepCopy($event)"
            (read)="readCopy($event)"
          />
        </div>
      }
    </ng-template>
  }
}
