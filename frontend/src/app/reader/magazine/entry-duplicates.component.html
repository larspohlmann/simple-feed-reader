@if (copies().length) {
  <span class="dup-wrap" [appDismissOnOutside]="!!selected()" (dismiss)="close()">
    <div class="also-foot">
      <span class="layers" aria-hidden="true">⧉</span>
      <span class="lead">{{ 'reader.alsoIn' | transloco }}</span>
      @for (copy of copies(); track copy.id) {
        <button
          type="button"
          class="also-entry"
          [attr.aria-expanded]="selected() === copy"
          [attr.aria-controls]="selected() === copy ? panelId : null"
          (click)="toggle(copy, $event)"
        >
          {{ copy.source }} <span class="sep">·</span>
          <span class="t">{{ when(copy) }}</span>
        </button>
      }
    </div>
    @if (selected(); as copy) {
      <span
        class="dup-popover"
        [id]="panelId"
        role="note"
        [style.top.px]="panelTop()"
        [style.left.px]="panelLeft()"
        (click)="$event.stopPropagation()"
      >
        <span class="popover-heading">{{ 'reader.alsoPublishedAs' | transloco }}</span>
        <app-entry-row
          [entry]="copy"
          (open)="open.emit($event)"
          (favorite)="favorite.emit($event)"
          (keep)="keep.emit($event)"
          (read)="read.emit($event)"
        />
      </span>
    }
  </span>
}
