@if (audio() && entryAudio.track()) {
  <button
    type="button"
    [attr.aria-label]="
      (entryAudio.playing() ? 'reader.audioPlayer.pause' : 'reader.audioPlayer.play') | transloco
    "
    (click)="$event.stopPropagation(); entryAudio.togglePlaying()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <app-icon [name]="entryAudio.playing() ? 'pause' : 'play_arrow'" [size]="size()" />
  </button>
  <button
    type="button"
    [attr.aria-label]="
      (entryAudio.queued() ? 'reader.audioPlayer.inPlaylist' : 'reader.audioPlayer.addToPlaylist')
        | transloco
    "
    [appFlagToggle]="entryAudio.queued()"
    (click)="$event.stopPropagation(); entryAudio.toggleQueued()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <app-icon
      [name]="entryAudio.queued() ? 'playlist_add_check' : 'playlist_add'"
      [size]="size()"
    />
  </button>
}
<button
  type="button"
  [attr.aria-label]="'reader.favorite' | transloco"
  [appFlagToggle]="entry().isFavorite"
  (click)="$event.stopPropagation(); actions.favorite(entry())"
  (keydown.enter)="$event.stopPropagation()"
  (keydown.space)="$event.stopPropagation()"
>
  <app-icon name="star" [size]="size()" [fill]="entry().isFavorite" />
</button>
<button
  type="button"
  [attr.aria-label]="'reader.keep' | transloco"
  [appFlagToggle]="entry().isKept"
  (click)="$event.stopPropagation(); actions.keep(entry())"
  (keydown.enter)="$event.stopPropagation()"
  (keydown.space)="$event.stopPropagation()"
>
  <app-icon name="bookmark" [size]="size()" [fill]="entry().isKept" />
</button>
<button
  type="button"
  [attr.aria-label]="'reader.toggleRead' | transloco"
  [appFlagToggle]="entry().isViewed"
  (click)="$event.stopPropagation(); actions.toggleRead(entry())"
  (keydown.enter)="$event.stopPropagation()"
  (keydown.space)="$event.stopPropagation()"
>
  <app-icon name="check" [size]="size()" />
</button>
