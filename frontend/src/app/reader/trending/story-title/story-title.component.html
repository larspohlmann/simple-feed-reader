<a
  class="story-link"
  [routerLink]="storyLink()"
  queryParamsHandling="preserve"
  [attr.aria-labelledby]="titleId()"
  [attr.aria-describedby]="synopsisId()"
>
  <app-story-headline
    [storyId]="story().id"
    [title]="story().title"
    [synopsis]="story().synopsis"
  />
</a>
<div class="story-foot">
  <span class="counts"><app-story-source-count [story]="story()" /></span>
  <app-story-actions [story]="story()" />
</div>
