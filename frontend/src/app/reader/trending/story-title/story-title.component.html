<a class="story-link" [routerLink]="storyLink()" queryParamsHandling="preserve">
  <app-icon class="icon" [name]="storyIcon" size="sm" />
  <div class="text">
    <h3 class="title">{{ story().title }}</h3>
    @if (story().synopsis; as synopsis) {
      <p class="synopsis">{{ synopsis }}</p>
    }
  </div>
</a>
