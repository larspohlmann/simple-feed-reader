@if (actions(); as shown) {
  @let story = shown.story;
  <span class="story-actions" role="group" [attr.aria-label]="'reader.storyActions' | transloco">
    <button
      type="button"
      appIconButton
      class="boxed round"
      [appFlagToggle]="story.followed"
      [attr.aria-label]="
        (story.followed ? 'reader.unfollowStory' : 'reader.followStory') | transloco
      "
      [attr.title]="
        (story.followed ? 'reader.actionHint.unfollowStory' : 'reader.actionHint.followStory')
          | transloco
      "
      (click)="$event.stopPropagation(); shown.actions.follow(entry())"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <app-icon
        [name]="story.followed ? 'notifications_active' : 'notification_add'"
        size="sm"
        [fill]="story.followed"
      />
    </button>
    <button
      type="button"
      appIconButton
      class="boxed round"
      [attr.aria-label]="'reader.hideStory' | transloco"
      [attr.title]="'reader.actionHint.hideStory' | transloco"
      (click)="$event.stopPropagation(); shown.actions.hide(entry())"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <app-icon name="visibility_off" size="sm" />
    </button>
  </span>
}
