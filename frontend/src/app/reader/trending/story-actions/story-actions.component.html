@if (actions(); as shown) {
  @let followed = shown.followed;
  <span class="story-actions" role="group" [attr.aria-label]="'reader.storyActions' | transloco">
    <button
      type="button"
      appIconButton
      class="boxed round"
      [appFlagToggle]="followed"
      [attr.aria-label]="(followed ? 'reader.unfollowStory' : 'reader.followStory') | transloco"
      [attr.title]="
        (followed ? 'reader.actionHint.unfollowStory' : 'reader.actionHint.followStory') | transloco
      "
      (click)="$event.stopPropagation(); shown.actions.follow(story())"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <app-icon
        [name]="followed ? 'notifications_active' : 'notification_add'"
        size="sm"
        [fill]="followed"
      />
    </button>
    <button
      type="button"
      appIconButton
      class="boxed round"
      [attr.aria-label]="'reader.hideStory' | transloco"
      [attr.title]="'reader.actionHint.hideStory' | transloco"
      (click)="$event.stopPropagation(); shown.actions.hide(story())"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <app-icon name="visibility_off" size="sm" />
    </button>
  </span>
}
