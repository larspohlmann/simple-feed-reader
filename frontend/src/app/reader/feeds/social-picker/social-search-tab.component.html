<app-social-search-form #form [network]="network()" [accountId]="accountId()">
  <app-button
    variant="primary"
    data-testid="social-search-subscribe"
    [disabled]="!form.hasPreview()"
    [loading]="importer.importing()"
    (click)="subscribe.emit(form.trimmed())"
  >
    {{ 'settings.social.search.subscribe' | transloco }}
  </app-button>
</app-social-search-form>
