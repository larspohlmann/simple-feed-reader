@for (tag of ordered(); track tag.id) {
  <button
    type="button"
    class="tag-pill"
    [class.on]="selected().has(tag.id)"
    [attr.aria-pressed]="selected().has(tag.id)"
    (click)="toggled.emit(tag.id)"
  >
    <app-tag-glyph
      [name]="tag.icon"
      [color]="selected().has(tag.id) ? 'var(--on-accent)' : tag.color"
      size="sm"
    />
    {{ labelOf(tag) }}
  </button>
}
