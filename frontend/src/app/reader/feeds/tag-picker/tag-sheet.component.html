<app-overlay-panel [heading]="'tagPicker.sheetTitle' | transloco" fillOnMobile>
  <div subheader class="top">
    <label class="search">
      <app-icon name="search" size="md" />
      <input
        class="query"
        type="text"
        autocomplete="off"
        enterkeyhint="done"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="true"
        cdkFocusInitial
        [attr.aria-controls]="listId"
        [attr.aria-activedescendant]="activeId()"
        [attr.aria-label]="'tagPicker.filter' | transloco"
        [placeholder]="'tagPicker.filter' | transloco"
        [value]="search.query()"
        (input)="search.setQuery($any($event.target).value)"
        (keydown)="search.handleKey($event)"
      />
    </label>
    @if (search.chips().length) {
      <div class="chips">
        <app-tag-chips [chips]="search.chips()" (removed)="source.toggle($event)" />
      </div>
    }
    <app-form-error [message]="search.error()" />
  </div>
  <app-tag-option-list
    [entries]="search.entries()"
    [activeIndex]="search.activeIndex()"
    [listId]="listId"
    [creating]="search.creating()"
    (picked)="search.pick($event)"
    (createRequested)="search.create()"
  />
  <app-button footer variant="primary" (click)="ref.close()">
    {{ 'tagPicker.done' | transloco }}
  </app-button>
</app-overlay-panel>
