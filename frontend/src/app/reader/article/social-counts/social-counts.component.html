@if (entry().social; as social) {
  <app-social-counts-row
    [network]="social.network"
    [counts]="counts()"
    [liked]="likeable() ? social.isLiked : null"
    [actions]="viewer()"
    (likeToggled)="actions.like(entry())"
    (repostToggled)="toggleRepost()"
    (replyRequested)="reply(social.network)"
    (quoteRequested)="quote(social.network)"
  />
}
