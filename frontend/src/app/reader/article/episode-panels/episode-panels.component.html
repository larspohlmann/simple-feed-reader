@if (track(); as audioTrack) {
  @if (chapters().length) {
    <app-episode-chapters [chapters]="chapters()" [track]="audioTrack" />
  }
}
@if (transcript(); as episodeTranscript) {
  <app-episode-transcript
    [transcript]="episodeTranscript"
    [track]="track()"
    [startOpen]="transcriptIsTheBody()"
  />
}
