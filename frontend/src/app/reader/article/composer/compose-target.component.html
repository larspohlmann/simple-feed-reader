@if (response(); as post) {
  <blockquote class="target">
    <p class="author">
      @if (post.authorName) {
        <span class="name">{{ post.authorName }}</span>
      }
      @if (post.authorHandle) {
        <span class="handle">{{ post.authorHandle }}</span>
      }
    </p>
    <p class="excerpt">{{ post.excerpt }}</p>
    <ng-container [ngTemplateOutlet]="compactCard" />
  </blockquote>
} @else {
  <ng-container [ngTemplateOutlet]="compactCard" />
}

<ng-template #compactCard>
  @if (card(); as card) {
    <div class="article">
      @if (card.imageUrl && !imageFailed()) {
        <img
          appProxiedImage
          class="thumb"
          [src]="card.imageUrl"
          alt=""
          decoding="async"
          referrerpolicy="no-referrer"
          (imageFailed)="imageFailed.set(true)"
        />
      }
      <div class="article-text">
        <p class="title">{{ card.title }}</p>
        @if (card.site) {
          <p class="site">{{ card.site }}</p>
        }
      </div>
    </div>
  }
</ng-template>
