<button
  appListAction
  class="mobile-icon-only"
  type="button"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'reader.share.button' | transloco"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  #button
  (click)="press()"
>
  <app-icon [name]="glyph" size="sm" />
  <span class="txt">{{ 'reader.share.button' | transloco }}</span>
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayDisposeOnNavigation]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="open.set(false)"
  (overlayKeydown)="step($event)"
  (detach)="open.set(false); button.focus()"
>
  <div
    class="menu"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    role="menu"
    [attr.aria-label]="'reader.share.button' | transloco"
  >
    @for (target of targets; track $index) {
      @if (target.kind === 'divider') {
        <hr role="separator" />
      } @else {
        <button role="menuitem" type="button" (click)="choose(target)">
          @if (target.icon) {
            <app-masked-logo [src]="logoUrl(target.icon)" [color]="target.color" />
          } @else {
            <app-icon [name]="target.symbol ?? glyph" size="sm" />
          }
          {{ target.labelKey ? (target.labelKey | transloco) : target.label }}
        </button>
      }
    }
  </div>
</ng-template>
