@for (medium of media(); track medium.url) {
  @if (medium.kind === 'video') {
    <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
    <div
      class="item video-slot"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    ></div>
  } @else if (medium.kind === 'animation') {
    <video
      class="item animation"
      [src]="medium.url"
      [attr.poster]="medium.previewImageUrl ?? null"
      [attr.width]="medium.width ?? null"
      [attr.height]="medium.height ?? null"
      [muted]="true"
      autoplay
      loop
      playsinline
      disablepictureinpicture
      aria-hidden="true"
    ></video>
  } @else {
    <img
      class="item"
      appProxiedImage
      [src]="medium.url"
      [attr.width]="medium.width ?? null"
      [attr.height]="medium.height ?? null"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
    />
  }
}
