@for (lane of lanes(); track lane.network) {
  @let sent = lane.sent() !== null;
  @let failed = lane.loadError() !== null || lane.sendError() !== null;
  <button
    type="button"
    class="pill"
    [class.on]="lane.active() && !sent"
    [class.sent]="sent"
    [class.failed]="failed"
    [attr.aria-pressed]="lane.active()"
    [attr.aria-disabled]="sent ? 'true' : null"
    [disabled]="disabled()"
    (click)="toggleNetwork.emit(lane.network)"
  >
    <app-network-logo [network]="lane.network" />
    {{ names[lane.network] }}
    @if (sent) {
      <span class="posted">✓ {{ 'social.composer.pillPosted' | transloco }}</span>
    } @else if (lane.loadError() !== null) {
      <span class="warning-mark" aria-hidden="true">⚠</span>
    }
  </button>
}
