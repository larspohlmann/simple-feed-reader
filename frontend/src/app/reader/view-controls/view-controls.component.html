<div class="seg" role="group" [attr.aria-label]="'reader.layout.aria' | transloco">
  @for (s of magazineStyles; track s.id) {
    <button
      [class.active]="layout.mode() === 'magazine' && magazineStyle.style() === s.id"
      [attr.aria-pressed]="layout.mode() === 'magazine' && magazineStyle.style() === s.id"
      [title]="'reader.layout.magazine' + s.key | transloco"
      [attr.aria-label]="'reader.layout.magazine' + s.key | transloco"
      (click)="showMagazine(s.id)"
    >
      <app-icon [name]="s.icon" size="md" />
    </button>
  }
  <button
    [attr.aria-label]="'reader.layout.list' | transloco"
    [title]="'reader.layout.list' | transloco"
    [attr.aria-pressed]="layout.mode() === 'list'"
    [class.active]="layout.mode() === 'list'"
    (click)="layout.set('list')"
  >
    <app-icon name="view_agenda" size="md" />
  </button>
  <button
    class="pane"
    [attr.aria-label]="'reader.layout.pane' | transloco"
    [title]="'reader.layout.pane' | transloco"
    [attr.aria-pressed]="layout.mode() === 'pane'"
    [class.active]="layout.mode() === 'pane'"
    (click)="layout.set('pane')"
  >
    <app-icon name="view_column_2" size="md" />
  </button>
</div>

<div class="seg" role="group" [attr.aria-label]="'reader.theme.aria' | transloco">
  @for (m of modes; track m.id) {
    <button
      [class.active]="theme.mode() === m.id"
      [attr.aria-pressed]="theme.mode() === m.id"
      [title]="'reader.theme.' + m.id | transloco"
      (click)="theme.setMode(m.id)"
    >
      <app-icon [name]="m.icon" size="md" />
    </button>
  }
</div>
