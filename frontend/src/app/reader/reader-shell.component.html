<app-reader-header
  #hdr
  [articleOpen]="articleFullscreen()"
  [hasPrev]="hasPrev()"
  [hasNext]="hasNext()"
  [tags]="headerTags()"
  [activeTagId]="activeTagId()"
  [class.hidden]="headerHidden()"
  (toggleSidebar)="setSidebarOpen(!sidebarOpen())"
  (prev)="onPrev()"
  (next)="onNext()"
/>
<!-- No top offset here: the scrolling panes reserve the header's height
     themselves (via --app-bar-h) and their content passes under it, so
     retracting the header uncovers content instead of leaving a dead strip
     (#87). Only the in-flow sidebar takes the offset, in the stylesheet. -->
<div
  class="body"
  appDrawerSwipe
  [appDrawerSwipeOpen]="sidebarOpen()"
  [appDrawerSwipeDisabled]="!screen.isNarrow() || articleFullscreen()"
  (appDrawerSwipeOpenDrawer)="setSidebarOpen(true)"
  (appDrawerSwipeCloseDrawer)="setSidebarOpen(false)"
>
  @if (sidebarOpen()) {
    <button
      class="backdrop"
      type="button"
      aria-label="Close menu"
      [style.top.px]="headerHeight() || null"
      (click)="setSidebarOpen(false)"
    ></button>
  }
  <aside
    class="sidebar"
    data-drawer-panel
    [class.open]="sidebarOpen()"
    [style.top.px]="headerHeight() || null"
  >
    <app-sidebar
      [tagTree]="subs.tagTree()"
      [untagged]="subs.untagged()"
      [totalUnread]="subs.totalUnread()"
      [favoritesCount]="subs.favoritesCount()"
      [keptCount]="subs.keptCount()"
      [selection]="selection()"
      [loading]="subs.loading()"
      (editTag)="manage.editTag($event)"
      (deleteTag)="manage.deleteTag($event)"
      (editFeed)="manage.editSubscription($event)"
      (unsubscribe)="manage.unsubscribe($event)"
      (retag)="manage.retag($event.sub, $event.tagIds)"
      (reorderTags)="manage.reorderTags($event)"
      (reorderUntagged)="manage.reorderUntagged($event)"
      (reorderTagFeeds)="manage.reorderTagFeeds($event.tagId, $event.subscriptionIds)"
      (refresh)="onRefresh()"
      (addFeed)="onAddFeed()"
    />
  </aside>
  <main class="main" [class.split]="paneMode()">
    @if (paneMode()) {
      <section class="list">
        <app-entry-list
          [layout]="layout.mode()"
          [title]="title()"
          [entries]="entries.entries()"
          [loading]="entries.loading()"
          [loadingMore]="entries.loadingMore()"
          [error]="entries.error()"
          [hasMore]="hasMore()"
          [canMarkAllRead]="canMarkAllRead()"
          [selection]="selection()"
          [openEntryId]="entryId()"
          [feedTags]="feedTags()"
          [refreshing]="refreshSvc.running()"
          [lastRefreshed]="selectedFeedLastFetched()"
          (loadMore)="entries.loadMore()"
          (markAllRead)="onMarkAllRead()"
          (refresh)="onScopedRefresh()"
          (favorite)="onFavorite($event)"
          (keep)="onKeep($event)"
          (read)="onToggleRead($event)"
          (open)="onOpen($event)"
        />
      </section>
      <section class="reader">
        <app-reader-view
          [entry]="openEntry()"
          [tags]="openEntryTags()"
          [hasPrev]="hasPrev()"
          [hasNext]="hasNext()"
          (favorite)="withOpen(onFavorite)"
          (keep)="withOpen(onKeep)"
          (read)="withOpen(onToggleRead)"
          (prev)="onPrev()"
          (next)="onNext()"
          (close)="onCloseReader()"
        />
      </section>
    } @else {
      <!-- The list stays mounted; a full-screen article overlays it, so swiping
           the article away reveals the list (and its scroll) underneath. -->
      <app-entry-list
        [layout]="layout.mode()"
        [title]="title()"
        [entries]="entries.entries()"
        [loading]="entries.loading()"
        [loadingMore]="entries.loadingMore()"
        [error]="entries.error()"
        [hasMore]="hasMore()"
        [canMarkAllRead]="canMarkAllRead()"
        [selection]="selection()"
        [openEntryId]="entryId()"
        [feedTags]="feedTags()"
        [refreshing]="refreshSvc.running()"
        [lastRefreshed]="selectedFeedLastFetched()"
        (loadMore)="entries.loadMore()"
        (markAllRead)="onMarkAllRead()"
        (refresh)="onScopedRefresh()"
        (favorite)="onFavorite($event)"
        (keep)="onKeep($event)"
        (read)="onToggleRead($event)"
        (open)="onOpen($event)"
      />
      @if (openEntry()) {
        <app-reader-view
          class="article-overlay"
          [entry]="openEntry()"
          [tags]="openEntryTags()"
          [showToolbar]="false"
          (favorite)="withOpen(onFavorite)"
          (keep)="withOpen(onKeep)"
          (read)="withOpen(onToggleRead)"
          (close)="onCloseReader()"
        />
      }
    }
  </main>
</div>
