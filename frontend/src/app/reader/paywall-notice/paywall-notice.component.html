<app-warning-box>
  <span class="warning-glyph" aria-hidden="true">⚠</span>
  <span class="warning-text">
    {{ 'reader.paywalled' | transloco }}
    @if (url(); as href) {
      <a class="note-link" [href]="href" target="_blank" rel="noopener noreferrer">{{
        'reader.paywalledLink' | transloco
      }}</a>
    }
  </span>
</app-warning-box>
