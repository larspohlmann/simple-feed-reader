<ol
  class="rows"
  cdkDropList
  [cdkDropListData]="player.tracks()"
  cdkDropListLockAxis="y"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (row of rows(); track row.track.url; let index = $index, last = $last) {
    @let queued = row.track;
    @let chapters = queued.chapters ?? [];
    @let open = expanded().has(queued.url);
    <li
      class="row"
      cdkDrag
      [cdkDragStartDelay]="dragDelay"
      [class.current]="row.current"
      [class.played]="row.played"
      [attr.aria-current]="row.current ? 'true' : null"
    >
      <span class="handle" cdkDragHandle aria-hidden="true">
        <app-icon name="drag_indicator" size="sm" />
      </span>
      <button
        class="pick"
        type="button"
        [attr.aria-label]="'reader.audioPlayer.playTrack' | transloco: { title: queued.title }"
        (click)="player.playAt(index)"
      >
        <app-audio-artwork [track]="queued" />
        <span class="row-title">{{ queued.title }}</span>
        @if (row.durationInSeconds; as seconds) {
          <span class="row-time">{{ format(seconds) }}</span>
        }
        @if (chapters.length > 0) {
          <span
            class="row-chapters"
            [attr.aria-label]="
              'reader.audioPlayer.chapterCount' | transloco: { count: chapters.length }
            "
          >
            <app-icon name="list" size="xs" />
            {{ chapters.length }}
          </span>
        }
      </button>
      @if (chapters.length > 0) {
        <button
          type="button"
          appIconButton
          class="expand"
          [attr.aria-expanded]="open"
          [attr.aria-label]="
            'reader.audioPlayer.trackChapters' | transloco: { title: queued.title }
          "
          (click)="toggleChapters(queued.url)"
        >
          <app-icon [name]="open ? 'expand_more' : 'chevron_right'" size="sm" />
        </button>
      }
      <button
        type="button"
        appIconButton
        class="up"
        [disabled]="index === 0"
        [attr.aria-label]="'reader.audioPlayer.moveUp' | transloco: { title: queued.title }"
        (click)="player.move(index, index - 1)"
      >
        <app-icon name="arrow_upward" size="sm" />
      </button>
      <button
        type="button"
        appIconButton
        class="down"
        [disabled]="last"
        [attr.aria-label]="'reader.audioPlayer.moveDown' | transloco: { title: queued.title }"
        (click)="player.move(index, index + 1)"
      >
        <app-icon name="arrow_downward" size="sm" />
      </button>
      <button
        type="button"
        appIconButton
        class="remove"
        [attr.aria-label]="'reader.audioPlayer.remove' | transloco: { title: queued.title }"
        (click)="player.dequeue(queued.url)"
      >
        <app-icon name="close" size="sm" />
      </button>
      @if (open && chapters.length > 0) {
        <app-audio-chapters
          class="nested"
          [chapters]="chapters"
          [currentIndex]="row.current ? player.chapterIndex() : -1"
          [progress]="row.current ? player.chapterProgress() : null"
          (pick)="player.playTrackChapter(index, $event)"
        />
      }
    </li>
  }
</ol>
