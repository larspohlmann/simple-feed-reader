<!-- Two rows: everything the feed says about itself on the first, the divider
     on the second. A feed's own blurb is context, not content — it is clamped
     so it cannot push the first entry off the fold (#2221). -->
<div class="lead">
  @if (logoUrl(); as url) {
    <!-- alt is empty on purpose: the feed's name is already the list heading
         directly above, so naming it again only repeats it to a screen reader. -->
    <img
      class="logo"
      [src]="url"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="broken.set(true)"
    />
  } @else if (faviconUrl(); as icon) {
    <!-- Only 8% of feeds publish an image of their own. The site icon stands in
         for the rest, through the shared component rather than a bare <img>: it
         owns --favicon-backdrop, keeping a dark-ink favicon visible on a dark surface. -->
    <app-favicon class="icon" [url]="icon" [size]="24" />
  }
  <div class="body">
    @if (title(); as name) {
      <p class="title">{{ name }}</p>
    }
    <!-- Blurb, toggle and link are inline siblings in one flow, so the link
         trails the last line of a wrapped description instead of claiming a row
         of its own, and still shows on its own for a feed that carries no blurb. -->
    <p class="text" #text>
      @if (description(); as blurb) {
        <span class="description" [class.clamped]="clamped()"
          ><span #blurbLines>{{ blurb }}</span></span
        >
      }
      @if (long()) {
        <button
          class="toggle"
          type="button"
          [attr.aria-expanded]="expanded()"
          (click)="expanded.set(!expanded())"
        >
          {{ (expanded() ? 'reader.showLess' : 'reader.showMore') | transloco }}
        </button>
      }
      @if (siteUrl(); as site) {
        <a
          class="homepage"
          [href]="site"
          [attr.title]="site"
          target="_blank"
          rel="noopener noreferrer"
          >{{ 'reader.openOriginal' | transloco }}&nbsp;<app-icon name="open_in_new" size="text"
        /></a>
      }
    </p>
  </div>
</div>

<!-- Always rendered, even for a feed with no blurb and no homepage: it names
     what follows and ties the block to the list, instead of leaving it floating
     above the rows. Same label-then-rule shape as the for-you run divider. -->
<div class="rule" role="separator">
  <span class="rule__label">{{ 'reader.feedPosts' | transloco }}</span>
</div>
