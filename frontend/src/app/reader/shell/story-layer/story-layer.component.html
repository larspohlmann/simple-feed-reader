<ng-template #leading>
  <button
    appIconButton
    class="story-back"
    type="button"
    [attr.aria-label]="'reader.backToList' | transloco"
    [attr.title]="'reader.backToList' | transloco"
    (click)="overlay.close()"
  >
    <app-icon name="arrow_back" size="md" />
  </button>
  @if (listLeading(); as shared) {
    <ng-container [ngTemplateOutlet]="shared" />
  }
</ng-template>

<ng-template #actions>
  @let followLabel = following.following() ? 'reader.unfollowStory' : 'reader.followStory';
  <button
    appListAction
    class="follow-story"
    type="button"
    [attr.aria-label]="followLabel | transloco"
    [attr.title]="followLabel | transloco"
    (click)="following.toggleOpen()"
  >
    <app-icon [name]="following.following() ? 'notifications_off' : 'notification_add'" size="sm" />
    <span class="txt">{{ followLabel | transloco }}</span>
  </button>
</ng-template>

<app-entry-list
  [layout]="layout()"
  [title]="title()"
  [titleCount]="titleCount()"
  [items]="story.items()"
  [loading]="story.loading()"
  [mutating]="story.mutating()"
  [loadingMore]="story.loadingMore()"
  [error]="story.error()"
  [hasMore]="story.nextCursor() !== null"
  [canMarkAllRead]="true"
  [selection]="selection()"
  [openEntryId]="openEntryId()"
  [leavingIds]="leavingIds()"
  [newSinceVisitIds]="visit.newSinceVisitIds()"
  [feedTags]="feedTags()"
  [headerLeading]="leading"
  [headerActions]="actions"
  [cornerTrailing]="cornerTrailing()"
  (loadMore)="story.loadMore()"
  (retry)="story.retry()"
  (dismiss)="story.dismissError()"
  (markAllRead)="markAllRead()"
  (unreadOnlyChange)="listPreferences.setUnreadOnly(selection(), $event)"
  (orderChange)="listOrder.set(selection(), $event)"
  (markAboveRead)="markAboveRead($event)"
/>
