<ng-template #leading>
  <button
    appIconButton
    class="story-back"
    type="button"
    [attr.aria-label]="'reader.backToList' | transloco"
    [attr.title]="'reader.backToList' | transloco"
    (click)="overlay.close()"
  >
    <app-icon name="arrow_back" size="md" />
  </button>
  @if (listLeading(); as shared) {
    <ng-container [ngTemplateOutlet]="shared" />
  }
</ng-template>

<ng-template #headlineTemplate>
  @if (title(); as title) {
    <div class="story-card">
      <app-story-headline
        class="story-headline"
        [storyId]="storyRef().id"
        [title]="title"
        [synopsis]="synopsis()"
      >
        @if (sources(); as sources) {
          <app-story-source-count storyMeta [story]="sources" />
        }
      </app-story-headline>
      <div class="story-foot"><app-story-actions [story]="storyRef()" /></div>
    </div>
  }
</ng-template>

<app-entry-list
  [layout]="layout()"
  [title]="heading.title()"
  [titleCount]="heading.titleCount()"
  [items]="context.entries.items()"
  [loading]="context.entries.loading()"
  [mutating]="context.entries.mutating()"
  [loadingMore]="context.entries.loadingMore()"
  [error]="context.entries.error()"
  [hasMore]="heading.hasMore()"
  [canMarkAllRead]="markRead.canMarkAllRead()"
  [selection]="context.selection()"
  [openEntryId]="openEntryId()"
  [leavingIds]="context.leavingIds()"
  [newSinceVisitIds]="visit.newSinceVisitIds()"
  [feedTags]="feedTags()"
  [headerLeading]="leading"
  [cornerTrailing]="cornerTrailing()"
  [topBlock]="topBlock()"
  (loadMore)="context.entries.loadMore()"
  (retry)="context.entries.retry()"
  (dismiss)="context.entries.dismissError()"
  (markAllRead)="markRead.confirmMarkAllRead()"
  (unreadOnlyChange)="listPreferences.setUnreadOnly(context.selection(), $event)"
  (orderChange)="listOrder.set(context.selection(), $event)"
  (markAboveRead)="markAboveRead($event)"
/>
