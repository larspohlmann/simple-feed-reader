@if (!screen.isCoarse()) {
  <app-sidebar-row-menu
    [menuKey]="menuKey()"
    [label]="'reader.manage' | transloco: { name: name() }"
  >
    <ng-template>
      @let current = tag();
      @if (current === null) {
        <button role="menuitem" (click)="manage.createTag(); rows.closeMenu()">
          {{ 'reader.newTag' | transloco }}
        </button>
      } @else {
        <button role="menuitem" (click)="manage.editTag(current); rows.closeMenu()">
          {{ 'reader.editTag' | transloco }}
        </button>
        @if (current.parentId === null) {
          <button role="menuitem" (click)="manage.createTag(current.id); rows.closeMenu()">
            {{ 'reader.createTagHere' | transloco }}
          </button>
        }
        <hr />
        <button
          role="menuitem"
          class="danger"
          (click)="manage.deleteTag(current); rows.closeMenu()"
        >
          {{ 'reader.deleteTag' | transloco }}
        </button>
      }
    </ng-template>
  </app-sidebar-row-menu>
}
