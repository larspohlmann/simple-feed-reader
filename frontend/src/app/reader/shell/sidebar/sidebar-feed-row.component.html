@let feed = subscription();
@let name = subscription().title;
@if (organising()) {
  @if (draggable) {
    <span class="handle" cdkDragHandle aria-hidden="true">
      <app-icon name="drag_indicator" size="sm" />
    </span>
  }
  <span class="feedname"
    ><app-favicon [url]="feed.faviconUrl" [avatarUrl]="avatarUrl()" /><span>{{ name }}</span></span
  >
  <button
    class="dots"
    type="button"
    [attr.aria-label]="'reader.manage' | transloco: { name: name }"
    (click)="rows.openFeedSheet(feed)"
  >
    <app-icon name="more_horiz" size="sm" />
  </button>
} @else {
  <a
    class="nav"
    [class.tag-sub]="tagId() !== null"
    [class.active]="active()"
    [routerLink]="['/']"
    [queryParams]="selectionQueryParams({ subscription: feed.id })"
    queryParamsHandling="merge"
  >
    <app-favicon
      [url]="feed.faviconUrl"
      [avatarUrl]="avatarUrl()"
      [class.has-avatar]="avatarUrl() !== null"
    /><span>{{ name }}</span>
    @if (markerSurfaces().length > 0) {
      <app-icon
        class="feed-exclusion-marker"
        name="visibility_off"
        size="xs"
        [title]="markerTitle()"
      />
    }
    @if (feed.unreadCount > 0) {
      <span class="count">{{ feed.unreadCount }}</span>
    }
  </a>
  @if (!screen.isCoarse()) {
    <app-sidebar-row-menu
      [menuKey]="menuKey()"
      [label]="'reader.manage' | transloco: { name: name }"
    >
      <ng-template>
        <button role="menuitem" (click)="manage.editSubscription(feed); rows.closeMenu()">
          {{ 'reader.editFeed' | transloco }}
        </button>
        <button
          role="menuitem"
          (click)="manage.setIncludeInAllItems(feed, !feed.includeInAllItems); rows.closeMenu()"
        >
          {{
            (feed.includeInAllItems ? 'reader.excludeFromAllItems' : 'reader.includeInAllItems')
              | transloco
          }}
        </button>
        <button
          role="menuitem"
          (click)="manage.setIncludeInForYou(feed, !feed.includeInForYou); rows.closeMenu()"
        >
          {{
            (feed.includeInForYou ? 'reader.excludeFromForYou' : 'reader.includeInForYou')
              | transloco
          }}
        </button>
        <button
          role="menuitem"
          (click)="
            manage.setIncludeInSavedSearches(feed, !feed.includeInSavedSearches); rows.closeMenu()
          "
        >
          {{
            (feed.includeInSavedSearches
              ? 'reader.excludeFromSavedSearches'
              : 'reader.includeInSavedSearches'
            ) | transloco
          }}
        </button>
        <button role="menuitem" (click)="manage.unsubscribe(feed); rows.closeMenu()">
          {{ 'reader.unsubscribe' | transloco }}
        </button>
      </ng-template>
    </app-sidebar-row-menu>
  }
}
