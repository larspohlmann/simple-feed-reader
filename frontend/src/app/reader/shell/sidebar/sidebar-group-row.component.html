<a
  class="nav grow"
  [class.active]="active()"
  [routerLink]="['/']"
  [queryParams]="link()"
  queryParamsHandling="merge"
>
  <span class="lead favicon-slot" [class.hidden-feed]="excluded()">
    <app-tag-glyph [name]="glyph()" [color]="glyphColor()" [size]="glyphSize()" />
    @if (excluded()) {
      <span
        class="feed-exclusion-marker"
        role="img"
        [attr.aria-label]="exclusionTitle()"
        [title]="exclusionTitle()"
      >
        <app-icon name="visibility_off" size="text" />
      </span>
    }
  </span>
  <span class="name">{{ label() }}</span>
  <ng-content select="app-sidebar-subtag-pill" />
  @if (count() > 0) {
    <span class="count">{{ count() }}</span>
  }
</a>
<ng-content />
<button
  class="chevzone"
  type="button"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="toggleLabel()"
  (click)="toggled.emit()"
>
  <app-icon [name]="expanded() ? 'expand_more' : 'chevron_right'" size="dense" />
</button>
