<app-stepper-bar
  [step]="brightness.step()"
  [min]="brightness.min()"
  [max]="brightness.max()"
  decreaseIcon="dark_mode"
  increaseIcon="light_mode"
  decreaseClass="darker"
  increaseClass="brighter"
  [groupLabel]="'reader.brightness.aria' | transloco"
  [decreaseLabel]="'reader.brightness.darker' | transloco"
  [increaseLabel]="'reader.brightness.brighter' | transloco"
  [resetLabel]="'reader.brightness.reset' | transloco"
  [readout]="
    brightness.step() === 0
      ? ('reader.brightness.readoutDefault' | transloco)
      : ('reader.brightness.readout' | transloco: { value: signedStep() })
  "
  (decrease)="brightness.decrease()"
  (increase)="brightness.increase()"
  (resetStep)="brightness.reset()"
/>
