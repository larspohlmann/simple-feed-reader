<a
  class="nav"
  [class.active]="active()"
  [routerLink]="['/']"
  [queryParams]="selectionQueryParams({ view: 'notifications', network: network() })"
  queryParamsHandling="merge"
>
  <span class="lead favicon-slot"><app-icon name="notifications" size="md" /></span>
  <span class="name">{{ 'reader.notifications.title' | transloco }}</span>
  @if (count() > 0) {
    <app-count-pill [count]="count()" />
  }
</a>
<span class="slot" aria-hidden="true"></span>
<span class="trail" aria-hidden="true"></span>
