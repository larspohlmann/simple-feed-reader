@if (!screen.isCoarse()) {
  @let current = tag();
  <app-sidebar-row-menu
    [menuKey]="'tag-' + current.id"
    [label]="'reader.manage' | transloco: { name: current.name }"
  >
    <ng-template>
      <button role="menuitem" (click)="tagActions.editTag(current); rows.closeMenu()">
        {{ 'reader.editTag' | transloco }}
      </button>
      @if (roomBelow()) {
        <button role="menuitem" (click)="tagActions.createTag(current.id); rows.closeMenu()">
          {{ 'reader.createTagHere' | transloco }}
        </button>
      }
      <hr />
      @for (check of surfaceChecks(); track check.id) {
        <app-menu-checkbox
          [label]="check.label"
          [checked]="check.checked()"
          (toggled)="check.toggle()"
        />
      }
      <hr />
      <button
        role="menuitem"
        class="danger"
        (click)="tagActions.deleteTag(current); rows.closeMenu()"
      >
        {{ 'reader.deleteTag' | transloco }}
      </button>
    </ng-template>
  </app-sidebar-row-menu>
}
