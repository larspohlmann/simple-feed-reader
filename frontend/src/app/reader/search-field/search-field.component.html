<div class="search-field" role="search" [attr.aria-label]="'reader.search' | transloco">
  <div class="row">
    @if (loading()) {
      <app-spinner class="icon" [size]="16" [decorative]="true" />
    } @else {
      <app-icon class="icon" name="search" size="sm" />
    }
    <input
      #inputEl
      class="input"
      type="text"
      autocomplete="off"
      [placeholder]="'reader.searchPlaceholder' | transloco"
      [value]="text()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
    />
    <!-- One ✕ for both steps: it clears a term, and on a dismissible field it
         leaves the search once there is nothing left to clear. The label moves
         with the meaning, so assistive tech never announces "Clear" for a
         click that closes. A permanent field keeps the button only while there
         is text — an always-present ✕ there would promise an exit it has not. -->
    @if (text() || dismissible()) {
      <button
        type="button"
        class="clear"
        [attr.aria-label]="(text() ? 'reader.searchClear' : 'reader.searchClose') | transloco"
        (click)="clearOrDismiss()"
      >
        <app-icon name="close" size="sm" />
      </button>
    }
  </div>
  @if (tooShort()) {
    <p class="hint">{{ 'reader.searchTooShort' | transloco }}</p>
  }
</div>
