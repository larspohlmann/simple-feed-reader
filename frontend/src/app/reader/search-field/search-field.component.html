<div class="search-field" role="search" [attr.aria-label]="'reader.search' | transloco">
  <div class="row">
    @if (loading()) {
      <app-spinner class="icon" [size]="16" [decorative]="true" />
    } @else {
      <app-icon class="icon" name="search" size="sm" />
    }
    <input
      #inputEl
      class="input"
      type="text"
      autocomplete="off"
      [placeholder]="'reader.searchPlaceholder' | transloco"
      [value]="text()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
    />
    <!-- A permanent field keeps this button only while there is text: an
         always-present ✕ there would promise an exit it has not. The label
         moves with the step, so assistive tech never announces "Clear" for a
         click that closes. -->
    @if (hasTextToClear() || dismissible()) {
      <button
        type="button"
        class="clear-or-dismiss"
        [attr.aria-label]="
          (hasTextToClear() ? 'reader.searchClear' : 'reader.searchClose') | transloco
        "
        (click)="clearOrDismiss()"
      >
        <app-icon name="close" size="sm" />
      </button>
    }
  </div>
  @if (tooShort()) {
    <p class="hint">{{ 'reader.searchTooShort' | transloco }}</p>
  }
</div>
