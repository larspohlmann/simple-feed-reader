@if (copies().length && !entry().story) {
  <app-entry-duplicates [entry]="entry()" />
} @else if (copies().length) {
  <div class="more-sources">
    <button
      type="button"
      class="toggle reads-as-text"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="expanded() ? panelId : null"
      (click)="toggle($event)"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      <app-icon name="layers" size="sm" aria-hidden="true" />
      {{ countKey() | transloco: { count: copies().length } }}
      <app-icon [name]="expanded() ? 'expand_less' : 'expand_more'" size="sm" aria-hidden="true" />
    </button>
    @if (expanded()) {
      <div class="minis" [id]="panelId">
        @for (source of sources(); track source.copy.id) {
          <button
            type="button"
            class="mini reads-as-text"
            (click)="open(source.copy, $event)"
            (keydown.enter)="$event.stopPropagation()"
            (keydown.space)="$event.stopPropagation()"
          >
            @if (source.copy.imageUrl) {
              <img
                class="thumb"
                [src]="source.copy.imageUrl"
                alt=""
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
              />
            } @else {
              <span class="thumb tile">
                <app-favicon
                  [url]="source.copy.faviconUrl"
                  [avatarUrl]="source.avatarUrl"
                  [size]="20"
                />
              </span>
            }
            <span class="text">
              <span class="byline">
                <app-favicon
                  [url]="source.copy.faviconUrl"
                  [avatarUrl]="source.avatarUrl"
                  [size]="14"
                />
                <span class="feed">{{ source.feed }}</span>
                <span class="when">· {{ source.when }}</span>
              </span>
              <span class="title">{{ source.title }}</span>
              @if (source.dek) {
                <span class="dek">{{ source.dek }}</span>
              }
            </span>
          </button>
        }
      </div>
    }
  </div>
}
