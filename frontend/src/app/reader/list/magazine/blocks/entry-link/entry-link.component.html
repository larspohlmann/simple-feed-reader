<article class="link" [appOpensEntry]="entry()">
  <app-entry-kicker-line [entry]="entry()" />
  @if (title() && !ledByItsCard()) {
    <p class="title" [class.post]="isPost()">{{ title() }}</p>
  }
  @if (dek() && !ledByItsCard()) {
    <p class="dek">{{ dek() }}</p>
  }
  @if (entry().linkCards[0]; as shared) {
    <app-link-card
      [card]="shared"
      layout="block"
      opensInReader="alone"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    />
  } @else if (entry().pending) {
    <app-link-card-placeholder [entryId]="entry().id" />
  }
  <app-entry-meta [entry]="entry()" [tags]="tags()" />
  <app-more-sources [entry]="entry()" />
</article>
