<article
  class="link"
  role="button"
  tabindex="0"
  [class.read]="entry().isHidden"
  (click)="actions.open(entry())"
  (keydown.enter)="actions.open(entry())"
  (keydown.space)="$event.preventDefault(); actions.open(entry())"
>
  <app-entry-kicker-line [entry]="entry()" />
  <p class="title post">{{ headline() }}</p>
  @if (card(); as shared) {
    <a
      class="card"
      [href]="shared.url"
      target="_blank"
      rel="noopener noreferrer"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      (keydown.space)="$event.stopPropagation()"
    >
      @if (shared.imageUrl && !imageFailed()) {
        <img
          appProxiedImage
          [src]="shared.imageUrl"
          alt=""
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
          (imageFailed)="imageFailed.set(true)"
        />
      }
      <div class="text">
        <small>{{ shared.siteName }}</small>
        <strong>{{ shared.title }}</strong>
        @if (shared.description) {
          <span>{{ shared.description }}</span>
        }
      </div>
    </a>
  } @else if (entry().pending) {
    <app-link-card-placeholder />
  }
  <app-entry-meta [entry]="entry()" [tags]="tags()" />
  <app-entry-duplicates [entry]="entry()" />
</article>
