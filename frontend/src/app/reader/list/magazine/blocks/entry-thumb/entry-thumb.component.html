<article
  class="thumb"
  role="button"
  tabindex="0"
  [class.read]="entry().isHidden"
  (click)="actions.open(entry())"
  (keydown.enter)="actions.open(entry())"
  (keydown.space)="$event.preventDefault(); actions.open(entry())"
>
  @if (showImage()) {
    <div class="img-frame" [class.portrait]="entry().isShort">
      <img
        class="img"
        [src]="image()!.url"
        #renditions="appRenditions"
        [appRenditions]="entry().imageRenditions"
        [renditionSizes]="coverBoxSizes"
        [attr.width]="image()!.width"
        [attr.height]="image()!.height"
        alt=""
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        (error)="renditions.fallBackToSrc() || imgError.set(true)"
      />
      @if (entry().isShort) {
        <app-short-badge form="glyph" />
      }
    </div>
  }
  <div class="body">
    <app-entry-kicker-line [entry]="entry()" />
    <p class="title">{{ entry().title }}</p>
    @if (snippet()) {
      <p class="dek">{{ snippet() }}</p>
    }
    <app-entry-meta [entry]="entry()" [tags]="tags()" [imageShown]="showImage()" />
    <app-entry-duplicates [entry]="entry()" />
  </div>
</article>
