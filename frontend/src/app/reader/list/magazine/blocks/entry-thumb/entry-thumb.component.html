<article class="thumb" [appOpensEntry]="entry()">
  <div class="top">
    @if (showImage()) {
      <div class="img-frame" [class.portrait]="portraitRatio() !== null">
        <img
          class="img"
          [src]="image()!.url"
          #renditions="appRenditions"
          [appRenditions]="entry().imageRenditions"
          [style.aspect-ratio]="portraitRatio()"
          [renditionSizes]="coverBoxSizes"
          [attr.width]="image()!.width"
          [attr.height]="image()!.height"
          alt=""
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
          (error)="renditions.fallBackToSrc() || imgError.set(true)"
        />
      </div>
    }
    <div class="body">
      <app-entry-kicker-line [entry]="entry()" />
      @if (headline()) {
        <p class="title" [class.post]="isPost()">{{ headline() }}</p>
      }
      @if (snippet()) {
        <p class="dek">{{ snippet() }}</p>
      }
    </div>
  </div>
  <!-- Full-width row under the image+text: beside the image, the text column
       could not hold the audio actions and the pills' names together (#1720). -->
  <app-entry-meta [entry]="entry()" [tags]="tags()" [imageShown]="showImage()" />
  <app-entry-duplicates [entry]="entry()" />
</article>
