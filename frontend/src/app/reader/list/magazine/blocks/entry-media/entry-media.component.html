<article class="media-share" [appOpensEntry]="entry()">
  <app-entry-kicker-line [entry]="entry()" />
  @if (headline()) {
    <p class="title" [class.post]="isPost()">{{ headline() }}</p>
  }
  @if (snippet()) {
    <p class="dek">{{ snippet() }}</p>
  }
  @let items = media();
  <div
    class="media"
    [attr.data-count]="shortPlayer() ? 1 : items.length"
    [style.--ratio]="ratio(items[0])"
  >
    @if (shortPlayer(); as player) {
      <div class="item short-player">
        @if (playingShort()) {
          <div
            class="item frame"
            [appPlayingEmbed]="player"
            [embedTitle]="headline() || ('reader.playShort' | transloco)"
          ></div>
        } @else {
          <img
            class="item"
            appProxiedImage
            [src]="items[0].url"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          />
          <button
            type="button"
            class="play"
            [attr.aria-label]="'reader.playShort' | transloco"
            (click)="playShort($event)"
            (keydown)="$event.stopPropagation()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
          </button>
        }
      </div>
    } @else {
      @for (medium of items; track medium.url) {
        @if (medium.kind === 'video') {
          <video
            class="item"
            controls
            preload="none"
            playsinline
            [attr.aria-label]="headline() || ('reader.mediaVideo' | transloco)"
            [src]="medium.url"
            [attr.poster]="medium.previewImageUrl ?? null"
            (click)="$event.stopPropagation()"
            (keydown)="$event.stopPropagation()"
          ></video>
        } @else {
          <img
            class="item"
            appProxiedImage
            [src]="medium.url"
            [attr.width]="medium.width ?? null"
            [attr.height]="medium.height ?? null"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          />
        }
      }
    }
  </div>
  <app-entry-meta [entry]="entry()" [tags]="tags()" />
  <app-entry-duplicates [entry]="entry()" />
</article>
