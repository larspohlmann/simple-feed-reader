<article class="media-share" [appOpensEntry]="entry()">
  <app-entry-kicker-line [entry]="entry()" />
  @if (headline()) {
    <p class="title" [class.post]="isPost()">{{ headline() }}</p>
  }
  @if (snippet()) {
    <p class="dek">{{ snippet() }}</p>
  }
  @let items = media();
  @if (shortPlayer(); as player) {
    <div class="media" data-count="1" [style.--ratio]="ratio(items[0])">
      <div class="item short-player">
        @if (playingShort()) {
          <div
            class="item frame"
            [appPlayingEmbed]="player"
            [embedTitle]="headline() || ('reader.playShort' | transloco)"
          ></div>
        } @else {
          <img
            class="item"
            appProxiedImage
            [src]="items[0].url"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          />
          <button
            type="button"
            class="play"
            [attr.aria-label]="'reader.playShort' | transloco"
            (click)="playShort($event)"
            (keydown)="$event.stopPropagation()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
          </button>
        }
      </div>
    </div>
  } @else {
    <app-post-media
      [media]="items"
      [ratio]="ratio(items[0])"
      [videoLabel]="headline() || ('reader.mediaVideo' | transloco)"
    />
  }
  <app-entry-meta [entry]="entry()" [tags]="tags()" />
  <app-entry-duplicates [entry]="entry()" />
</article>
