<article
  class="compact"
  role="button"
  tabindex="0"
  [class.read]="entry().isHidden"
  (click)="actions.open(entry())"
  (keydown.enter)="actions.open(entry())"
  (keydown.space)="$event.preventDefault(); actions.open(entry())"
>
  <div class="body">
    <app-entry-kicker-line [entry]="entry()" [showSource]="showSource()">
      @if (!showSource()) {
        @if (entry().isShort) {
          <app-entry-pills [tags]="[]" [short]="true" />
        }
        <app-entry-actions [entry]="entry()" />
      }
    </app-entry-kicker-line>
    <p class="title">{{ entry().title }}</p>
    @if (snippet()) {
      <p class="dek">{{ snippet() }}</p>
    }
    @if (showSource()) {
      <app-entry-meta [entry]="entry()" [tags]="tags()" [imageShown]="false" />
      <app-entry-duplicates [entry]="entry()" />
    }
  </div>
</article>
