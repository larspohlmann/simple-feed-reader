<article class="compact" [appOpensEntry]="entry()">
  <div class="body">
    <app-entry-kicker-line [entry]="entry()" [showSource]="showSource()">
      @if (!showSource()) {
        @if (shortPill()) {
          <app-entry-pills [short]="true" />
        }
        <app-entry-actions [entry]="entry()" />
      }
    </app-entry-kicker-line>
    @if (headline()) {
      <p class="title" [class.post]="isPost()">{{ headline() }}</p>
    }
    @if (snippet()) {
      <p class="dek">{{ snippet() }}</p>
    }
    @if (showSource()) {
      <app-entry-meta [entry]="entry()" [tags]="tags()" />
      <app-entry-duplicates [entry]="entry()" />
    }
  </div>
</article>
