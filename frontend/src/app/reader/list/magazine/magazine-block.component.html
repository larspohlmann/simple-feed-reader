@let current = block();
@switch (current.kind) {
  @case ('hero') {
    <app-entry-hero
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('thread') {
    <app-entry-thread
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('link') {
    <app-entry-link
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('media') {
    <app-entry-media
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('quoting') {
    <app-entry-quoting
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('wide') {
    <app-entry-wide
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('quote') {
    <app-entry-quote
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('split') {
    <app-entry-split
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [imageSide]="side(current)"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('kicker') {
    <app-entry-kicker
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('thumb') {
    <app-entry-thumb
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('compact') {
    <app-entry-compact
      [entry]="cardOf(current).entry"
      [story]="cardOf(current).story"
      [tags]="tagsFor(cardOf(current).entry.subscriptionId)"
    />
  }
  @case ('group') {
    <app-source-group
      [source]="group(current).source"
      [subscriptionId]="group(current).subscriptionId"
      [entries]="group(current).entries"
      [previewCount]="group(current).previewCount"
      [tags]="tagsFor(group(current).subscriptionId)"
    />
  }
}
