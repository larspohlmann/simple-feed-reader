@if (copies().length || story()) {
  <div class="also-foot">
    @if (story(); as story) {
      <app-story-actions [story]="story" />
    }
    @if (copies().length) {
      <app-icon class="layers" [name]="icon()" size="sm" aria-hidden="true" />
      <span class="lead">{{ label() | transloco }}</span>
    }
    @for (item of shown(); track item.copy.id) {
      <button
        type="button"
        class="also-entry reads-as-text"
        [attr.aria-expanded]="item.crossPost ? null : displayed()?.id === item.copy.id"
        [attr.aria-controls]="!item.crossPost && displayed()?.id === item.copy.id ? panelId : null"
        [attr.title]="item.feed"
        (click)="item.crossPost ? openCrossPost(item.copy, $event) : toggle(item.copy, $event)"
        (keydown.enter)="$event.stopPropagation()"
        (keydown.space)="$event.stopPropagation()"
      >
        <span class="feed">{{ item.feed }}</span>
        @if (item.crossPost) {
          @if (item.score; as score) {
            <span
              class="count"
              role="img"
              [attr.aria-label]="score.labelKey | transloco: { count: score.count }"
            >
              <app-icon name="arrow_upward" size="sm" aria-hidden="true" />{{ score.text }}
            </span>
          }
          @if (item.comments; as comments) {
            <span
              class="count"
              role="img"
              [attr.aria-label]="comments.labelKey | transloco: { count: comments.count }"
            >
              <app-icon name="chat_bubble" size="sm" aria-hidden="true" />{{ comments.text }}
            </span>
          }
        } @else {
          <span class="sep">·</span>
          <span class="t">{{ item.when }}</span>
        }
      </button>
    }
    @if (hiddenCount() > 0) {
      <button
        type="button"
        class="also-more reads-as-text"
        (click)="showAll($event)"
        (keydown.enter)="$event.stopPropagation()"
        (keydown.space)="$event.stopPropagation()"
      >
        {{ 'reader.alsoMore' | transloco: { count: hiddenCount() } }}
      </button>
    }
  </div>
  @if (origin(); as trigger) {
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="!!displayed()"
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayViewportMargin]="viewportMargin"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (overlayOutsideClick)="close()"
      (overlayKeydown)="$event.key === 'Escape' && close()"
    >
      @if (displayed(); as copy) {
        <div class="dup-popover text-scaled" [id]="panelId" role="note">
          <span class="popover-heading">{{ 'reader.alsoPublishedAs' | transloco }}</span>
          <app-entry-row [appStory]="null" [entry]="copy" />
        </div>
      }
    </ng-template>
  }
}
