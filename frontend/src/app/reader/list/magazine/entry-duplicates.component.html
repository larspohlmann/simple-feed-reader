@if (copies().length) {
  <div class="also-foot">
    <app-icon class="layers" [name]="icon()" size="sm" aria-hidden="true" />
    <span class="lead">{{ label() | transloco }}</span>
    @for (item of shown(); track item.copy.id) {
      @if (item.crossPost) {
        <button
          type="button"
          class="also-entry"
          [attr.title]="item.feed"
          (click)="openCrossPost(item.copy, $event)"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()"
        >
          <span class="feed">{{ item.feed }}</span>
          @for (count of item.counts; track count.icon) {
            <span
              class="count"
              role="img"
              [attr.aria-label]="count.labelKey | transloco: { count: count.count }"
            >
              <app-icon [name]="count.icon" size="sm" aria-hidden="true" />{{ count.text }}
            </span>
          }
        </button>
      } @else {
        <button
          type="button"
          class="also-entry"
          [attr.aria-expanded]="displayed()?.id === item.copy.id"
          [attr.aria-controls]="displayed()?.id === item.copy.id ? panelId : null"
          [attr.title]="item.feed"
          (click)="toggle(item.copy, $event)"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()"
        >
          <span class="feed">{{ item.feed }}</span>
          <span class="sep">·</span>
          <span class="t">{{ item.when }}</span>
        </button>
      }
    }
    @if (hiddenCount() > 0) {
      <button
        type="button"
        class="also-more"
        (click)="showAll($event)"
        (keydown.enter)="$event.stopPropagation()"
        (keydown.space)="$event.stopPropagation()"
      >
        {{ 'reader.alsoMore' | transloco: { count: hiddenCount() } }}
      </button>
    }
  </div>
  @if (origin(); as trigger) {
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="!!displayed()"
      [cdkConnectedOverlayPositions]="positions"
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayViewportMargin]="viewportMargin"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="close()"
      (overlayOutsideClick)="close()"
      (overlayKeydown)="$event.key === 'Escape' && close()"
    >
      @if (displayed(); as copy) {
        <div class="dup-popover text-scaled" [id]="panelId" role="note">
          <span class="popover-heading">{{ 'reader.alsoPublishedAs' | transloco }}</span>
          <app-entry-row [appStory]="null" [entry]="copy" />
        </div>
      }
    </ng-template>
  }
}
