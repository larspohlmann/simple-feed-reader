<article
  class="row"
  role="button"
  tabindex="0"
  [class.read]="entry().isHidden"
  [class.img-left]="imageSide() === 'left'"
  (click)="actions.open(entry())"
  (keydown.enter)="actions.open(entry())"
  (keydown.space)="$event.preventDefault(); actions.open(entry())"
>
  <div class="body">
    <h3 class="title">
      @if (marking()) {
        <app-marked-text [text]="entry().title" [terms]="terms()" />
      } @else {
        {{ entry().title }}
      }
    </h3>
    <p class="meta">
      <app-favicon [url]="entry().faviconUrl" [size]="14" />{{ entry().source }} · {{ when() }}
      <span class="dot" [class.on]="!entry().isHidden" aria-hidden="true"></span>
    </p>
    <p class="snippet">
      @if (marking()) {
        <app-marked-text [text]="snippet()" [terms]="terms()" />
      } @else {
        {{ snippet() }}
      }
    </p>
    <div class="tagline">
      <app-entry-pills [tags]="tags()" [savedSearches]="entry().savedSearches ?? []" />
      <app-entry-actions [entry]="entry()" size="md" />
    </div>
    <app-entry-duplicates [entry]="entry()" />
  </div>
  @if (image() && !imgError()) {
    <img
      class="thumb"
      [src]="image()!"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="imgError.set(true)"
    />
  }
</article>
