<article
  class="row"
  role="button"
  tabindex="0"
  [class.read]="entry().isHidden"
  [class.img-left]="imageSide() === 'left'"
  (click)="actions.open(entry())"
  (keydown.enter)="actions.open(entry())"
  (keydown.space)="$event.preventDefault(); actions.open(entry())"
>
  <div class="body">
    <h3 class="title" [class.post]="isPost()">
      @if (marking()) {
        <app-marked-text [text]="headline()" [terms]="terms()" />
      } @else {
        {{ headline() }}
      }
    </h3>
    <p class="meta">
      <app-favicon [url]="entry().faviconUrl" [size]="14" />{{ entry().source }} · {{ when() }}
      <span class="dot" [class.on]="!entry().isHidden" aria-hidden="true"></span>
    </p>
    @if (!isPost()) {
      <p class="snippet">
        @if (marking()) {
          <app-marked-text [text]="snippet()" [terms]="terms()" />
        } @else {
          {{ snippet() }}
        }
      </p>
    }
    <div class="tagline">
      <app-entry-pills
        [tags]="tags()"
        [savedSearches]="entry().savedSearches ?? []"
        [short]="shortPill()"
      />
      <app-entry-actions [entry]="entry()" size="md" />
    </div>
    <app-entry-duplicates [entry]="entry()" />
  </div>
  @if (showImage()) {
    <div class="img-frame" [class.portrait]="portraitRatio() !== null">
      <img
        class="thumb"
        [src]="image()!"
        #renditions="appRenditions"
        [appRenditions]="entry().imageRenditions"
        [style.aspect-ratio]="portraitRatio()"
        [renditionSizes]="coverBoxSizes"
        alt=""
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        (error)="renditions.fallBackToSrc() || imgError.set(true)"
      />
      @if (entry().isShort) {
        <app-short-badge />
      }
    </div>
  }
</article>
