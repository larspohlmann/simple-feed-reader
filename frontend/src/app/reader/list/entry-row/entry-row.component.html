<article class="row" [appOpensEntry]="entry()" [class.img-left]="imageSide() === 'left'">
  <div class="body">
    @if (headline()) {
      <h3 class="title" [class.post]="isPost()">
        @if (marking()) {
          <app-marked-text [text]="headline()" [terms]="terms()" />
        } @else {
          {{ headline() }}
        }
      </h3>
    }
    <p class="meta">
      <app-entry-source [entry]="entry()" layout="row" [size]="14" />
      · {{ when() }}
      <span class="dot" [class.on]="!entry().isHidden" aria-hidden="true"></span>
    </p>
    @if (snippet()) {
      <p class="snippet">
        @if (marking()) {
          <app-marked-text [text]="snippet()" [terms]="terms()" />
        } @else {
          {{ snippet() }}
        }
      </p>
    }
    <div class="tagline">
      <app-entry-pills
        [tags]="tags()"
        [subscriptionId]="entry().subscriptionId"
        [savedSearches]="entry().savedSearches ?? []"
        [short]="shortPill()"
      />
      <app-entry-actions [entry]="entry()" size="md" />
    </div>
    <app-entry-duplicates [entry]="entry()" />
  </div>
  @if (showImage()) {
    <div class="img-frame" [class.portrait]="portraitRatio() !== null">
      <img
        class="thumb"
        [src]="image()!"
        #renditions="appRenditions"
        [appRenditions]="entry().imageRenditions"
        [style.aspect-ratio]="portraitRatio()"
        [renditionSizes]="coverBoxSizes"
        alt=""
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        (error)="renditions.fallBackToSrc() || imgError.set(true)"
      />
      @if (entry().shortPlayerUrl) {
        <app-short-badge />
      }
    </div>
  }
</article>
