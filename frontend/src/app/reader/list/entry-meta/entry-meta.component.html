@let score = entry().score;
@if (score !== null) {
  <span class="discussion">
    <app-vote-pill [score]="score" />
    @if (compactCommentCount(); as commentCount) {
      <span
        class="comments"
        role="img"
        [attr.aria-label]="commentsKey() | transloco: { count: entry().commentCount }"
      >
        <app-icon name="chat_bubble" size="sm" aria-hidden="true" />{{ commentCount }}
      </span>
    }
  </span>
}
<app-entry-pills
  [tags]="tags()"
  [subscriptionId]="entry().subscriptionId"
  [savedSearches]="entry().savedSearches ?? []"
  [short]="shortPill()"
/>
<app-entry-actions [entry]="entry()" [size]="size()" />
