@let score = entry().score;
@let commentBubble = comments();
@let likeShown = showsLike();
@if (score !== null || likeShown || commentBubble !== null) {
  <span class="discussion">
    @if (score !== null) {
      <app-vote-pill [score]="score" [myVote]="entry().myVote" [vote]="voteOnEntry" />
    }
    @if (likeShown) {
      <app-entry-like [entry]="entry()" />
    }
    @if (commentBubble !== null) {
      <span
        class="comments"
        role="img"
        [attr.aria-label]="commentBubble.labelKey | transloco: { count: commentBubble.count }"
      >
        <app-icon name="chat_bubble" size="sm" aria-hidden="true" />{{ commentBubble.text }}
      </span>
    }
  </span>
}
<app-entry-pills
  [tags]="tags()"
  [subscriptionId]="entry().subscriptionId"
  [savedSearches]="entry().savedSearches ?? []"
  [short]="shortPill()"
  [labelled]="entry()"
/>
<app-entry-actions [entry]="entry()" [size]="size()" [like]="false" />
