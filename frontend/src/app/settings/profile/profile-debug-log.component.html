@if (entries().length > 0) {
  <div class="profile-log" data-testid="profile-log">
    <ol class="profile-log__list">
      @for (entry of entries(); track entry.id) {
        <li>
          <app-debug-log-entry
            [entry]="entry"
            [expanded]="expanded().has(entry.id)"
            [detail]="details().get(entry.id) ?? null"
            (toggled)="toggle(entry.id)"
          />
        </li>
      }
    </ol>
  </div>
}
