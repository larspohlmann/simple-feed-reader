@if (entries().length > 0) {
  <div class="profile-log" data-testid="profile-log">
    <ol class="profile-log__list">
      @for (entry of entries(); track entry.id) {
        <li>
          <app-debug-log-entry
            [entry]="entry"
            [expanded]="details.isExpanded(entry.id)"
            [detail]="details.detailFor(entry.id)"
            (toggled)="details.toggle(entry.id)"
          />
        </li>
        @if (entry.adjustment; as adjustment) {
          <li>
            <app-debug-log-adjustment [adjustment]="adjustment" />
          </li>
        }
      }
    </ol>
  </div>
}
