<app-settings-stack>
  <app-settings-group icon="mail" [title]="'settings.email.title' | transloco">
    @if (state() === 'mailDisabled') {
      <div class="callout">
        <app-icon name="info" size="sm" />
        <span>{{ 'settings.email.mailDisabled' | transloco }}</span>
      </div>
    } @else {
      @if (state() === 'unverified') {
        <div class="callout">
          <app-icon name="info" size="sm" />
          <span>{{ 'settings.email.unverified' | transloco }}</span>
          <app-button size="sm" [loading]="resending()" (click)="resend()">
            {{ 'settings.email.resend' | transloco }}
          </app-button>
        </div>
      }

      <app-settings-row
        [title]="'settings.email.enable' | transloco"
        labelFor="digest-enable-toggle"
      >
        <app-toggle
          inputId="digest-enable-toggle"
          [checked]="digest.enabled()"
          [disabled]="controlsDisabled()"
          [label]="'settings.email.enable' | transloco"
          (toggled)="digest.setEnabled($event)"
        />
      </app-settings-row>

      <app-settings-row [stackable]="true" [title]="'settings.email.cadence' | transloco">
        <select
          data-testid="digest-cadence"
          [disabled]="controlsDisabled()"
          (change)="onCadence($event)"
        >
          <option value="daily" [selected]="digest.cadence() === 'daily'">
            {{ 'settings.email.daily' | transloco }}
          </option>
          <option value="weekly" [selected]="digest.cadence() === 'weekly'">
            {{ 'settings.email.weekly' | transloco }}
          </option>
        </select>
      </app-settings-row>

      <app-settings-row [stackable]="true" [title]="'settings.email.sendHour' | transloco">
        <select
          data-testid="digest-send-hour"
          [disabled]="controlsDisabled()"
          (change)="onSendHour($event)"
        >
          @for (hour of hours; track hour) {
            <option [value]="hour" [selected]="digest.sendHour() === hour">{{ hour }}</option>
          }
        </select>
      </app-settings-row>

      @if (digest.cadence() === 'weekly') {
        <app-settings-row [stackable]="true" [title]="'settings.email.weekday' | transloco">
          <select
            data-testid="digest-weekday"
            [disabled]="controlsDisabled()"
            (change)="onWeekday($event)"
          >
            @for (day of weekdays; track day.value) {
              <option [value]="day.value" [selected]="digest.weekday() === day.value">
                {{ day.labelKey | transloco }}
              </option>
            }
          </select>
        </app-settings-row>
      }
    }
  </app-settings-group>
</app-settings-stack>
