<app-settings-card [heading]="'settings.account.title' | transloco">
  @if (auth.user(); as u) {
    <div class="who">
      <app-user-avatar [email]="u.email" [size]="48" />
      <span class="who-email">{{ u.email }}</span>
    </div>
    <dl class="grid">
      <dt>{{ 'settings.account.memberSince' | transloco }}</dt>
      <dd>{{ memberSince(u.createdAt) }}</dd>
    </dl>
    <app-button class="signout" (click)="auth.logout()">
      {{ 'settings.account.signOut' | transloco }}
    </app-button>
    <div class="danger-zone">
      <p class="danger-zone__note">{{ 'settings.account.deleteNote' | transloco }}</p>
      <app-button variant="danger-outline" (click)="confirmThenDelete()">
        {{ 'settings.account.delete' | transloco }}
      </app-button>
      @if (deleteError(); as error) {
        <app-error-banner [message]="error.detail || error.title" />
      }
    </div>
  }
</app-settings-card>
