<app-settings-card [heading]="'settings.account.title' | transloco">
  @if (auth.user(); as u) {
    <div class="who">
      <app-user-avatar [email]="u.email" [size]="48" />
      <span class="who-email">{{ u.email }}</span>
    </div>
    <dl class="grid">
      <dt>{{ 'settings.account.memberSince' | transloco }}</dt>
      <dd>{{ memberSince(u.createdAt) }}</dd>
    </dl>
    <app-button class="signout" (click)="auth.logout()">
      {{ 'settings.account.signOut' | transloco }}
    </app-button>
  }
</app-settings-card>
