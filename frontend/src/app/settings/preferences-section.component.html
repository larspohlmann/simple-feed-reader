<app-settings-card [heading]="'settings.preferences' | transloco">
  <div class="row">
    <span>{{ 'lang.label' | transloco }}</span>
    <app-language-switcher />
  </div>
  @if (language.saveFailed()) {
    <app-error-banner [message]="'settings.languageSaveFailed' | transloco" />
  }
</app-settings-card>
