<app-settings-stack>
  <app-settings-group icon="tune" [title]="'settings.preferences' | transloco">
    <app-settings-row [title]="'lang.label' | transloco" [stackable]="true">
      <app-segmented-choice
        [options]="languages"
        [selected]="language.lang()"
        ariaLabelKey="lang.label"
        labelPrefix="lang."
        (pick)="language.set($event)"
      />
    </app-settings-row>
    @if (language.saveFailed()) {
      <app-error-banner class="state" [message]="'settings.languageSaveFailed' | transloco" />
    }

    <app-settings-row
      [title]="'settings.scraping' | transloco"
      [description]="'settings.scrapingHint' | transloco"
      labelFor="scrape-fallback-toggle"
    >
      <span rowTitleTip class="badge">{{ 'settings.experimental' | transloco }}</span>
      <app-toggle
        inputId="scrape-fallback-toggle"
        [checked]="preferences.scrapeFallbackEnabled()"
        [label]="'settings.scraping' | transloco"
        (toggled)="preferences.setScrapeFallbackEnabled($event)"
      />
    </app-settings-row>
    @if (preferences.saveFailed()) {
      <app-error-banner class="state" [message]="'settings.scrapingSaveFailed' | transloco" />
    }

    <app-settings-row
      [title]="'settings.readingFocus' | transloco"
      [description]="'settings.readingFocusHint' | transloco"
      labelFor="reading-focus-toggle"
    >
      <app-toggle
        inputId="reading-focus-toggle"
        [checked]="readingFocus.enabled()"
        [label]="'settings.readingFocus' | transloco"
        (toggled)="readingFocus.setEnabled($event)"
      />
    </app-settings-row>

    <app-settings-row
      [title]="'settings.magazineStyle' | transloco"
      [description]="'settings.magazineStyleHint' | transloco"
      [stackable]="true"
    >
      <app-segmented-choice
        [options]="magazineStyles"
        [selected]="magazineStyle.style()"
        ariaLabelKey="settings.magazineStyle"
        labelPrefix="settings.magazineStyleOption."
        (pick)="magazineStyle.set($event)"
      />
    </app-settings-row>
    @if (magazineStyle.saveFailed()) {
      <app-error-banner class="state" [message]="'settings.magazineStyleSaveFailed' | transloco" />
    }
  </app-settings-group>
</app-settings-stack>
