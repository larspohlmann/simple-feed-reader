@if (sections().length > 0) {
  <app-settings-card
    class="run-history"
    [heading]="'settings.ai.recommendations.historyTitle' | transloco"
    [description]="'settings.ai.recommendations.historyHint' | transloco"
  >
    <p class="run-history__total">
      <span class="run-history__total-label">
        {{ 'settings.ai.recommendations.historyTotal' | transloco }}
      </span>
      <span class="run-history__total-value">{{ cost(totalCostNanoCredits()) }}</span>
    </p>

    <ul class="run-history__months">
      @for (section of sections(); track section.month) {
        <li class="run-history__month">
          <app-recommendation-run-history-month
            [month]="section.month"
            [runCount]="section.runCount"
            [costNanoCredits]="section.costNanoCredits"
            [runs]="section.runs"
            [nextCursor]="section.nextCursor"
            [loading]="section.loading"
            (opened)="onOpened(section.month)"
            (showMore)="onShowMore(section.month)"
          />
        </li>
      }
    </ul>
  </app-settings-card>
}
