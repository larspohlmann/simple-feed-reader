<app-settings-stack>
  <app-settings-group icon="toggle_on" [title]="'settings.instance.title' | transloco">
    @if (loading()) {
      <app-skeleton class="state" [label]="'settings.instance.loading' | transloco" [rows]="2" />
    } @else if (error()) {
      <app-error-banner
        class="state"
        [message]="error()!.detail || error()!.title"
        [actionLabel]="'settings.instance.retry' | transloco"
        (action)="load()"
      />
    } @else {
      <app-settings-row
        [title]="'settings.instance.requireEmailConfirmation' | transloco"
        [description]="
          (mailEnabled()
            ? 'settings.instance.requireEmailConfirmationHint'
            : 'settings.instance.mailDisabledHint'
          ) | transloco
        "
        labelFor="require-email-confirmation-toggle"
      >
        <app-toggle
          inputId="require-email-confirmation-toggle"
          [checked]="requireEmailConfirmation()"
          [disabled]="!mailEnabled()"
          [label]="'settings.instance.requireEmailConfirmation' | transloco"
          (toggled)="toggleEmailConfirmation()"
        />
      </app-settings-row>

      <app-settings-row
        [title]="'settings.instance.requireApproval' | transloco"
        [description]="'settings.instance.requireApprovalHint' | transloco"
        labelFor="require-approval-toggle"
      >
        <app-toggle
          inputId="require-approval-toggle"
          [checked]="requireApproval()"
          [label]="'settings.instance.requireApproval' | transloco"
          (toggled)="toggleApproval()"
        />
      </app-settings-row>

      <app-settings-row
        [title]="'settings.instance.publicBaseUrl' | transloco"
        [description]="'settings.instance.publicBaseUrlHint' | transloco"
        labelFor="public-base-url-input"
        [stackable]="true"
      >
        <input
          id="public-base-url-input"
          type="url"
          inputmode="url"
          autocomplete="off"
          [value]="publicBaseUrl() ?? ''"
          [attr.aria-label]="'settings.instance.publicBaseUrl' | transloco"
          [placeholder]="'settings.instance.publicBaseUrlPlaceholder' | transloco"
          (change)="savePublicBaseUrl($any($event.target).value)"
        />
      </app-settings-row>
    }
  </app-settings-group>
</app-settings-stack>
