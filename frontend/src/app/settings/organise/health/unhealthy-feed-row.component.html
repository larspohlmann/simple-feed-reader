<app-disclosure appearance="row-lead">
  <div summary class="summary">
    <app-icon
      class="status"
      [class.dead]="isGone()"
      [class.failing]="!isGone()"
      [name]="statusIcon()"
      size="sm"
    />
    <span class="sr-only">
      {{ (isGone() ? 'settings.health.pill.dead' : 'settings.health.pill.failing') | transloco }}
    </span>
    <span class="title">{{ subscription().title }}</span>

    <span class="reason">{{ reason().key | transloco: reason().params }}</span>

    <span class="acts">
      <app-button
        variant="outline"
        size="sm"
        data-test="retry"
        (click)="$event.preventDefault(); $event.stopPropagation(); retry.emit()"
      >
        {{ 'settings.health.action.retry' | transloco }}
      </app-button>
      <app-button
        variant="outline"
        size="sm"
        data-test="unsubscribe"
        [ariaLabel]="'settings.health.action.unsubscribe' | transloco"
        (click)="$event.preventDefault(); $event.stopPropagation(); unsubscribe.emit()"
      >
        <app-icon class="trash-icon" name="delete" size="sm" />
      </app-button>
    </span>
  </div>

  <div class="detail-indent">
    <app-feed-health-facts [subscription]="subscription()" />

    @if (subscription().lastErrorMessage; as technical) {
      <app-warning-box class="error">
        <code>{{ technical }}</code>
      </app-warning-box>
    }
  </div>
</app-disclosure>
