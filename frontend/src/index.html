<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>simple feed reader</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Document-wide no-referrer policy (#497): article-body images are injected
      via [innerHTML] with no referrerpolicy attribute, so without this they leak
      the app origin in Referer and hotlink-protecting CDNs answer with a 403.
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      Order matters: Chromium picks the *last* icon candidate, so the vector mark
      goes last and the raster fallbacks ahead of it (#137).
    -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=7" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=7" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=7" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('sfr.theme');
          var dark =
            m === 'dark' ||
            ((m === 'system' || !m) && matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          // Brightness (#832): bounds mirror BRIGHTNESS_MAX in app/theme/brightness.ts.
          var step = parseInt(localStorage.getItem('sfr.brightness.' + theme), 10);
          var clamped = Math.max(dark ? -3 : -6, Math.min(dark ? 3 : 0, isNaN(step) ? 0 : step));
          document.documentElement.setAttribute('data-brightness', String(clamped));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <!--
      Revealed when boot fails (#280, #282): by main.ts, by withNavigationErrorHandler,
      or by the watchdog below. Static and style-inlined because no bundle code is
      trustworthy at that point; both languages because no dictionary loaded either.
    -->
    <div id="boot-error" hidden style="padding: 2rem; text-align: center; font-family: system-ui">
      <p>The app could not start. / Die App konnte nicht gestartet werden.</p>
      <button onclick="location.reload()">Reload / Neu laden</button>
    </div>
    <!--
      Boot watchdog (#282): a lazy chunk that STALLS raises no event (a hung
      import() never rejects), so no handler in the bundle can ever run.
      Symptom-level on purpose — covers every silent boot stall with no app-side hook.
    -->
    <script>
      (function () {
        // 15 s is long past any working load on a slow connection, yet still
        // reaches the user staring at a genuinely dead boot. A false positive
        // costs only a brief flash: the observer below re-hides the surface
        // the moment real content arrives.
        var BOOT_DEADLINE_MS = 15000;
        try {
          var surface = document.getElementById('boot-error');
          var root = document.querySelector('app-root');
          var timer = setTimeout(function () {
            console.error('Boot watchdog: no content within ' + BOOT_DEADLINE_MS + ' ms.');
            surface.removeAttribute('hidden');
          }, BOOT_DEADLINE_MS);
          // app.html holds nothing but <router-outlet>, which Angular appends
          // ~70 ms into bootstrap — long before a lazy route chunk is even
          // requested. So "a node appeared" is not "the app rendered": the
          // timer has to survive until something OTHER than the outlet exists,
          // or a stalled route chunk cancels the watchdog and still leaves a
          // blank page (#282). app.html keeps its failure banner behind an @if
          // for this reason (#285): a false @if renders only a comment anchor,
          // which querySelector ignores. Static chrome there would disarm this
          // watchdog ~70 ms into bootstrap and bring #282 back.
          new MutationObserver(function (mutations, observer) {
            if (!root.querySelector(':not(router-outlet)')) return;
            clearTimeout(timer);
            surface.setAttribute('hidden', '');
            observer.disconnect();
          }).observe(root, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
