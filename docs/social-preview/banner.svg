<!-- Regenerate banner.png: rsvg-convert -w 1280 -h 640 banner.svg -o banner.png (GitHub hides ~78px at the top and bottom in topic lists; keep content inside y 120–510) -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa694"/>
      <stop offset="1" stop-color="#3f8676"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aa694" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5aa694" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clipBack"><rect width="180" height="320" rx="16"/></clipPath>
    <clipPath id="clipFront"><rect width="200" height="350" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#teal)"/>

  <!-- ===== LEFT: identity ===== -->
  <g transform="translate(96,192)">
    <g transform="scale(1.15)">
      <circle cx="3" cy="18" r="2.1" fill="#5aa694"/>
      <path d="M3 10 a8 8 0 0 1 8 8" fill="none" stroke="#5aa694" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M3 4 a14 14 0 0 1 14 14" fill="none" stroke="#5aa694" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="34" y="19" font-size="19" letter-spacing="4" font-weight="600" fill="#8f8f8b">MAGAZINE-STYLE READER</text>
  </g>

  <text x="94" y="286" font-size="60" font-weight="700" letter-spacing="-1.4" fill="#ededeb">simple-</text>
  <text x="94" y="352" font-size="60" font-weight="700" letter-spacing="-1.4">
    <tspan fill="#5aa694">feed</tspan><tspan fill="#ededeb">-reader</tspan>
  </text>
  <text x="96" y="402" font-size="26" fill="#9a9a97">Your feeds, laid out like a magazine.</text>
  <text x="96" y="436" font-size="26" fill="#9a9a97">Multi-user. Self-hosted. Open source.</text>


  <!-- ===== RIGHT: fanned cards with real screenshots ===== -->
  <!-- back-left: dark sidebar -->
  <g transform="translate(716,160) rotate(-8)" filter="url(#shadow)">
    <image href="shot-ios-sidebar.jpg" width="180" height="320" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipBack)"/>
    <rect width="180" height="320" rx="16" fill="none" stroke="#383836" stroke-width="1.5"/>
  </g>
  <!-- right: light magazine list -->
  <g transform="translate(1030,132) rotate(8)" filter="url(#shadow)">
    <image href="shot-ios-light.jpg" width="180" height="320" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipBack)"/>
    <rect width="180" height="320" rx="16" fill="none" stroke="#383836" stroke-width="1.5"/>
  </g>
  <!-- front: dark magazine list -->
  <g transform="translate(866,148)" filter="url(#shadow)">
    <image href="shot-ios-dark.jpg" width="200" height="350" preserveAspectRatio="xMidYMin slice" clip-path="url(#clipFront)"/>
    <rect width="200" height="350" rx="16" fill="none" stroke="#4a4a48" stroke-width="1.5"/>
  </g>
</svg>
