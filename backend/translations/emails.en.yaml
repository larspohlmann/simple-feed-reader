# Account emails. Bodies are single-quoted single lines with explicit \n so the
# rendered text stays flush-left (the link must sit on its own un-indented line).
verify:
    subject: 'Confirm your email address'
    body: "Welcome to Simple Feed Reader.\n\nConfirm your email address by opening this link:\n\n%link%\n\nThe link is valid for 24 hours. After confirming, an administrator\nreviews your account before you can sign in.\n\nIf you did not sign up, ignore this message — the account is\ndeleted automatically within 48 hours."
approved:
    subject: 'Your account has been approved'
    body: "Your Simple Feed Reader account has been approved.\n\nYou can now sign in at %url%"
reset:
    subject: 'Reset your password'
    body: "Someone requested a password reset for your Simple Feed Reader\naccount.\n\nChoose a new password here:\n\n%link%\n\nThe link is valid for 24 hours and can be used once. If you did\nnot request this, ignore this message — your password is unchanged."
admin_pending_approval:
    subject: 'A new user is awaiting approval'
    body: "A new user has registered and needs your approval.\n\nEmail: %applicant_email%\nSigned up via: %method%\nUsers awaiting approval: %pending_count%\n\nReview and approve them here:\n\n%review_url%"
    method_email_password: 'email and password'
digest:
    subject: 'New in your feeds: %count% entries'
    intro: "New entries from what you follow, grouped by section."
    group_heading: '%term% (%count%)'
    more: '+ more → %url%'
    footer: 'Manage your digest in Settings → Email.'
    header: '%date% · %count% new entries'
    open_reader: 'Open in the reader'
    manage_html: 'Manage your digest in %link%.'
    manage_link_label: 'Settings → Email'
    more_link: '+%count% more in "%term%"'
    for_you_stream_heading: 'For you stream (%count%)'
    for_you_stream_more_link: '+%count% more in your For you stream'
