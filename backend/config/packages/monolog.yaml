monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - client_errors # Frontend error reports; LokiPushHandler labels this channel source=frontend

when@dev:
    monolog:
        handlers:
            # rotating_file, not stream: a stream grew dev.log to 1.4 GiB (#596). Three daily files; the level stays
            # debug because the dev-log scan needs it. The active file is dev-YYYY-MM-DD.log.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 3
                level: debug
                channels: ["!event"]
                formatter: monolog.formatter.json
            loki:
                type: service
                id: App\Service\Logging\Loki\LokiPushHandler
                level: info
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            # rotating_file for the same reason as dev: a red suite flushes its
            # whole debug buffer through fingers_crossed, and a plain stream let
            # test.log reach 397 MiB (#596). Daily rotation prunes old days.
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 3
                level: debug
            # client_errors only, unlike dev and prod: the test proves the channel reaches LokiPushHandler without
            # every channel's noise (doctrine's connect log) landing in the shared buffer.
            loki:
                type: service
                id: App\Service\Logging\Loki\LokiPushHandler
                level: info
                channels: ["client_errors"]

when@prod:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: info
                max_files: 7
                formatter: monolog.formatter.json
            loki:
                type: service
                id: App\Service\Logging\Loki\LokiPushHandler
                level: info
                channels: ["!event"]
