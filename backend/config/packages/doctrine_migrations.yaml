doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # No transaction per migration: MySQL auto-commits DDL, so the wrapper protected nothing and doctrine/migrations
    # deprecates the mismatch. On SQLite (dev, test) a failed migration no longer rolls back; CI proves each one.
    transactional: false
