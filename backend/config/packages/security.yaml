security:
    # AccountStatus lets the pending/suspended 403 through; UserNotFoundException stays masked as bad credentials.
    # Never `All`: exposing it turns login into an enumeration oracle (docs/security.md#account-status-checks).
    expose_security_errors: !php/enum Symfony\Component\Security\Http\Authentication\ExposeSecurityLevel::AccountStatus

    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_users:
            entity:
                class: App\Entity\User
                # No `property: email`: it would look the submitted identifier up verbatim, skipping the case
                # normalisation UserRepository::loadUserByIdentifier applies, so `Bob@` would not find `bob@`.

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Machine callers authenticate with a shared token inside the
        # controller, not through the security layer.
        maintenance:
            pattern: ^/maintenance
            security: false

        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_users
            # LoginUserChecker checks status only after the password verified, so a wrong password cannot reveal a
            # suspended account (docs/security.md#account-status-checks).
            user_checker: App\Security\LoginUserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # Must stay between `login` and `api`: firewalls match in order and `api` takes every ^/api path, so a passkey
        # login would fall through to the JWT firewall and 401 (docs/security.md#passkey-login-firewall).
        passkey_login:
            pattern: ^/api/auth/passkey/login$
            stateless: true
            provider: app_users
            # The same checker json_login uses: status is tested only after
            # the credential is verified, never before — see
            # App\Security\LoginUserChecker.
            user_checker: App\Security\LoginUserChecker
            custom_authenticator: App\Security\PasskeyAuthenticator
            # No identifier to key on: PasskeyAuthenticator's fixed sentinel gives one bucket per client IP, five
            # attempts a quarter hour (docs/security.md#passkey-login-firewall).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            jwt: ~
            entry_point: jwt

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        # These two must precede ^/api/auth/ (first match wins), or passkey enrolment is open to anyone.
        # /api/auth/passkey/login stays public: the flow is discoverable-credential only.
        - { path: ^/api/auth/passkey/register, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/passkeys, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/setup/, roles: PUBLIC_ACCESS }
        # Catalog favicons are public image bytes for plain <img> tags, which cannot send the JWT; no user data.
        - { path: '^/api/catalog/feeds/\d+/favicon$', roles: PUBLIC_ACCESS }
        # Frontend error ingest (#984). Anonymous is allowed — errors happen
        # while logged out — but the api firewall still runs the JWT
        # authenticator, so a logged-in report resolves a #[CurrentUser].
        - { path: ^/api/client-errors$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/, roles: ROLE_ADMIN }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Tests create many users; the real cost factor makes the suite crawl.
            App\Entity\User:
                algorithm: plaintext
