security:
    # Default is `None`, which rewrites every AccountStatusException into a
    # BadCredentialsException — the pending/suspended 403 would silently become
    # a 401 and the spec's per-status message would be unreachable.
    #
    # `AccountStatus` exposes ONLY account-status errors. It deliberately does
    # NOT expose UserNotFoundException, which stays masked as bad credentials —
    # that masking is what keeps "unknown email" and "wrong password"
    # indistinguishable. Never raise this to `All`: that would expose
    # UserNotFoundException and turn login into an enumeration oracle.
    expose_security_errors: !php/enum Symfony\Component\Security\Http\Authentication\ExposeSecurityLevel::AccountStatus

    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_users:
            entity:
                class: App\Entity\User
                # No `property: email` on purpose. That option makes
                # EntityUserProvider query the submitted identifier verbatim,
                # which would bypass the case normalisation every write and
                # every other lookup goes through — so a user who registered as
                # `bob@` and typed `Bob@` here would get an unexplained 401.
                # Omitting it delegates to UserRepository::loadUserByIdentifier,
                # keeping normalisation in exactly one place.

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Machine callers authenticate with a shared token inside the
        # controller, not through the security layer.
        maintenance:
            pattern: ^/maintenance
            security: false

        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_users
            # NOT the same checker as the api firewall below. This one checks
            # status in checkPostAuth, i.e. only after the password has been
            # verified, so a wrong password cannot reveal that an address is
            # registered-but-suspended. See App\Security\LoginUserChecker.
            user_checker: App\Security\LoginUserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # ORDER MATTERS. Firewalls match in declaration order and `api` below
        # matches every `^/api` path, so this block MUST stay between `login`
        # and `api` — placed after `api`, it would never be reached and every
        # passkey login would silently fall through to the jwt-only firewall
        # and 401. See PasskeyAuthenticator's own docblock for how the
        # authenticator reuses json_login's success/failure handlers despite
        # authenticating differently.
        passkey_login:
            pattern: ^/api/auth/passkey/login$
            stateless: true
            provider: app_users
            # The same checker json_login uses: status is tested only after
            # the credential is verified, never before — see
            # App\Security\LoginUserChecker.
            user_checker: App\Security\LoginUserChecker
            custom_authenticator: App\Security\PasskeyAuthenticator
            # The request carries no e-mail, so DefaultLoginRateLimiter finds
            # an empty identifier (PasskeyAuthenticator passes '' to
            # UserBadge) and this becomes five attempts per quarter hour per
            # client IP. That is the right budget for a flow with no
            # identifier to key on.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            jwt: ~
            entry_point: jwt

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        # Both sit under ^/api/auth/, which the next rule makes public, and the
        # first match wins — so without these two the enrolment endpoints are
        # open to anyone. The first also covers /register/options; the second
        # also covers /passkeys/{id}. Neither matches /passkey/login, which is
        # public on purpose (the flow is discoverable-credential only).
        - { path: ^/api/auth/passkey/register, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/passkeys, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/setup/, roles: PUBLIC_ACCESS }
        # Catalog favicons are public image bytes (cached icon or a monogram
        # placeholder), served to plain <img> tags that cannot carry the bearer
        # JWT. They hold no user data — the subscribed flags live on the
        # authenticated /api/catalog list, not here — so this one path is public.
        - { path: '^/api/catalog/feeds/\d+/favicon$', roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/, roles: ROLE_ADMIN }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Tests create many users; the real cost factor makes the suite crawl.
            App\Entity\User:
                algorithm: plaintext
