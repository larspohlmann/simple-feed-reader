framework:
    rate_limiter:
        # All limiters: sliding window (a fixed one lets a boundary burst spend twice the limit) on the filesystem
        # pool login_throttling uses. registration is anonymous and sends mail: ALTCHA prices each abuse at ~60 ms but
        # caps no total, and unlimited that is ~60k mails a day from one host. Five a quarter hour, per IP.
        registration:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # A separate budget on purpose: exhausting one flow must not lock a
        # legitimate user out of the other. Someone who cannot get past
        # registration should still be able to recover an existing account.
        password_reset_request:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Sends no mail and writes no row, so looser than registration: abandoning a consent screen and coming back
        # is ordinary, and a NATed household shares one IP.
        oauth_start:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Per user: one progress loop makes many POSTs. The refresh lock and the per-feed cooldown are the real
        # throttles; this only stops a script hammering the endpoint.
        refresh:
            policy: 'sliding_window'
            limit: 90
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # Per user: each open fetches at most one page, and the frontend caches successes.
        reader:
            policy: 'sliding_window'
            limit: 60
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # Per user: only images the browser could not load directly come here, but a magazine page of one
        # hotlink-protected feed can be dozens at once. Each call is at most three outbound requests.
        image_proxy:
            policy: 'sliding_window'
            limit: 300
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # Per-user cap on comments-feed fetches. Each call is at most one
        # outbound request, and the client caches for an hour.
        comments:
            policy: 'sliding_window'
            limit: 30
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # Per user: each preview triggers at most one outbound feed fetch, as reader's does.
        feed_preview:
            policy: 'sliding_window'
            limit: 60
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # The anonymous first-admin bootstrap, per IP: guessing a 32-byte secret is infeasible, so this only bounds
        # scripted probing.
        setup:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Every login-page view calls the anonymous passkey login options endpoint, which writes a cache entry, so it
        # is capped per IP. Its own budget: sharing login_throttling's would let page views spend a real sign-in's
        # tokens. 30 a quarter hour covers a login page re-arming conditional mediation.
        passkey_challenge:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Both AI writes call the account's own provider first, so uncapped they generate outbound requests to any
        # address. Per user: the endpoints are authenticated.
        ai_provider:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Starting a run is what spends money: its snapshot fixes how many provider calls it can make. Ten a quarter
        # hour is far beyond honest use (a run takes minutes and supersedes the last).
        ai_recommendation_starts:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
            cache_pool: 'cache.rate_limiter'

        # Counts polls, not provider calls: the loop also spends ticks on snapshot, merge and backoff, and a budget
        # sized to provider calls stranded a 26-batch run mid-run with a 429 (#308). Sized like refresh.
        ai_recommendations:
            policy: 'sliding_window'
            limit: 90
            interval: '5 minutes'
            cache_pool: 'cache.rate_limiter'

        # Per user: each accepted "send a test digest" hands one mail to the relay.
        digest_test:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Per user: the address is not yet proved, so an unverified account could otherwise spam its own inbox.
        resend_verification:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Anonymous, so per IP: sized for a broken client's burst, not a wedged tab's flood. The reporter dedupes and
        # throttles too; this is the backstop.
        client_errors:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'
            cache_pool: cache.rate_limiter
