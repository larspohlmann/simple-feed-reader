framework:
    rate_limiter:
        # Both endpoints are anonymous and both send email, so the only key
        # available is the client IP and the only budget worth capping is
        # "messages we hand to the SMTP relay". ALTCHA already sizes the *cost*
        # of abuse — measured at ~40-60 ms per accepted solution for an
        # optimised native attacker — but a proof-of-work never caps a total.
        # At 60 ms a solve, an unlimited endpoint is roughly 60k mails a day
        # from one host, which is how a shared-hosting SMTP reputation dies.
        #
        # Policy: sliding_window, not fixed_window. A fixed window lets an
        # attacker send `limit` requests just before the boundary and `limit`
        # again just after, so the real short-term ceiling is 2x the configured
        # one. For a burst of outbound mail that doubling is precisely the
        # behaviour being defended against, and the sliding window's extra cost
        # is one additional cache key.
        #
        # 5 per 15 minutes matches the firewall's login_throttling, so the
        # operational story is uniform ("five tries a quarter hour, per IP")
        # and there is one number to tune rather than three. It is generous for
        # a human — nobody registers twice, let alone five times — while
        # leaving a NATed office or household enough room not to notice.
        #
        # Storage is cache.rate_limiter, a FilesystemAdapter. Strato shared
        # hosting has no Redis, and an in-memory pool would reset every request
        # under PHP-FPM, silently disabling the limit. Following the pool
        # login_throttling already uses keeps that decision in one place.
        registration:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # A separate budget on purpose: exhausting one flow must not lock a
        # legitimate user out of the other. Someone who cannot get past
        # registration should still be able to recover an existing account.
        password_reset_request:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Starting an OAuth login sends no mail and writes no row — it costs us
        # one cache entry and a 302 — so the budget guards against a redirect
        # loop or a scripted probe rather than against outbound abuse.
        #
        # Deliberately looser than registration's 5: abandoning a provider's
        # consent screen and coming back is ordinary human behaviour, not a
        # signal of attack, and a NATed household sharing one IP would hit a
        # tighter cap on a perfectly honest afternoon. Sliding window for the
        # same reason as its neighbours — a fixed window's boundary lets an
        # attacker spend 2x the configured limit in a short burst.
        #
        # Same cache_pool as the others, stated explicitly rather than relying
        # on the framework default, so all three limiters name the one pool the
        # test suite clears between cases.
        oauth_start:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Per-user cap on the progress-loop refresh endpoint. A full loop makes
        # several POSTs (the client re-polls while `remaining` > 0), so this is
        # keyed on the user id, not the IP, and sized generously: 90 in 5 minutes
        # covers a long loop without ever gating an honest client. The real
        # throttle is elsewhere — the shared refresh lock serialises runs and the
        # 5-minute per-feed cooldown bounds actual outbound fetches — so this
        # limiter only guards against a scripted user hammering the endpoint.
        # Sliding window and the same pool as its neighbours, for the reasons
        # documented above.
        refresh:
            policy: 'sliding_window'
            limit: 90
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # Per-user cap on reader-mode extraction. Each open triggers at most one
        # outbound page fetch, and the frontend caches successes, so honest usage
        # is low; this only guards against a scripted user driving outbound
        # fetches. Keyed on the user id. Sliding window and the same pool as its
        # neighbours, for the reasons documented above.
        reader:
            policy: 'sliding_window'
            limit: 60
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # Per-user cap on feed preview fetches. Each preview triggers at most
        # one outbound feed fetch, mirroring reader's shape; same limit, same
        # reasoning, same pool.
        feed_preview:
            policy: 'sliding_window'
            limit: 60
            interval: '5 minutes'
            cache_pool: cache.rate_limiter

        # The web first-admin bootstrap. Anonymous, so keyed on client IP like
        # registration. Brute-forcing a 32-byte secret is infeasible anyway;
        # this bounds scripted probing and matches the login/registration story
        # of "five tries a quarter hour, per IP". Same sliding window and pool
        # as its neighbours, for the reasons documented above.
        setup:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Both AI writes call the account's own provider before they store
        # anything, so an uncapped pair is an outbound request generator keyed
        # to whatever address the account last entered. The budget is per user
        # id, not per IP: the endpoints are authenticated, so the trustworthy
        # key is available.
        #
        # 30 in 15 minutes is generous for the flow it serves -- save, look at
        # the list, pick, maybe correct a typo -- and low enough that a script
        # cannot make the server a useful probe.
        ai_provider:
            policy: 'sliding_window'
            limit: 30
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Starting a recommendation run is the act that spends money: the run's
        # snapshot fixes how many provider calls it can ever make, so capping
        # how often an account may start one caps outbound spend outright.
        # Per-user, sliding window, same pool — see ai_provider above for the
        # reasoning shared by every limiter in this file.
        #
        # 10 in 15 minutes is far beyond honest use (a run takes minutes and
        # supersedes the last one) and low enough that a script cannot turn the
        # account's provider key into a request generator.
        ai_recommendation_starts:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
            cache_pool: 'cache.rate_limiter'

        # Per-user cap on the recommendation progress loop, sized like refresh
        # above and for the same reason: the client re-polls for as long as the
        # run has batches left, so this counts polls, not provider calls.
        #
        # Sizing it to the provider calls a run makes was the original mistake
        # (#308): a tick only calls the provider when it has a batch to advance,
        # while the loop also spends ticks on snapshot, merge, busy backoff and
        # re-polls, so the two counts diverge badly — a 26-batch run exhausted a
        # 45-call budget and stranded itself mid-run with a 429. The real
        # throttle is elsewhere: ai_recommendation_starts bounds how many runs
        # exist, each run's frozen batch plan bounds its own provider calls, and
        # the per-user lock serialises ticks. This limiter only stops a scripted
        # client hammering the endpoint.
        ai_recommendations:
            policy: 'sliding_window'
            limit: 90
            interval: '5 minutes'
            cache_pool: 'cache.rate_limiter'

        # Per-user cap on the "send a test digest" button (#636). Each accepted
        # call hands one mail to the relay, so this guards outbound abuse from a
        # signed-in account. Keyed on the user id; sliding window, same pool.
        digest_test:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Per-user cap on re-sending the address-verification mail (#636). The
        # endpoint is authenticated but the address is not yet proved, so an
        # unverified account could otherwise spam its own inbox on every call.
        # Keyed on the user id; sliding window, same pool, same shape as
        # digest_test above.
        resend_verification:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter
