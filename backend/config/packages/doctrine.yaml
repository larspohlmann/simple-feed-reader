doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # messenger_messages is created lazily by the failure transport, and only the worker ever creates it. The
        # filter keeps it out of the mapped schema, so schema:validate and migrations:diff do not demand it. The same
        # goes for SQLite's entry_search index and its shadow tables (App\Doctrine\EntrySearchIndex).
        schema_filter: '~^(?!messenger_messages$|entry_search)~'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        dql:
            string_functions:
                # Backs the whole-word entry search (SearchTermsModel::isWholeWord);
                # see the function class for the punctuation list it normalizes.
                NORMALIZE_WORD_BOUNDARIES: App\Doctrine\NormalizeWordBoundariesFunction
                SEARCH_FOLD: App\Doctrine\SearchFoldFunction
            numeric_functions:
                SEARCH_INDEX_MATCHES: App\Doctrine\SearchIndexMatchFunction
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
