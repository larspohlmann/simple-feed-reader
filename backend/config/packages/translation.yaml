framework:
    default_locale: en
    # A bearer API has no request locale; only the account emails vary by language (User::$locale). The list comes
    # from SupportedLocale, so validation and this config cannot drift apart.
    enabled_locales: !php/const App\Enum\SupportedLocale::ALL
    translator:
        default_path: '%kernel.project_dir%/translations'
        providers:
