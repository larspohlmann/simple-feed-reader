framework:
    cache:
        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Both are env-driven so a release-directory deployment can point them
        # at storage that outlives a single release. See backend/.env.
        prefix_seed: '%env(CACHE_PREFIX_SEED)%'
        directory: '%env(resolve:CACHE_DIRECTORY)%'

        # Namespaced pools use the above "app" backend by default
        pools:
            # Spent ALTCHA solutions, so one proof of work authorises one request. Outlives the challenge's validity
            # window, so no entry expires while its challenge still passes.
            altcha.replay.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 4200

            # OAuth flow state between our redirect and the provider's callback. Not a session: the API is stateless,
            # and Apple's form_post callback is a cross-site POST no SameSite=Lax cookie rides on.
            oauth.state.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600

            # One-time login codes. 30 s is the spec's TTL; the pool's default
            # is a backstop for entries whose explicit expiry was somehow lost.
            oauth.login_code.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 60

            # The worker schedule's checkpoints. Without them every entry re-anchors to process start, and the
            # consumer restarts hourly (--time-limit=3600), so the daily entry would never come due. No lifetime.
            scheduler.state.cache:
                adapter: cache.adapter.filesystem

            # The newest GitHub release, one request per window however many users ask. The reader expires each
            # entry after six hours; this lifetime is the backstop.
            github.release.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 21600

            # WebAuthn challenges. PasskeyChallengeStore expires each entry after 300 s; this lifetime, twice that, is
            # the backstop.
            passkey.challenge.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600

            # One refresh run's progress between its slices. The store expires each entry after ten minutes; this
            # lifetime is the backstop. Losing a record costs one jump of the progress bar, so no table.
            refresh.run.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 900

            # The Grafana singleton row (#1012), so the profiling toggle check on
            # every request and the Loki/Pyroscope endpoint reads stop querying
            # the database. EffectiveGrafanaSettings forgets it on every admin save.
            grafana.settings.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300

            # Hosts that asked us to ration requests (#1140). Each entry expires
            # when the wait it recorded ends, so this lifetime is only a
            # backstop for one whose explicit expiry was somehow lost.
            host_throttle.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 86400

            # Cookies an image host sets on a first visit, which some hosts require before serving an image (#475).
            # OriginCookies expires each entry after an hour; this lifetime is the backstop.
            image_proxy.cookie.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
