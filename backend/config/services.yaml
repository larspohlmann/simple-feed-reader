# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # How many feed requests a refresh sweep keeps in flight. Read from the
    # environment so a host can dial it down without a release: the Strato
    # worker's OS-level memory cap sits far below memory_limit (#1025).
    fetch_concurrency: '%env(int:FETCH_CONCURRENCY)%'

    # In-flight requests to one host: many Substack, YouTube or shared-CDN feeds would otherwise burst one origin
    # into a 429. Two still lets the global cap fill with other hosts.
    fetch_host_concurrency: 2

    # The one User-Agent every request to a publisher sends. It names no host (#255): Akamai Bot Manager resets the
    # stream for any domain-shaped token, real or invented, so the site looks unreachable. A parameter, so the
    # catalog rot check probes with the fetcher's exact string. OutboundUserAgentWiringTest pins both.
    outbound_user_agent: 'SimpleFeedReader/1.0'

    # Read raw, not through `default:`: that processor treats empty as unset, and the test suite's empty value must
    # switch the update check off instead of reaching GitHub. backend/.env holds the default.
    github_release_repository: '%env(GITHUB_RELEASE_REPOSITORY)%'

    app.loki_spool_directory: '%kernel.logs_dir%/loki-spool'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Psr\Cache\CacheItemPoolInterface $altchaReplayCache: '@altcha.replay.cache'
            Psr\Cache\CacheItemPoolInterface $oauthStateCache: '@oauth.state.cache'
            Psr\Cache\CacheItemPoolInterface $loginCodeCache: '@oauth.login_code.cache'
            Psr\Cache\CacheItemPoolInterface $githubReleaseCache: '@github.release.cache'
            Psr\Cache\CacheItemPoolInterface $passkeyChallengeCache: '@passkey.challenge.cache'
            Psr\Cache\CacheItemPoolInterface $refreshRunCache: '@refresh.run.cache'
            Psr\Cache\CacheItemPoolInterface $grafanaSettingsCache: '@grafana.settings.cache'
            Symfony\Contracts\Cache\CacheInterface $schedulerStateCache: '@scheduler.state.cache'
            # A name-matched bind on purpose: every service that asks for a $userAgent talks to a publisher and must
            # send outbound_user_agent.
            string $userAgent: '%outbound_user_agent%'

    # A plain application interface gets no tag from autoconfigure, so an #[AutowireIterator] over it collects
    # nothing, silently. Each collected interface below is tagged here.
    _instanceof:
        App\Service\OAuth\OAuthProvider\OAuthProviderInterface:
            tags: ['app.oauth_provider']
        App\Service\Parser\FeedFormatParser\FeedFormatParserInterface:
            tags: ['app.feed_parser']
        App\Service\Reader\Media\EmbedProvider\EmbedProviderInterface:
            tags: ['app.embed_provider']
        App\Service\Reader\Slideshow\SlideshowRecognizer\SlideshowRecognizerInterface:
            tags: ['app.slideshow_recognizer']
        App\Service\Ingest\PlatformEntryRule\PlatformEntryRuleInterface:
            tags: ['app.platform_entry_rule']
        # Symfony's mailer auto-tags only the transport factories it ships; without this `dynamic://` has no factory
        # and MAILER_DSN=dynamic://default throws UnsupportedSchemeException.
        Symfony\Component\Mailer\Transport\TransportFactoryInterface:
            tags: ['mailer.transport_factory']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Data, per-call objects, static helpers and exceptions are never services (#1202).
        exclude: '../src/Service/**/{Model,Dto,Pass,Support,Exception}/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\PasswordWorkEqualizerInterface: '@App\Security\PasswordWorkEqualizer'
    App\Service\Fetch\DnsResolver\DnsResolverInterface: '@App\Service\Fetch\DnsResolver\NativeDnsResolver'
    App\Service\Fetch\FeedFetcher\FeedFetcherInterface: '@App\Service\Fetch\FeedFetcher\HttpFeedFetcher'
    App\Service\Fetch\BatchFeedFetcher\BatchFeedFetcherInterface: '@App\Service\Fetch\BatchFeedFetcher\ConcurrentFeedFetcher'
    App\Service\Fetch\EgressProxySource\EgressProxySourceInterface: '@App\Service\Proxy\ConfiguredProxySource\StoredProxy'
    App\Service\Proxy\ConfiguredProxySource\ConfiguredProxySourceInterface: '@App\Service\Proxy\ConfiguredProxySource\StoredProxy'
    App\Service\Refresh\RefreshRunner\RefreshRunnerInterface: '@App\Service\Refresh\RefreshRunner\RefreshRunner'
    App\Service\Discovery\FeedDiscovery\FeedDiscoveryInterface: '@App\Service\Discovery\FeedDiscovery\FeedDiscovery'
    App\Service\Reader\ArticleExtractor\ArticleExtractorInterface: '@App\Service\Reader\ArticleExtractor\ArticleExtractor'
    App\Service\Settings\ServingHost\ServingHostInterface: '@App\Http\RequestServingHost'
    App\Service\Reader\StatusReasonPhrases\StatusReasonPhrasesInterface: '@App\Http\SymfonyStatusReasonPhrases'

    # Page repairs, in this order, before readability scores the page: the class-reading repairs precede
    # ImageWrapperClassRemover and HeadingClassRemover, which strip the classes they key on.
    App\Service\Reader\FetchedPageNormalizer:
        arguments:
            $repairs:
                - '@App\Service\Reader\PageRepair\CustomElementUnwrapper'
                - '@App\Service\Reader\PageRepair\NoscriptImageUnwrapper'
                - '@App\Service\Reader\PageRepair\LazyImageSources'
                - '@App\Service\Reader\PageRepair\ImageButtonUnwrapper'
                - '@App\Service\Reader\PageRepair\ShareWidgetRemover'
                - '@App\Service\Reader\PageRepair\ShareIntentLinkRemover'
                - '@App\Service\Reader\PageRepair\SubstackGatedVideoPlaceholder'
                - '@App\Service\Reader\PageRepair\ScreenReaderOnlyElementRemover'
                - '@App\Service\Reader\PageRepair\OrphanIconGlyphRemover'
                - '@App\Service\Reader\PageRepair\ImageWrapperClassRemover'
                - '@App\Service\Reader\PageRepair\HeadingClassRemover'
                - '@App\Service\Reader\PageRepair\HorizontalRuleUnwrapper'

    # The reader body's cleaning steps, run in this order over one shared document. The order is
    # behaviour (ReaderBodyCleanerWiringTest pins it): a new step joins at its place in this list.
    App\Service\Reader\ReaderBodyCleaner:
        arguments:
            $steps:
                # Media first: no trimmer may drop a block that now holds a recovered player.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\InBodyEmbedRewriter'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\SubstackPosterLink'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\PlayerChromeCleaner'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\NavigationChromeTrimmer'
                # Engagement before the title: its kickers hide the title from the remover.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\LeadingEngagementCleaner'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\LeadingTitleRemover'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\EdgeBoilerplateTrimmer'
                # After the trimmers, which could drop its anchor; before media placement, which must see it.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\SlideshowInserter'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\RecipeFactsCleaner'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\DuplicateBlockCollapser'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\PageMediaPlacement'
                # After placement, so a teaser is never rebuilt over placed lead media (#948).
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\TeaserPlayerInserter'
                # These judge the settled body; the feed's pixel sizes go on last.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\MediaOnlyLede'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\AuthorBioSeparator'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\FeedDimensionStamper'
    App\Service\Search\EntrySearch\EntrySearchInterface: '@App\Service\Search\EntrySearch\EntrySearchWithFallback'
    # Both interfaces resolve to the one adapter that knows Meilisearch's wire
    # format (#432, see MeilisearchIndex).
    App\Service\Search\Index\SearchIndexReader\SearchIndexReaderInterface: '@App\Service\Search\Index\SearchIndexReader\MeilisearchIndex'
    App\Service\Search\Index\SearchIndexWriter\SearchIndexWriterInterface: '@App\Service\Search\Index\SearchIndexReader\MeilisearchIndex'
    App\Service\Search\Membership\SavedSearchMatcher\SavedSearchMatcherInterface: '@App\Service\Search\Membership\SavedSearchMatcher\EngineOrDatabaseSavedSearchMatcher'
    App\Service\Search\Membership\SavedSearchMembershipWriter\SavedSearchMembershipWriterInterface: '@App\Repository\SavedSearchEntryMembershipRepository'
    App\Service\Passkey\PasskeyCount\PasskeyCountInterface: '@App\Repository\UserPasskeyRepository'
    App\Service\Passkey\SignInIdentities\SignInIdentitiesInterface: '@App\Repository\UserIdentityRepository'
    App\Service\Settings\EnrolledPasskeys\EnrolledPasskeysInterface: '@App\Repository\UserPasskeyRepository'
    App\Service\Auth\UserByEmail\UserByEmailInterface: '@App\Repository\UserRepository'
    App\Service\Mail\Digest\DigestRecipients\DigestRecipientsInterface: '@App\Repository\PreferencesRepository'
    App\Service\Mail\Digest\DigestSavedSearches\DigestSavedSearchesInterface: '@App\Repository\SavedSearchRepository'
    App\Service\Grafana\StoredGrafanaSettings\StoredGrafanaSettingsInterface: '@App\Repository\GrafanaSettingsRepository'
    App\Service\Proxy\StoredProxySettings\StoredProxySettingsInterface: '@App\Repository\ProxyServerSettingsRepository'
    App\Service\Backup\RestoreFeeds\RestoreFeedsInterface: '@App\Repository\FeedRepository'
    App\Service\Backup\RestoreEntries\RestoreEntriesInterface: '@App\Repository\EntryRepository'
    App\Service\Backup\RestoreEntryStates\RestoreEntryStatesInterface: '@App\Repository\EntryStateRepository'
    App\Service\Version\ReleaseVersionReader\ReleaseVersionReaderInterface: '@App\Service\Version\ReleaseVersionReader\FileReleaseVersionReader'
    App\Service\Version\LatestReleaseReader\LatestReleaseReaderInterface: '@App\Service\Version\LatestReleaseReader\GitHubLatestReleaseReader'
    App\Service\Version\LatestReleaseReader\GitHubLatestReleaseReader:
        arguments:
            $gitHubRepository: '%github_release_repository%'
    App\Service\Ai\ModelCatalog\ModelCatalogInterface: '@App\Service\Ai\ModelCatalog\OpenAiCompatibleCatalog'
    App\Service\Recommendation\Llm\Completion\ChatCompletionClient\ChatCompletionClientInterface: '@App\Service\Recommendation\Llm\Completion\ChatCompletionClient\OpenAiCompatibleChatClient'
    # A provider call pings one heartbeat while it runs and must not know who listens: a composite of the run-lock
    # keepalive and the sweep's liveness beat. Both stay injectable by class, as the advancer and the sweep arm them
    # by name. Which beats first is CompositeProviderCallHeartbeat::beat()'s rule.
    App\Service\Recommendation\Run\ProviderCallHeartbeat\ProviderCallHeartbeatInterface: '@App\Service\Recommendation\Run\ProviderCallHeartbeat\CompositeProviderCallHeartbeat'
    App\Service\Recommendation\Run\ProviderCallHeartbeat\CompositeProviderCallHeartbeat:
        arguments:
            $lockKeepalive: '@App\Service\Recommendation\Run\ProviderCallHeartbeat\TickLockKeepalive'
            $workerLiveness: '@App\Service\Recommendation\Run\ProviderCallHeartbeat\SweepStreamHeartbeat'
    App\Service\Process\ShellCommandRunner\ShellCommandRunnerInterface: '@App\Service\Process\ShellCommandRunner\ExecShellCommandRunner'
    App\Service\Process\DetachedProcessLauncher\DetachedProcessLauncherInterface: '@App\Service\Process\DetachedProcessLauncher\DetachedProcessLauncher'

    # MeController's outbound-mail limiters as one collaborator, wired by limiter service id: the class does not use
    # the `$<name>Limiter` autowiring aliases.
    App\Service\RateLimit\MeRateLimiters:
        arguments:
            $digestTest: '@limiter.digest_test'
            $resendVerification: '@limiter.resend_verification'

    # Two classes implement AccountMailerInterface, so it gets no automatic alias. This one names AccountMailer's id,
    # which #[AsDecorator] turns into MailGatedAccountMailer, so every consumer gets the mail gate.
    # MailGatedAccountMailerWiringTest pins it.
    App\Service\Mail\AccountMailer\AccountMailerInterface: '@App\Service\Mail\AccountMailer\AccountMailer'

    # The same alias-then-decorate wiring for DigestMailer and MailGatedDigestMailer.
    App\Service\Mail\Digest\DigestMailer\DigestMailerInterface: '@App\Service\Mail\Digest\DigestMailer\DigestMailer'

    App\Service\Mail\MailSendingSettings\MailSendingSettingsInterface: '@App\Service\Mail\MailSendingSettings\EffectiveMailSettings'

    # Wired on this service, not bound globally: a bind matches by parameter name, and `int $concurrency` would feed
    # any service that names a parameter that way.
    App\Service\Fetch\BatchFeedFetcher\ConcurrentFeedFetcher:
        arguments:
            $concurrency: '%fetch_concurrency%'
            $hostConcurrency: '%fetch_host_concurrency%'

    # Account mail leaves on kernel.terminate, after the response (DeferredMailer says why). Bound here, not by
    # decorating `mailer.mailer`, so only AccountMailer takes the detour.
    App\Service\Mail\AccountMailer\AccountMailer:
        arguments:
            $mailer: '@App\Service\Mail\DeferredMailer'

    # Keys the login throttle on the normalised address (docs/security.md#login-throttle-key). Decorated, not named
    # as `limiter:` in security.yaml, which would drop Symfony's global and local limiter pair. The decorated id
    # follows the `login` firewall's name, so renaming the firewall fails the container build.
    App\Security\NormalizedLoginRateLimiter:
        decorates: security.login_throttling.login.limiter
        arguments:
            $inner: '@.inner'

    App\Service\Catalog\BundledCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Refresh\ContentChangeMarker\ContentChangeMarker:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\Refresh\ContentChangeMarker\ContentChangeMarkerInterface: '@App\Service\Refresh\ContentChangeMarker\ContentChangeMarker'

    # Its own id, so a test can swap in a MockHttpClient for the catalog URL checker without touching the app-wide client.
    catalog.rot_check.http_client:
        parent: 'http_client'

    App\Service\Catalog\CatalogUrlChecker:
        arguments:
            $httpClient: '@catalog.rot_check.http_client'

    App\Service\Logging\RequestLogProcessor:
        tags:
            - { name: monolog.processor }

    monolog.formatter.json:
        class: Monolog\Formatter\JsonFormatter
        arguments:
            $batchMode: !php/const Monolog\Formatter\JsonFormatter::BATCH_MODE_JSON
            $appendNewline: true
            $ignoreEmptyContextAndExtra: false
            $includeStacktraces: true

    App\Service\Logging\Loki\LokiEndpoint\LokiEndpointInterface: '@App\Service\Grafana\SettingsLokiEndpoint'

    App\Service\Logging\Loki\LokiSink\SpoolLokiSink:
        arguments:
            $spoolDirectory: '%app.loki_spool_directory%'

    App\Service\Logging\Loki\LokiSpoolShipper:
        arguments:
            $spoolDirectory: '%app.loki_spool_directory%'

    App\Service\Logging\Loki\LokiSink\LokiSinkInterface:
        factory: ['@App\Service\Logging\Loki\Factory\LokiSinkFactory', 'create']

    App\Service\Logging\Loki\LokiPushHandler:
        arguments:
            $appLabel: 'simple-feed-reader'
            $envLabel: '%kernel.environment%'
