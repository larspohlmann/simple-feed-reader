# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # How many feed requests a refresh sweep keeps in flight. Read from the
    # environment so a host can dial it down without a release: the Strato
    # worker's OS-level memory cap sits far below memory_limit (#1025).
    fetch_concurrency: '%env(int:FETCH_CONCURRENCY)%'

    # How many of those in-flight requests may target one host at once. Caps the
    # burst a host concentration (many Substack, YouTube or shared-CDN feeds)
    # would otherwise fire at a single origin, which earns a 429. Two is polite
    # and still lets the global cap fill with other hosts.
    fetch_host_concurrency: 2

    # The one User-Agent every outbound request to a publisher carries.
    #
    # It names NO host, and it must stay that way. The usual courtesy of a
    # `(+https://project/url)` self-identification is what broke #255: Akamai Bot
    # Manager rejects a User-Agent containing a domain-shaped token, and it does
    # not answer 403 — it finishes the TLS handshake and then resets the HTTP/2
    # stream. Nothing reaches the transport, so the reader can only report the
    # site as unreachable and tell the user to check an address that was correct
    # all along. An invented domain is blocked exactly like a real one, so there
    # is no wording of the URL that survives. OutboundUserAgentWiringTest fails
    # if a host-shaped token ever reappears here.
    #
    # A parameter rather than a class constant for two reasons: the catalog rot
    # check must send the same string as the fetcher it is a probe for (a
    # publisher blocking only one of them would leave the rot check reporting a
    # healthy catalog nobody can subscribe to), and if another CDN objects later
    # the value moves in config instead of in three classes.
    outbound_user_agent: 'SimpleFeedReader/1.0'

    # Which GitHub repository the "update available" check reads its releases
    # from — see GITHUB_RELEASE_REPOSITORY in backend/.env for the default and
    # what an empty value means. Read straight from the env, deliberately NOT via
    # the `default:` processor: that processor treats an empty value as "unset"
    # and substitutes its fallback, which would make the test suite's forced-empty
    # var reach GitHub instead of switching the check off.
    github_release_repository: '%env(GITHUB_RELEASE_REPOSITORY)%'

    app.loki_spool_directory: '%kernel.logs_dir%/loki-spool'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Psr\Cache\CacheItemPoolInterface $altchaReplayCache: '@altcha.replay.cache'
            Psr\Cache\CacheItemPoolInterface $oauthStateCache: '@oauth.state.cache'
            Psr\Cache\CacheItemPoolInterface $loginCodeCache: '@oauth.login_code.cache'
            Psr\Cache\CacheItemPoolInterface $githubReleaseCache: '@github.release.cache'
            Psr\Cache\CacheItemPoolInterface $passkeyChallengeCache: '@passkey.challenge.cache'
            Psr\Cache\CacheItemPoolInterface $refreshRunCache: '@refresh.run.cache'
            Psr\Cache\CacheItemPoolInterface $grafanaSettingsCache: '@grafana.settings.cache'
            Symfony\Contracts\Cache\CacheInterface $schedulerStateCache: '@scheduler.state.cache'
            # A name-matched bind, unlike the $concurrency case further down: there
            # the global match was the objection, here it is the point. Any service
            # that asks for a $userAgent is talking to a publisher, and every one of
            # them has to send the same string — see the parameter's comment for why
            # a second agent string is a bug rather than a nicety.
            string $userAgent: '%outbound_user_agent%'

    # Tags every OAuth provider so OAuthProviderRegistry's #[AutowireIterator]
    # can collect them.
    #
    # This is NOT redundant with `autoconfigure: true`. Autoconfiguration
    # registers an interface-named tag only for interfaces some bundle has
    # declared as an autoconfigured tag; a plain application interface gets
    # nothing, so `#[AutowireIterator(OAuthProviderInterface::class)]` on its
    # own resolves to an EMPTY iterator. It fails silently, too: the registry
    # builds, every lookup throws UnknownProviderException, and the result is
    # indistinguishable from a correctly wired deployment holding no
    # credentials. Verified by booting the test kernel and reading the
    # registry's collected providers — [] before this block, both providers
    # after. OAuthProviderWiringTest keeps it that way.
    _instanceof:
        App\Service\OAuth\OAuthProvider\OAuthProviderInterface:
            tags: ['app.oauth_provider']
        # Same reason as the OAuth block above: a plain application interface is
        # not auto-tagged, so FeedParserFactory's #[AutowireIterator] needs this
        # tag to collect the dialect parsers. FeedParserWiringTest guards it.
        App\Service\Parser\FeedFormatParser\FeedFormatParserInterface:
            tags: ['app.feed_parser']
        # Same reason as the blocks above: a plain application interface is not
        # auto-tagged, so EmbedProviders' #[AutowireIterator] would silently
        # collect nothing. EmbedProvidersWiringTest guards it.
        App\Service\Reader\Media\EmbedProvider\EmbedProviderInterface:
            tags: ['app.embed_provider']
        # Same reason as the blocks above: a plain application interface is not
        # auto-tagged, so the slideshow pipeline's #[AutowireIterator] needs this
        # tag to collect the per-library recognizers.
        App\Service\Reader\Slideshow\SlideshowRecognizer\SlideshowRecognizerInterface:
            tags: ['app.slideshow_recognizer']
        # Same reason as the blocks above: a plain application interface is not
        # auto-tagged, so PlatformEntryRules' #[AutowireIterator] needs this tag
        # to collect the per-platform rules.
        App\Service\Ingest\PlatformEntryRule\PlatformEntryRuleInterface:
            tags: ['app.platform_entry_rule']
        # Same reason as the blocks above: Symfony's mailer wires its transport
        # chain from a `mailer.transport_factory`-tagged iterator, and it only
        # auto-tags the bridge factories it ships — never a plain implementation
        # of its own interface. Without this, `dynamic://` resolves to nothing
        # and MAILER_DSN=dynamic://default throws UnsupportedSchemeException.
        Symfony\Component\Mailer\Transport\TransportFactoryInterface:
            tags: ['mailer.transport_factory']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Data, per-call objects, static helpers and exceptions are never services (#1202).
        exclude: '../src/Service/**/{Model,Dto,Pass,Support,Exception}/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\PasswordWorkEqualizerInterface: '@App\Security\PasswordWorkEqualizer'
    App\Service\Fetch\DnsResolver\DnsResolverInterface: '@App\Service\Fetch\DnsResolver\NativeDnsResolver'
    App\Service\Fetch\FeedFetcher\FeedFetcherInterface: '@App\Service\Fetch\FeedFetcher\HttpFeedFetcher'
    App\Service\Fetch\BatchFeedFetcher\BatchFeedFetcherInterface: '@App\Service\Fetch\BatchFeedFetcher\ConcurrentFeedFetcher'
    App\Service\Fetch\EgressProxySource\EgressProxySourceInterface: '@App\Service\Proxy\ConfiguredProxySource\StoredProxy'
    App\Service\Proxy\ConfiguredProxySource\ConfiguredProxySourceInterface: '@App\Service\Proxy\ConfiguredProxySource\StoredProxy'
    App\Service\Refresh\RefreshRunner\RefreshRunnerInterface: '@App\Service\Refresh\RefreshRunner\RefreshRunner'
    App\Service\Discovery\FeedDiscovery\FeedDiscoveryInterface: '@App\Service\Discovery\FeedDiscovery\FeedDiscovery'
    App\Service\Reader\ArticleExtractor\ArticleExtractorInterface: '@App\Service\Reader\ArticleExtractor\ArticleExtractor'
    App\Service\Settings\ServingHost\ServingHostInterface: '@App\Http\RequestServingHost'
    App\Service\Reader\StatusReasonPhrases\StatusReasonPhrasesInterface: '@App\Http\SymfonyStatusReasonPhrases'

    # The reader's page repairs run as an ordered pipeline before readability
    # scores the page. The order is a real dependency, not a tag-collection
    # accident: the class-reading repairs (share-widget and Substack fingerprints,
    # the screen-reader and glyph classes) must run before the class-stripping
    # ones (ImageWrapperClassRemover, HeadingClassRemover), which delete the very
    # class those readers key on. Declared here as one explicit list so the
    # sequence is visible in a single place and a new repair joins by adding a
    # line at the right point — never by growing a constructor.
    App\Service\Reader\FetchedPageNormalizer:
        arguments:
            $repairs:
                - '@App\Service\Reader\PageRepair\CustomElementUnwrapper'
                - '@App\Service\Reader\PageRepair\NoscriptImageUnwrapper'
                - '@App\Service\Reader\PageRepair\LazyImageSources'
                - '@App\Service\Reader\PageRepair\ImageButtonUnwrapper'
                - '@App\Service\Reader\PageRepair\ShareWidgetRemover'
                - '@App\Service\Reader\PageRepair\ShareIntentLinkRemover'
                - '@App\Service\Reader\PageRepair\SubstackGatedVideoPlaceholder'
                - '@App\Service\Reader\PageRepair\ScreenReaderOnlyElementRemover'
                - '@App\Service\Reader\PageRepair\OrphanIconGlyphRemover'
                - '@App\Service\Reader\PageRepair\ImageWrapperClassRemover'
                - '@App\Service\Reader\PageRepair\HeadingClassRemover'
                - '@App\Service\Reader\PageRepair\HorizontalRuleUnwrapper'

    # The reader body's cleaning steps, run in this order over one shared document. The order is
    # behaviour (ReaderBodyCleanerWiringTest pins it): a new step joins at its place in this list.
    App\Service\Reader\ReaderBodyCleaner:
        arguments:
            $steps:
                # Media first: no trimmer may drop a block that now holds a recovered player.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\InBodyEmbedRewriter'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\SubstackPosterLink'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\PlayerChromeCleaner'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\NavigationChromeTrimmer'
                # Engagement before the title: its kickers hide the title from the remover.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\LeadingEngagementCleaner'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\LeadingTitleRemover'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\EdgeBoilerplateTrimmer'
                # After the trimmers, which could drop its anchor; before media placement, which must see it.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\SlideshowInserter'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\RecipeFactsCleaner'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\DuplicateBlockCollapser'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\PageMediaPlacement'
                # After placement, so a teaser is never rebuilt over placed lead media (#948).
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\TeaserPlayerInserter'
                # These judge the settled body; the feed's pixel sizes go on last.
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\MediaOnlyLede'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\AuthorBioSeparator'
                - '@App\Service\Reader\BodyCleaning\BodyCleaningStep\FeedDimensionStamper'
    App\Service\Search\EntrySearch\EntrySearchInterface: '@App\Service\Search\EntrySearch\EntrySearchWithFallback'
    # Both interfaces resolve to the one adapter that knows Meilisearch's wire
    # format (#432, see MeilisearchIndex).
    App\Service\Search\Index\SearchIndexReader\SearchIndexReaderInterface: '@App\Service\Search\Index\SearchIndexReader\MeilisearchIndex'
    App\Service\Search\Index\SearchIndexWriter\SearchIndexWriterInterface: '@App\Service\Search\Index\SearchIndexReader\MeilisearchIndex'
    App\Service\Search\Membership\SavedSearchMatcher\SavedSearchMatcherInterface: '@App\Service\Search\Membership\SavedSearchMatcher\EngineOrDatabaseSavedSearchMatcher'
    App\Service\Search\Membership\SavedSearchMembershipWriter\SavedSearchMembershipWriterInterface: '@App\Repository\SavedSearchEntryMembershipRepository'
    App\Service\Passkey\PasskeyCount\PasskeyCountInterface: '@App\Repository\UserPasskeyRepository'
    App\Service\Passkey\SignInIdentities\SignInIdentitiesInterface: '@App\Repository\UserIdentityRepository'
    App\Service\Settings\EnrolledPasskeys\EnrolledPasskeysInterface: '@App\Repository\UserPasskeyRepository'
    App\Service\Auth\UserByEmail\UserByEmailInterface: '@App\Repository\UserRepository'
    App\Service\Mail\Digest\DigestRecipients\DigestRecipientsInterface: '@App\Repository\PreferencesRepository'
    App\Service\Mail\Digest\DigestSavedSearches\DigestSavedSearchesInterface: '@App\Repository\SavedSearchRepository'
    App\Service\Grafana\StoredGrafanaSettings\StoredGrafanaSettingsInterface: '@App\Repository\GrafanaSettingsRepository'
    App\Service\Proxy\StoredProxySettings\StoredProxySettingsInterface: '@App\Repository\ProxyServerSettingsRepository'
    App\Service\Backup\RestoreFeeds\RestoreFeedsInterface: '@App\Repository\FeedRepository'
    App\Service\Backup\RestoreEntries\RestoreEntriesInterface: '@App\Repository\EntryRepository'
    App\Service\Backup\RestoreEntryStates\RestoreEntryStatesInterface: '@App\Repository\EntryStateRepository'
    App\Service\Version\ReleaseVersionReader\ReleaseVersionReaderInterface: '@App\Service\Version\ReleaseVersionReader\FileReleaseVersionReader'
    App\Service\Version\LatestReleaseReader\LatestReleaseReaderInterface: '@App\Service\Version\LatestReleaseReader\GitHubLatestReleaseReader'
    App\Service\Logging\TraceContext\TraceContextInterface: '@App\Service\Logging\TraceContext\OtelTraceContext'
    # $repository is set here rather than as a `bind`: a binding matches by
    # parameter NAME, and `$repository` is a name a Doctrine-shaped service could
    # easily reuse, so a global bind would leak this string into unrelated code.
    App\Service\Version\LatestReleaseReader\GitHubLatestReleaseReader:
        arguments:
            $repository: '%github_release_repository%'
    App\Service\Ai\ModelCatalog\ModelCatalogInterface: '@App\Service\Ai\ModelCatalog\OpenAiCompatibleCatalog'
    App\Service\Ai\Completion\ChatCompletionClient\ChatCompletionClientInterface: '@App\Service\Ai\Completion\ChatCompletionClient\OpenAiCompatibleChatClient'
    # The transport pings one heartbeat per chunk and must not learn how many
    # things care (#433, #444), so the interface resolves to a composite whose
    # two members are wired explicitly here -- the one place the indirection
    # applies. TickLockKeepalive refreshes a streaming tick's per-user lock;
    # nothing arms it outside a tick. SweepStreamHeartbeat marks a sweeping
    # worker's liveness; nothing arms it in a web request and every ping is
    # then a no-op. Both stay injectable by their own class name too, because
    # their arming methods (hold()/release(), sweepStarted()/sweepEnded()) are
    # called by name from the advancer and from the sweep, not through the
    # interface. Which of the two beats first is the composite's own rule and
    # lives in its beat() -- these arguments only say which member is which.
    App\Service\Ai\Completion\CompletionStreamHeartbeat\CompletionStreamHeartbeatInterface: '@App\Service\Ai\Completion\CompletionStreamHeartbeat\CompositeCompletionStreamHeartbeat'
    App\Service\Ai\Completion\CompletionStreamHeartbeat\CompositeCompletionStreamHeartbeat:
        arguments:
            $lockKeepalive: '@App\Service\Recommendation\Run\TickLockKeepalive'
            $workerLiveness: '@App\Service\Recommendation\Run\SweepStreamHeartbeat'
    App\Service\Process\ShellCommandRunner\ShellCommandRunnerInterface: '@App\Service\Process\ShellCommandRunner\ExecShellCommandRunner'
    App\Service\Process\DetachedProcessLauncher\DetachedProcessLauncherInterface: '@App\Service\Process\DetachedProcessLauncher\DetachedProcessLauncher'

    # MeController's own outbound-mail rate limiters (#636), grouped so the
    # controller takes one collaborator instead of one parameter per limiter.
    # Wired against the underlying `limiter.<name>` service ids directly,
    # bypassing the `$<name>Limiter`-named autowiring alias this class does
    # not use.
    App\Service\RateLimit\MeRateLimiters:
        arguments:
            $digestTest: '@limiter.digest_test'
            $resendVerification: '@limiter.resend_verification'

    # Two classes implement AccountMailerInterface (AccountMailer and its
    # #[AsDecorator] MailGatedAccountMailer below), so the container will not
    # auto-create an interface alias for it — ambiguous. This alias resolves the
    # interface to the AccountMailer service id, which decoration then swaps for
    # the decorator: the alias target's id does not change, only what it builds.
    # Every consumer that typehints the interface therefore gets the mail gate
    # for free. MailGatedAccountMailerWiringTest pins this.
    App\Service\Mail\AccountMailer\AccountMailerInterface: '@App\Service\Mail\AccountMailer\AccountMailer'

    # Same ambiguity, same fix, for the digest mailer (#636): DigestMailer and
    # its #[AsDecorator] MailGatedDigestMailer both implement
    # DigestMailerInterface, so this alias resolves to the DigestMailer service
    # id, which decoration then swaps for the decorator.
    App\Service\Mail\Digest\DigestMailer\DigestMailerInterface: '@App\Service\Mail\Digest\DigestMailer\DigestMailer'

    App\Service\Mail\MailSendingSettings\MailSendingSettingsInterface: '@App\Service\Mail\MailSendingSettings\EffectiveMailSettings'

    # The sweep's in-flight cap. Wired on this one service rather than as a
    # `bind` in _defaults: a binding matches by parameter NAME, so a global
    # `int $concurrency` would also feed any unrelated service that ever names a
    # parameter that way, and renaming the engine's own parameter to
    # `$fetchConcurrency` just to satisfy the binder would stutter at every read.
    # The engine rejects a value below 1, so a broken parameter fails at boot.
    App\Service\Fetch\BatchFeedFetcher\ConcurrentFeedFetcher:
        arguments:
            $concurrency: '%fetch_concurrency%'
            $hostConcurrency: '%fetch_host_concurrency%'

    # Account mail is queued and sent on kernel.terminate, after the response
    # has been flushed — see App\Service\Mail\DeferredMailer for why that is a
    # security property and not just a latency win.
    #
    # Bound here rather than by decorating `mailer.mailer`, so the indirection
    # is visible at the one call site it applies to and AccountMailer keeps
    # depending on the plain MailerInterface (its unit test injects its own).
    # DeferredMailer itself autowires the real mailer, so there is no cycle.
    App\Service\Mail\AccountMailer\AccountMailer:
        arguments:
            $mailer: '@App\Service\Mail\DeferredMailer'

    # Wraps the throttle limiter the `login` firewall's login_throttling block
    # generates, so the bucket key sees the same normalised address the user
    # provider resolves. See App\Security\NormalizedLoginRateLimiter for the
    # bypass this closes.
    #
    # DECORATION, not a `limiter:` service id in security.yaml. Naming a custom
    # limiter there makes LoginThrottlingFactory skip registering the global and
    # local RateLimiterFactory pair entirely, which would mean restating
    # max_attempts, the interval, the 5x global multiplier and the cache pool by
    # hand — four numbers to drift from the ones security.yaml already declares.
    # Decorating leaves all of that where it belongs and replaces only the key.
    #
    # The service id is generated as `security.login_throttling.<firewall>.limiter`.
    # If the firewall is ever renamed, the container fails at build time with an
    # unknown-decoration-target error rather than silently dropping the fix.
    App\Security\NormalizedLoginRateLimiter:
        decorates: security.login_throttling.login.limiter
        arguments:
            $inner: '@.inner'

    App\Service\Catalog\BundledCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Refresh\ContentChangeMarker\ContentChangeMarker:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\Refresh\ContentChangeMarker\ContentChangeMarkerInterface: '@App\Service\Refresh\ContentChangeMarker\ContentChangeMarker'

    # Its own id, so a test can swap in a MockHttpClient for the catalog URL checker without touching the app-wide client.
    catalog.rot_check.http_client:
        parent: 'http_client'

    App\Service\Catalog\CatalogUrlChecker:
        arguments:
            $httpClient: '@catalog.rot_check.http_client'

    App\Service\Logging\RequestLogProcessor:
        tags:
            - { name: monolog.processor }

    monolog.formatter.json:
        class: Monolog\Formatter\JsonFormatter
        arguments:
            $batchMode: !php/const Monolog\Formatter\JsonFormatter::BATCH_MODE_JSON
            $appendNewline: true
            $ignoreEmptyContextAndExtra: false
            $includeStacktraces: true

    App\Service\Profiling\ProfileSampler\ProfileSamplerInterface:
        factory: ['@App\Service\Profiling\Factory\ProfileSamplerFactory', 'create']

    App\Service\Profiling\PyroscopeEndpoint\PyroscopeEndpointInterface: '@App\Service\Grafana\SettingsPyroscopeEndpoint'

    App\Service\Profiling\ProfilingConfigSource\ProfilingConfigSourceInterface: '@App\Service\Grafana\EffectiveGrafanaSettings'

    App\Service\Logging\Loki\LokiEndpoint\LokiEndpointInterface: '@App\Service\Grafana\SettingsLokiEndpoint'

    App\Service\Logging\Loki\LokiSink\SpoolLokiSink:
        arguments:
            $spoolDirectory: '%app.loki_spool_directory%'

    App\Service\Logging\Loki\LokiSpoolShipper:
        arguments:
            $spoolDirectory: '%app.loki_spool_directory%'

    App\Service\Logging\Loki\LokiSink\LokiSinkInterface:
        factory: ['@App\Service\Logging\Loki\Factory\LokiSinkFactory', 'create']

    App\Service\Logging\Loki\LokiPushHandler:
        arguments:
            $appLabel: 'simple-feed-reader'
            $envLabel: '%kernel.environment%'
