# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # How many feed requests a refresh sweep keeps in flight. A parameter rather
    # than a class constant so the shared Strato host can be dialled down in
    # config alone. Eight x the 5 MB response cap is 40 MB against a 512 MB limit.
    fetch_concurrency: 8

    # The one User-Agent every outbound request to a publisher carries.
    #
    # It names NO host, and it must stay that way. The usual courtesy of a
    # `(+https://project/url)` self-identification is what broke #255: Akamai Bot
    # Manager rejects a User-Agent containing a domain-shaped token, and it does
    # not answer 403 — it finishes the TLS handshake and then resets the HTTP/2
    # stream. Nothing reaches the transport, so the reader can only report the
    # site as unreachable and tell the user to check an address that was correct
    # all along. An invented domain is blocked exactly like a real one, so there
    # is no wording of the URL that survives. OutboundUserAgentWiringTest fails
    # if a host-shaped token ever reappears here.
    #
    # A parameter rather than a class constant for two reasons: the catalog rot
    # check must send the same string as the fetcher it is a probe for (a
    # publisher blocking only one of them would leave the rot check reporting a
    # healthy catalog nobody can subscribe to), and if another CDN objects later
    # the value moves in config instead of in three classes.
    outbound_user_agent: 'SimpleFeedReader/1.0'

    # Which GitHub repository the "update available" check reads its releases
    # from — see GITHUB_RELEASE_REPOSITORY in backend/.env for the default and
    # what an empty value means. Read straight from the env, deliberately NOT via
    # the `default:` processor: that processor treats an empty value as "unset"
    # and substitutes its fallback, which would make the test suite's forced-empty
    # var reach GitHub instead of switching the check off.
    github_release_repository: '%env(GITHUB_RELEASE_REPOSITORY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Psr\Cache\CacheItemPoolInterface $altchaReplayCache: '@altcha.replay.cache'
            Psr\Cache\CacheItemPoolInterface $oauthStateCache: '@oauth.state.cache'
            Psr\Cache\CacheItemPoolInterface $loginCodeCache: '@oauth.login_code.cache'
            Psr\Cache\CacheItemPoolInterface $githubReleaseCache: '@github.release.cache'
            Psr\Cache\CacheItemPoolInterface $passkeyChallengeCache: '@passkey.challenge.cache'
            Psr\Cache\CacheItemPoolInterface $refreshRunCache: '@refresh.run.cache'
            Symfony\Contracts\Cache\CacheInterface $schedulerStateCache: '@scheduler.state.cache'
            # A name-matched bind, unlike the $concurrency case further down: there
            # the global match was the objection, here it is the point. Any service
            # that asks for a $userAgent is talking to a publisher, and every one of
            # them has to send the same string — see the parameter's comment for why
            # a second agent string is a bug rather than a nicety.
            string $userAgent: '%outbound_user_agent%'

    # Tags every OAuth provider so OAuthProviderRegistry's #[AutowireIterator]
    # can collect them.
    #
    # This is NOT redundant with `autoconfigure: true`. Autoconfiguration
    # registers an interface-named tag only for interfaces some bundle has
    # declared as an autoconfigured tag; a plain application interface gets
    # nothing, so `#[AutowireIterator(OAuthProviderInterface::class)]` on its
    # own resolves to an EMPTY iterator. It fails silently, too: the registry
    # builds, every lookup throws UnknownProviderException, and the result is
    # indistinguishable from a correctly wired deployment holding no
    # credentials. Verified by booting the test kernel and reading the
    # registry's collected providers — [] before this block, both providers
    # after. OAuthProviderWiringTest keeps it that way.
    _instanceof:
        App\Service\OAuth\OAuthProviderInterface:
            tags: ['app.oauth_provider']
        # Same reason as the OAuth block above: a plain application interface is
        # not auto-tagged, so FeedParserFactory's #[AutowireIterator] needs this
        # tag to collect the dialect parsers. FeedParserWiringTest guards it.
        App\Service\Parser\FeedFormatParserInterface:
            tags: ['app.feed_parser']
        # Same reason as the blocks above: a plain application interface is not
        # auto-tagged, so EmbedProviders' #[AutowireIterator] would silently
        # collect nothing. EmbedProvidersWiringTest guards it.
        App\Service\Reader\Media\EmbedProviderInterface:
            tags: ['app.embed_provider']
        # As above: PageMediaScanner's #[AutowireIterator] collects the candidate
        # sources only if this plain interface is tagged.
        App\Service\Reader\Media\MediaCandidateSourceInterface:
            tags: ['app.media_candidate_source']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\PasswordWorkEqualizerInterface: '@App\Security\PasswordWorkEqualizer'
    App\Service\Fetch\DnsResolverInterface: '@App\Service\Fetch\NativeDnsResolver'
    App\Service\Fetch\FeedFetcherInterface: '@App\Service\Fetch\HttpFeedFetcher'
    App\Service\Fetch\BatchFeedFetcherInterface: '@App\Service\Fetch\ConcurrentFeedFetcher'
    App\Service\Refresh\RefreshRunnerInterface: '@App\Service\Refresh\RefreshRunner'
    App\Service\Discovery\FeedDiscoveryInterface: '@App\Service\Discovery\FeedDiscovery'
    App\Service\Reader\ArticleExtractorInterface: '@App\Service\Reader\ArticleExtractor'
    App\Service\Search\EntrySearchInterface: '@App\Service\Search\EntrySearchWithFallback'
    # Both interfaces resolve to the one adapter that knows Meilisearch's wire
    # format (#432, see MeilisearchIndex).
    App\Service\Search\Index\SearchIndexReader: '@App\Service\Search\Index\MeilisearchIndex'
    App\Service\Search\Index\SearchIndexWriter: '@App\Service\Search\Index\MeilisearchIndex'
    App\Service\Version\ReleaseVersionReader: '@App\Service\Version\FileReleaseVersionReader'
    App\Service\Version\LatestReleaseReader: '@App\Service\Version\GitHubLatestReleaseReader'
    # $repository is set here rather than as a `bind`: a binding matches by
    # parameter NAME, and `$repository` is a name a Doctrine-shaped service could
    # easily reuse, so a global bind would leak this string into unrelated code.
    App\Service\Version\GitHubLatestReleaseReader:
        arguments:
            $repository: '%github_release_repository%'
    App\Service\Ai\ModelCatalog: '@App\Service\Ai\OpenAiCompatibleCatalog'
    App\Service\Recommendation\ChatCompletionClient: '@App\Service\Recommendation\OpenAiCompatibleChatClient'
    # The transport pings one heartbeat per chunk and must not learn how many
    # things care (#433, #444), so the interface resolves to a composite whose
    # two members are wired explicitly here -- the one place the indirection
    # applies. TickLockKeepalive refreshes a streaming tick's per-user lock;
    # nothing arms it outside a tick. SweepStreamHeartbeat marks a sweeping
    # worker's liveness; nothing arms it in a web request and every ping is
    # then a no-op. Both stay injectable by their own class name too, because
    # their arming methods (hold()/release(), sweepStarted()/sweepEnded()) are
    # called by name from the advancer and from the sweep, not through the
    # interface. Which of the two beats first is the composite's own rule and
    # lives in its beat() -- these arguments only say which member is which.
    App\Service\Recommendation\CompletionStreamHeartbeat: '@App\Service\Recommendation\CompositeCompletionStreamHeartbeat'
    App\Service\Recommendation\CompositeCompletionStreamHeartbeat:
        arguments:
            $lockKeepalive: '@App\Service\Recommendation\TickLockKeepalive'
            $workerLiveness: '@App\Service\Worker\SweepStreamHeartbeat'
    App\Service\Process\ShellCommandRunnerInterface: '@App\Service\Process\ExecShellCommandRunner'
    App\Service\Process\DetachedProcessLauncherInterface: '@App\Service\Process\DetachedProcessLauncher'

    # MeController's own outbound-mail rate limiters (#636), grouped so the
    # controller takes one collaborator instead of one parameter per limiter.
    # Wired against the underlying `limiter.<name>` service ids directly,
    # bypassing the `$<name>Limiter`-named autowiring alias this class does
    # not use.
    App\Service\RateLimit\MeRateLimiters:
        arguments:
            $digestTest: '@limiter.digest_test'
            $resendVerification: '@limiter.resend_verification'

    # Two classes implement AccountMailerInterface (AccountMailer and its
    # #[AsDecorator] MailGatedAccountMailer below), so the container will not
    # auto-create an interface alias for it — ambiguous. This alias resolves the
    # interface to the AccountMailer service id, which decoration then swaps for
    # the decorator: the alias target's id does not change, only what it builds.
    # Every consumer that typehints the interface therefore gets the mail gate
    # for free. MailGatedAccountMailerWiringTest pins this.
    App\Service\Mail\AccountMailerInterface: '@App\Service\Mail\AccountMailer'

    # Same ambiguity, same fix, for the digest mailer (#636): DigestMailer and
    # its #[AsDecorator] MailGatedDigestMailer both implement
    # DigestMailerInterface, so this alias resolves to the DigestMailer service
    # id, which decoration then swaps for the decorator.
    App\Service\Mail\Digest\DigestMailerInterface: '@App\Service\Mail\Digest\DigestMailer'

    # The sweep's in-flight cap. Wired on this one service rather than as a
    # `bind` in _defaults: a binding matches by parameter NAME, so a global
    # `int $concurrency` would also feed any unrelated service that ever names a
    # parameter that way, and renaming the engine's own parameter to
    # `$fetchConcurrency` just to satisfy the binder would stutter at every read.
    # The engine rejects a value below 1, so a broken parameter fails at boot.
    App\Service\Fetch\ConcurrentFeedFetcher:
        arguments:
            $concurrency: '%fetch_concurrency%'

    # Account mail is queued and sent on kernel.terminate, after the response
    # has been flushed — see App\Service\Mail\DeferredMailer for why that is a
    # security property and not just a latency win.
    #
    # Bound here rather than by decorating `mailer.mailer`, so the indirection
    # is visible at the one call site it applies to and AccountMailer keeps
    # depending on the plain MailerInterface (its unit test injects its own).
    # DeferredMailer itself autowires the real mailer, so there is no cycle.
    App\Service\Mail\AccountMailer:
        arguments:
            $mailer: '@App\Service\Mail\DeferredMailer'

    # Wraps the throttle limiter the `login` firewall's login_throttling block
    # generates, so the bucket key sees the same normalised address the user
    # provider resolves. See App\Security\NormalizedLoginRateLimiter for the
    # bypass this closes.
    #
    # DECORATION, not a `limiter:` service id in security.yaml. Naming a custom
    # limiter there makes LoginThrottlingFactory skip registering the global and
    # local RateLimiterFactory pair entirely, which would mean restating
    # max_attempts, the interval, the 5x global multiplier and the cache pool by
    # hand — four numbers to drift from the ones security.yaml already declares.
    # Decorating leaves all of that where it belongs and replaces only the key.
    #
    # The service id is generated as `security.login_throttling.<firewall>.limiter`.
    # If the firewall is ever renamed, the container fails at build time with an
    # unknown-decoration-target error rather than silently dropping the fix.
    App\Security\NormalizedLoginRateLimiter:
        decorates: security.login_throttling.login.limiter
        arguments:
            $inner: '@.inner'

    App\Service\Catalog\BundledCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Refresh\ContentChangeMarker:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\Refresh\ContentChangeMarkerInterface: '@App\Service\Refresh\ContentChangeMarker'

    # A child of the framework's http_client so the rot-check command holds its
    # own injectable client id. The point of the separate id is the test: it can
    # `set('catalog.rot_check.http_client', $mockClient)` to swap in a
    # MockHttpClient without touching the app-wide client every other fetch uses.
    catalog.rot_check.http_client:
        parent: 'http_client'

    App\Command\CheckCatalogUrlsCommand:
        arguments:
            $httpClient: '@catalog.rot_check.http_client'
