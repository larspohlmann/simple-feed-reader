# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # How many feed requests a refresh sweep keeps in flight. Read from the
    # environment so a host can dial it down without a release: the Strato
    # worker's OS-level memory cap sits far below memory_limit (#1025).
    fetch_concurrency: '%env(int:FETCH_CONCURRENCY)%'

    # The request window a worker-less install's cron tick must fit (#1876).
    maintenance_tick_seconds: '%env(int:MAINTENANCE_TICK_SECONDS)%'

    # In-flight requests to one host: many Substack, YouTube or shared-CDN feeds would otherwise burst one origin
    # into a 429. Two still lets the global cap fill with other hosts.
    fetch_host_concurrency: 2

    # In-flight timeline reads per social account: Bluesky and Mastodon ration requests per account (#1607).
    social_account_concurrency: 3

    # In-flight timeline reads per Mastodon instance or Bluesky PDS, all its accounts together: keeps one server
    # from crowding out other hosts at the default FETCH_CONCURRENCY of 8 (#1608).
    social_host_concurrency: 4

    # The one User-Agent every request to a publisher sends. It names no host (#255): Akamai Bot Manager resets the
    # stream for any domain-shaped token, real or invented, so the site looks unreachable. A parameter, so the
    # catalog rot check probes with the fetcher's exact string. OutboundUserAgentWiringTest pins both.
    outbound_user_agent: 'SimpleFeedReader/1.0'

    # Read raw, not through `default:`: that processor treats empty as unset, and the test suite's empty value must
    # switch the update check off instead of reaching GitHub. backend/.env holds the default.
    github_release_repository: '%env(GITHUB_RELEASE_REPOSITORY)%'

    app.loki_spool_directory: '%kernel.logs_dir%/loki-spool'

    # Where the updater container and the app hand over an update (#1948); docker-compose.prod.yml mounts it.
    update_state_directory: '%kernel.project_dir%/update-state'

    comments_cache_lifetime: 7200
    comments_gathering_cache_lifetime: 60
    social_replies_max_depth: 6
    social_replies_max_count: 100

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            Psr\Cache\CacheItemPoolInterface $altchaReplayCache: '@altcha.replay.cache'
            Psr\Cache\CacheItemPoolInterface $oauthStateCache: '@oauth.state.cache'
            Psr\Cache\CacheItemPoolInterface $loginCodeCache: '@oauth.login_code.cache'
            Psr\Cache\CacheItemPoolInterface $githubReleaseCache: '@github.release.cache'
            Psr\Cache\CacheItemPoolInterface $passkeyChallengeCache: '@passkey.challenge.cache'
            Psr\Cache\CacheItemPoolInterface $refreshRunCache: '@refresh.run.cache'
            Psr\Cache\CacheItemPoolInterface $grafanaSettingsCache: '@grafana.settings.cache'
            Symfony\Contracts\Cache\CacheInterface $schedulerStateCache: '@scheduler.state.cache'
            # A name-matched bind on purpose: every service that asks for a $userAgent talks to a publisher and must
            # send outbound_user_agent.
            string $userAgent: '%outbound_user_agent%'

    # A plain application interface gets no tag from autoconfigure, so an #[AutowireIterator] over it collects
    # nothing, silently. Each collected interface below is tagged here.
    _instanceof:
        App\Service\Identity\OAuth\OAuthProvider\OAuthProviderInterface:
            tags: ['app.oauth_provider']
        App\Service\Ingestion\Parser\FeedFormatParser\FeedFormatParserInterface:
            tags: ['app.feed_parser']
        App\Service\Content\Reader\Media\EmbedProvider\EmbedProviderInterface:
            tags: ['app.embed_provider']
        App\Service\Content\Reader\Slideshow\SlideshowRecognizer\SlideshowRecognizerInterface:
            tags: ['app.slideshow_recognizer']
        App\Service\Ingestion\Ingest\PlatformEntryRule\PlatformEntryRuleInterface:
            tags: ['app.platform_entry_rule']
        App\Service\Foundation\Url\EntryIdentityUrl\EntryIdentityUrlInterface:
            tags: ['app.entry_identity_url']
        App\Service\Sourcing\Discovery\ShareLinkFeed\ShareLinkFeedInterface:
            tags: ['app.share_link_feed']
        App\Service\Sourcing\Discovery\FeedOffer\FeedOfferInterface:
            tags: ['app.feed_offer']
        App\Service\Sourcing\Discovery\AccountOnlyFeed\AccountOnlyFeedInterface:
            tags: ['app.account_only_feed']
        App\Service\Library\Subscription\SubscribeRoute\SubscribeRouteInterface:
            tags: ['app.subscribe_route']
        # Symfony's mailer auto-tags only the transport factories it ships; without this `dynamic://` has no factory
        # and MAILER_DSN=dynamic://default throws UnsupportedSchemeException.
        Symfony\Component\Mailer\Transport\TransportFactoryInterface:
            tags: ['mailer.transport_factory']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Data, per-call objects, static helpers and exceptions are never services (#1202).
        exclude: '../src/Service/**/{Model,Dto,Pass,Support,Exception}/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\PasswordWorkEqualizerInterface: '@App\Security\PasswordWorkEqualizer'
    App\Service\Outbound\Fetch\DnsResolver\DnsResolverInterface: '@App\Service\Outbound\Fetch\DnsResolver\NativeDnsResolver'
    App\Service\Outbound\Fetch\FeedFetcher\FeedFetcherInterface: '@App\Service\Outbound\Fetch\FeedFetcher\HttpFeedFetcher'
    App\Service\Outbound\Fetch\BatchFeedFetcher\BatchFeedFetcherInterface: '@App\Service\Outbound\Fetch\BatchFeedFetcher\ConcurrentFeedFetcher'
    App\Service\Ingestion\Refresh\PassFetcher\PassFetcherInterface: '@App\Service\Ingestion\Refresh\PassFetcher\ConcurrentPassFetcher'
    App\Service\Outbound\Fetch\EgressProxySource\EgressProxySourceInterface: '@App\Service\Outbound\Proxy\ConfiguredProxySource\StoredProxy'
    App\Service\Outbound\Proxy\ConfiguredProxySource\ConfiguredProxySourceInterface: '@App\Service\Outbound\Proxy\ConfiguredProxySource\StoredProxy'
    App\Service\Ingestion\Refresh\RefreshRunner\RefreshRunnerInterface: '@App\Service\Ingestion\Refresh\RefreshRunner\RefreshRunner'
    App\Service\Sourcing\Discovery\FeedDiscovery\FeedDiscoveryInterface: '@App\Service\Sourcing\Discovery\FeedDiscovery\FeedDiscovery'
    App\Service\Content\Reader\ArticleExtractor\ArticleExtractorInterface: '@App\Service\Content\Reader\ArticleExtractor\ArticleExtractor'
    App\Service\Operations\Settings\ServingHost\ServingHostInterface: '@App\Http\RequestServingHost'
    App\Service\Social\Social\HiddenProfiles\HiddenProfilesInterface: '@App\Service\Social\Social\HiddenProfiles\AppViewHiddenProfiles'
    App\Service\Content\Reader\StatusReasonPhrases\StatusReasonPhrasesInterface: '@App\Http\SymfonyStatusReasonPhrases'
    App\Service\Ingestion\Ingest\FeedTitle\FeedTitleInterface: '@App\Service\Social\Social\ProfileFeedTitle'

    # Page repairs, in this order, before readability scores the page: the class-reading repairs precede
    # ImageWrapperClassRemover and HeadingClassRemover, which strip the classes they key on.
    App\Service\Content\Reader\FetchedPageNormalizer:
        arguments:
            $repairs:
                - '@App\Service\Content\Reader\PageRepair\StylesheetHiddenElementRemover'
                - '@App\Service\Content\Reader\PageRepair\CustomElementUnwrapper'
                - '@App\Service\Content\Reader\PageRepair\NoscriptImageUnwrapper'
                - '@App\Service\Content\Reader\PageRepair\LazyImageSources'
                - '@App\Service\Content\Reader\PageRepair\ImageButtonUnwrapper'
                - '@App\Service\Content\Reader\PageRepair\ShareWidgetRemover'
                - '@App\Service\Content\Reader\PageRepair\ShareIntentLinkRemover'
                - '@App\Service\Content\Reader\PageRepair\CommentThreadRemover'
                - '@App\Service\Content\Reader\PageRepair\SubstackGatedVideoPlaceholder'
                - '@App\Service\Content\Reader\PageRepair\ScreenReaderOnlyElementRemover'
                - '@App\Service\Content\Reader\PageRepair\HiddenClassElementRemover'
                - '@App\Service\Content\Reader\PageRepair\OrphanIconGlyphRemover'
                - '@App\Service\Content\Reader\PageRepair\ImageWrapperClassRemover'
                - '@App\Service\Content\Reader\PageRepair\HeadingClassRemover'
                - '@App\Service\Content\Reader\PageRepair\HorizontalRuleUnwrapper'

    # The reader body's cleaning steps, run in this order over one shared document. The order is
    # behaviour (ReaderBodyCleanerWiringTest pins it): a new step joins at its place in this list.
    App\Service\Content\Reader\ReaderBodyCleaner:
        arguments:
            $steps:
                # Media first: no trimmer may drop a block that now holds a recovered player.
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\InBodyEmbedRewriter'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\SubstackPosterLink'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\PlayerChromeCleaner'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\NavigationChromeTrimmer'
                # Engagement before the title: its kickers hide the title from the remover.
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\LeadingEngagementCleaner'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\LeadingTitleRemover'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\EdgeBoilerplateTrimmer'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\LegalLinkListRemover'
                # After the trimmers, which could drop its anchor; before media placement, which must see it.
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\SlideshowInserter'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\RecipeFactsCleaner'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\DuplicateBlockCollapser'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\PageMediaPlacement'
                # After placement, so a teaser is never rebuilt over placed lead media (#948).
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\TeaserPlayerInserter'
                # After every step that builds a player, so each body <audio> leaves in the one shape.
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\AudioPlayerNormalizer'
                # These judge the settled body; the feed's pixel sizes go on last.
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\MediaOnlyLede'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\AuthorBioSeparator'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\FeedDimensionStamper'
                - '@App\Service\Content\Reader\BodyCleaning\BodyCleaningStep\PastedTextBreakRestorer'
    App\Service\Library\Search\EntrySearch\EntrySearchInterface: '@App\Service\Library\Search\EntrySearch\EntrySearchWithFallback'
    # Both interfaces resolve to the one adapter that knows Meilisearch's wire
    # format (#432, see MeilisearchIndex).
    App\Service\Library\Search\Index\SearchIndexReader\SearchIndexReaderInterface: '@App\Service\Library\Search\Index\SearchIndexReader\MeilisearchIndex'
    App\Service\Library\Search\Index\SearchIndexWriter\SearchIndexWriterInterface: '@App\Service\Library\Search\Index\SearchIndexReader\MeilisearchIndex'
    App\Service\Library\Search\Membership\SavedSearchMatcher\SavedSearchMatcherInterface: '@App\Service\Library\Search\Membership\SavedSearchMatcher\EngineOrDatabaseSavedSearchMatcher'
    App\Service\Library\Search\Membership\SavedSearchMembershipWriter\SavedSearchMembershipWriterInterface: '@App\Repository\SavedSearchEntryMembershipRepository'
    App\Service\Identity\Passkey\PasskeyCount\PasskeyCountInterface: '@App\Repository\UserPasskeyRepository'
    App\Service\Identity\Passkey\SignInIdentities\SignInIdentitiesInterface: '@App\Repository\UserIdentityRepository'
    App\Service\Operations\Settings\EnrolledPasskeys\EnrolledPasskeysInterface: '@App\Repository\UserPasskeyRepository'
    App\Service\Identity\Auth\UserByEmail\UserByEmailInterface: '@App\Repository\UserRepository'
    App\Service\Outbound\Mail\Digest\DigestRecipients\DigestRecipientsInterface: '@App\Repository\DigestSettingsRepository'
    App\Service\Outbound\Mail\Digest\DigestSavedSearches\DigestSavedSearchesInterface: '@App\Repository\SavedSearchRepository'
    App\Service\Operations\Grafana\StoredGrafanaSettings\StoredGrafanaSettingsInterface: '@App\Repository\GrafanaSettingsRepository'
    App\Service\Outbound\Image\ProbedLadder\ProbedLadderInterface: '@App\Repository\ProbedLadderRepository'
    App\Service\Outbound\Proxy\StoredProxySettings\StoredProxySettingsInterface: '@App\Repository\ProxyServerSettingsRepository'
    App\Service\Operations\Backup\RestoreFeeds\RestoreFeedsInterface: '@App\Repository\FeedRepository'
    App\Service\Operations\Backup\RestoreEntries\RestoreEntriesInterface: '@App\Repository\EntryRepository'
    App\Service\Operations\Backup\RestoreEntryStates\RestoreEntryStatesInterface: '@App\Repository\EntryStateRepository'
    App\Service\Operations\Version\ReleaseVersionReader\ReleaseVersionReaderInterface: '@App\Service\Operations\Version\ReleaseVersionReader\FileReleaseVersionReader'
    App\Service\Operations\Version\LatestReleaseReader\LatestReleaseReaderInterface: '@App\Service\Operations\Version\LatestReleaseReader\GitHubLatestReleaseReader'
    App\Service\Operations\Version\LatestReleaseReader\GitHubLatestReleaseReader:
        arguments:
            $gitHubRepository: '%github_release_repository%'
    App\Service\Operations\SelfUpdate\UpdateStateStore\UpdateStateStoreInterface: '@App\Service\Operations\SelfUpdate\UpdateStateStore\FileUpdateStateStore'
    App\Service\Curation\Ai\ModelCatalog\ModelCatalogInterface: '@App\Service\Curation\Ai\ModelCatalog\CompositeModelCatalog'
    App\Service\Curation\Recommendation\Llm\Completion\ChatCompletionClient\ChatCompletionClientInterface: '@App\Service\Curation\Recommendation\Llm\Completion\ChatCompletionClient\OpenAiCompatibleChatClient'
    App\Service\Curation\Recommendation\Scoring\SystemOneClient\SystemOneClientInterface: '@App\Service\Curation\Recommendation\Scoring\SystemOneClient\HttpSystemOneClient'
    App\Service\Curation\Recommendation\Scoring\RerankClient\RerankClientInterface: '@App\Service\Curation\Recommendation\Scoring\RerankClient\HttpRerankClient'
    # A provider call pings one heartbeat while it runs and must not know who listens: a composite of the run-lock
    # keepalive and the sweep's liveness beat. Both stay injectable by class, as the advancer and the sweep arm them
    # by name. Which beats first is CompositeProviderCallHeartbeat::beat()'s rule.
    App\Service\Curation\Recommendation\Run\ProviderCallHeartbeat\ProviderCallHeartbeatInterface: '@App\Service\Curation\Recommendation\Run\ProviderCallHeartbeat\CompositeProviderCallHeartbeat'
    App\Service\Curation\Recommendation\Run\ProviderCallHeartbeat\CompositeProviderCallHeartbeat:
        arguments:
            $lockKeepalive: '@App\Service\Curation\Recommendation\Run\ProviderCallHeartbeat\TickLockKeepalive'
            $workerLiveness: '@App\Service\Curation\Recommendation\Run\ProviderCallHeartbeat\SweepStreamHeartbeat'
    App\Service\Curation\Recommendation\Run\RejectedRequestFallback\RejectedRequestFallbackInterface: '@App\Service\Curation\Recommendation\Run\RejectedRequestFallback\CompositeRejectedRequestFallback'
    App\Service\Curation\Recommendation\Run\RejectedRequestFallback\CompositeRejectedRequestFallback:
        arguments:
            $tokenParameter: '@App\Service\Curation\Recommendation\Llm\Run\MaxTokensRefusedFallback'
            $outputCap: '@App\Service\Curation\Recommendation\Llm\Run\OutputCapFallback'
            $suppressedReasoning: '@App\Service\Curation\Recommendation\Llm\Run\SuppressedReasoningFallback'
    App\Service\Foundation\Process\ShellCommandRunner\ShellCommandRunnerInterface: '@App\Service\Foundation\Process\ShellCommandRunner\ExecShellCommandRunner'
    App\Service\Foundation\Process\DetachedProcessLauncher\DetachedProcessLauncherInterface: '@App\Service\Foundation\Process\DetachedProcessLauncher\DetachedProcessLauncher'

    # Two classes implement AccountMailerInterface, so it gets no automatic alias. This one names AccountMailer's id,
    # which #[AsDecorator] turns into MailGatedAccountMailer, so every consumer gets the mail gate.
    # MailGatedAccountMailerWiringTest pins it.
    App\Service\Outbound\Mail\AccountMailer\AccountMailerInterface: '@App\Service\Outbound\Mail\AccountMailer\AccountMailer'

    # The same alias-then-decorate wiring for DigestMailer and MailGatedDigestMailer.
    App\Service\Outbound\Mail\Digest\DigestMailer\DigestMailerInterface: '@App\Service\Outbound\Mail\Digest\DigestMailer\DigestMailer'

    App\Service\Outbound\Mail\MailSendingSettings\MailSendingSettingsInterface: '@App\Service\Outbound\Mail\MailSendingSettings\EffectiveMailSettings'

    # Wired on these services, not bound globally: a bind matches by parameter name, and `int $concurrency` would feed
    # any service that names a parameter that way.
    App\Service\Outbound\Fetch\ConcurrentRequestEngine:
        arguments:
            $concurrency: '%fetch_concurrency%'

    App\Service\Operations\Maintenance\MaintenanceTick:
        arguments:
            $tickWindowSeconds: '%maintenance_tick_seconds%'

    App\Service\Outbound\Fetch\BatchFeedFetcher\ConcurrentFeedFetcher:
        arguments:
            $hostConcurrency: '%fetch_host_concurrency%'
            $settler: '@App\Service\Outbound\Fetch\AnswerSettler\PassThroughSettler'

    App\Service\Ingestion\Refresh\PassFetcher\ConcurrentPassFetcher:
        arguments:
            $hostConcurrency: '%fetch_host_concurrency%'

    App\Service\Social\Social\SocialSearch\NetworkSocialSearch:
        arguments:
            $settler: '@App\Service\Outbound\Fetch\AnswerSettler\PassThroughSettler'

    App\Service\Social\Social\TimelineRounds:
        arguments:
            $accountConcurrency: '%social_account_concurrency%'
            $hostConcurrency: '%social_host_concurrency%'

    # Account mail leaves on kernel.terminate, after the response (DeferredMailer says why). Bound here, not by
    # decorating `mailer.mailer`, so only AccountMailer takes the detour.
    App\Service\Outbound\Mail\AccountMailer\AccountMailer:
        arguments:
            $mailer: '@App\Service\Outbound\Mail\DeferredMailer'

    # Keys the login throttle on the normalised address (docs/security.md#login-throttle-key). Decorated, not named
    # as `limiter:` in security.yaml, which would drop Symfony's global and local limiter pair. The decorated id
    # follows the `login` firewall's name, so renaming the firewall fails the container build.
    App\Security\NormalizedLoginRateLimiter:
        decorates: security.login_throttling.login.limiter
        arguments:
            $inner: '@.inner'

    App\Service\Sourcing\Catalog\BundledCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Ingestion\Refresh\ContentChangeMarker\ContentChangeMarker:
        arguments:
            $projectDir: '%kernel.project_dir%'
    App\Service\Ingestion\Refresh\ContentChangeMarker\ContentChangeMarkerInterface: '@App\Service\Ingestion\Refresh\ContentChangeMarker\ContentChangeMarker'

    # Its own id, so a test can swap in a MockHttpClient for the catalog URL checker without touching the app-wide client.
    catalog.rot_check.http_client:
        parent: 'http_client'

    App\Service\Sourcing\Catalog\CatalogUrlChecker:
        arguments:
            $httpClient: '@catalog.rot_check.http_client'

    App\Service\Operations\Logging\RequestLogProcessor:
        tags:
            - { name: monolog.processor }

    monolog.formatter.json:
        class: Monolog\Formatter\JsonFormatter
        arguments:
            $batchMode: !php/const Monolog\Formatter\JsonFormatter::BATCH_MODE_JSON
            $appendNewline: true
            $ignoreEmptyContextAndExtra: false
            $includeStacktraces: true

    App\Service\Operations\Logging\Loki\LokiEndpoint\LokiEndpointInterface: '@App\Service\Operations\Grafana\SettingsLokiEndpoint'

    App\Service\Operations\Logging\Loki\LokiSink\SpoolLokiSink:
        arguments:
            $spoolDirectory: '%app.loki_spool_directory%'

    App\Service\Operations\Logging\Loki\LokiSpoolShipper:
        arguments:
            $spoolDirectory: '%app.loki_spool_directory%'

    App\Service\Operations\Logging\Factory\HostLogFileHandlerFactory:
        arguments:
            $logsDirectory: '%kernel.logs_dir%'
            $environment: '%kernel.environment%'
            $formatter: '@monolog.formatter.json'

    app.host_log_file_handler:
        class: Monolog\Handler\RotatingFileHandler
        factory: ['@App\Service\Operations\Logging\Factory\HostLogFileHandlerFactory', 'create']

    App\Service\Operations\Logging\Loki\LokiSink\LokiSinkInterface:
        factory: ['@App\Service\Operations\Logging\Loki\Factory\LokiSinkFactory', 'create']

    app.untrusted_markdown_converter:
        class: League\CommonMark\CommonMarkConverter
        arguments:
            - html_input: escape
              allow_unsafe_links: false
              max_nesting_level: 20
              max_delimiters_per_line: 1000

    App\Service\Operations\Logging\Loki\LokiPushHandler:
        arguments:
            $appLabel: 'simple-feed-reader'
            $envLabel: '%kernel.environment%'

when@test:
    parameters:
        # The kernel cache directory is shared by every parallel worker; CACHE_DIRECTORY carries the TEST_TOKEN.
        update_state_directory: '%env(resolve:CACHE_DIRECTORY)%-update-state'
