<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog — simple feed reader</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="What changed in each release of simple feed reader, a self-hosted RSS/Atom reader.">
<meta name="author" content="Lars Pohlmann">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161616">
<link rel="canonical" href="https://lars-pohlmann.de/simplefeedreader/changelog.html">
<script>
(function () {
  try {
    var choice = localStorage.getItem('sfr.homepage.theme');
    if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
  } catch (error) {}
})();
</script>
<link rel="stylesheet" href="base.css">
<style>
main.wrap{max-width:760px;padding-top:var(--space-7);padding-bottom:var(--space-8)}
main h1{font-size:36px}
.intro{margin-top:var(--space-3)}
.release{padding:var(--space-6) 0;border-bottom:1px solid var(--border)}
.release:last-child{border-bottom:0}
.release h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2) var(--space-3)}
.release h2 a{color:var(--text-primary)}
.release time{font-size:14px;font-weight:400;color:var(--text-muted)}
.release h4{margin:var(--space-4) 0 var(--space-2);font-size:14px}
.release p{margin-top:var(--space-3)}
.release ul{margin:var(--space-2) 0 0;padding-left:var(--space-5);display:grid;gap:var(--space-2);font-size:14px;color:var(--text-secondary)}
.release code{font-size:.9em;padding:1px 5px;border-radius:4px;background:var(--surface-sunken);border:1px solid var(--border)}
.highlights{margin-top:var(--space-2)}
details{margin-top:var(--space-4)}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);width:max-content}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){
  main.wrap{padding-top:var(--space-6)}
  main h1{font-size:30px}
}
</style>
</head>
<body>

  <div class="wrap">

      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">Releases</p>
  <h1>Changelog</h1>
  <p class="intro muted">What changed in each release, newest first. Every version links to its <a href="https://github.com/larspohlmann/simple-feed-reader/releases">GitHub Release</a>.</p>
{{releases}}
