name: Set up the frontend
description: Node 22 with the frontend's npm packages installed.

runs:
  using: composite
  steps:
    - name: Set up Node
      id: setup-node
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    # npm ci rebuilds node_modules from the lockfile alone, so a tree restored
    # under the same lockfile and Node version is what it would produce.
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v6
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}

    # node 22 ships npm 10.9.8, but the lockfile was authored by npm 11; npm 10
    # mis-resolves a transitive dep (chokidar) and rejects the lock. Pin npm 11.
    - name: Pin npm 11 (matches the lockfile author)
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm i -g npm@11

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
