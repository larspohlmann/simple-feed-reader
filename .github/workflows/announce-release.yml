# Posts a release's highlights as a thread to Bluesky and Mastodon (#2096).
# release.yml calls it once the images are tagged; run it by hand to announce
# an existing release. A re-run posts again: Mastodon dedupes within an hour,
# Bluesky does not.
name: Announce release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce, e.g. v1.9.0; empty announces the latest release
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  announce:
    name: Announce ${{ inputs.tag || 'the latest release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'larspohlmann/simple-feed-reader'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the announcer
        run: node --test "scripts/test/announce/*.test.mjs"

      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_SERVICE: ${{ secrets.BLUESKY_SERVICE }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            echo "==> announcing the latest release, ${TAG}"
          fi
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "!!! ${TAG} is not a vX.Y.Z release tag." >&2
            exit 1
          fi
          url="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body \
            | node scripts/announce-release.mjs "${TAG}" "${url}"
