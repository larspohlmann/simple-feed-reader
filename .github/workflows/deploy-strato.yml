# Personal deployment to the maintainer's Strato shared hosting.
# Not part of CI and not needed by anyone else working on this project --
# see deploy/strato/README.md.
#
# Runs when a develop pre-release tag is pushed, so shipping is a deliberate act
# and several merges can go out as one release. Thin on purpose: it sets up the
# two toolchains the server does not have, calls deploy/strato/build-release.sh
# and deploy/strato/activate-release.sh, and moves files between them.
#
# A tag push carries no proof of anything by itself -- it can name any commit in
# the repository, and CI does not run on tags. The two guard steps at the top of
# the job supply what the trigger cannot: the commit is on develop, and CI went
# green on that exact SHA. Neither is decoration; without them a mistyped
# `git tag v0.5.0-dev.1 <feature-sha>` ships untested code with the deploy
# secrets.
#
# NOTE: a `push` event on a tag runs this file AS IT EXISTS AT THAT TAG, not the
# default branch's copy. So an edit here takes effect on the first tag pushed
# after it merges -- no promote-to-main-first dance. (That dance was real while
# this was a workflow_run: GitHub read main's copy no matter which branch the
# deploy was for. It no longer applies.)
name: Deploy (Strato)

on:
  push:
    # GitHub filter patterns, not regex: `.` is literal and `+` means "one or
    # more of the preceding character", so this is vX.Y.Z-dev.N and nothing
    # else. A plain v1.2.3 release tag is deliberately unmatched -- main
    # releases are a separate lane that does not exist yet.
    tags: ['v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+']
  workflow_dispatch:

# One deploy at a time. Two overlapping runs could interleave an rsync with
# another release's symlink flip. Never cancel a run in progress: the dangerous
# moment is between "migrations started" and "current flipped", and killing the
# job there leaves a migrated database in front of the old code with no record
# of how far it got. A superseded *pending* run is dropped by GitHub anyway, so
# nothing older than the head of the queue ever reaches the host.
concurrency:
  group: deploy-strato
  cancel-in-progress: false

# This job talks to the Strato host over SSH, and to the GitHub API only to ask
# whether CI passed. `contents: read` is what actions/checkout needs;
# `actions: read` is what reading another workflow's runs needs. Nothing else.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this repository, never a fork. The fork-PR checks this condition used
    # to carry are gone with workflow_run: that event matched a *pull request's
    # head branch*, so a fork PR on a branch named `develop` could reach the job.
    # A tag push can only originate here, so repository identity is the whole
    # test. Everything else a deploy must prove is proven by the guard steps,
    # where a failure is loud instead of a silently skipped job.
    if: github.repository == 'larspohlmann/simple-feed-reader'

    steps:
      # A tag push checks out the tagged commit by default, so no `ref:` needed.
      # fetch-depth: 0 is for the ancestry guard below -- it is what populates
      # refs/remotes/origin/develop, and it happens here because checkout still
      # has the token. Nothing after this needs git write access, so the token is
      # not left in .git/config for the build steps to trip over.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # GUARD 1 of 2. A tag is just a label someone typed; it can name any commit
      # in the repository, including one on a feature branch that never passed
      # review. Refuse anything that is not an ancestor of develop.
      #
      # Tag pushes only: a workflow_dispatch is a human deliberately choosing a
      # ref, which is the escape hatch for deploying a branch on purpose.
      - name: Check the tagged commit is on develop
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/develop >/dev/null; then
            echo "!!! origin/develop is not in this checkout, so the tag cannot be" >&2
            echo "!!! checked against it. This means fetch-depth: 0 above stopped" >&2
            echo "!!! fetching branch refs -- fix the checkout, do not drop the check." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/develop; then
            echo "!!! ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on develop." >&2
            echo "!!! Refusing to deploy. Delete the tag, then re-tag a develop commit:" >&2
            echo "!!!   git tag -d ${GITHUB_REF_NAME} && git push origin :${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "==> ${GITHUB_SHA} is on develop"

      # GUARD 2 of 2. This is what the old workflow_run trigger bought us, bought
      # back a different way. CI runs on every push to develop, so the commit
      # being tagged was already tested -- the deploy only has to look up the
      # verdict rather than re-run a suite that takes minutes.
      #
      # Absence is failure, not success. A commit that only ever lived on a
      # feature branch has no `push` CI run at all, and must not slip through on
      # an empty result.
      - name: Check CI passed for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only `push` runs count: a pull_request run tests the PR's *merge*
          # commit, not this SHA, so a green one proves nothing about this tag.
          conclusions="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '.workflow_runs[] | select(.event == "push") | .conclusion')"

          if [ -z "${conclusions}" ]; then
            echo "!!! no completed CI run found for ${GITHUB_SHA}." >&2
            echo "!!! CI runs on pushes to develop, so a commit with no run never" >&2
            echo "!!! reached develop by the normal route. Refusing to deploy." >&2
            exit 1
          fi

          # Every run must be green, rather than "the newest one". Re-running a
          # workflow updates that run in place, so a flake fixed by a re-run
          # already reads as success here; a second *entry* means the commit was
          # genuinely pushed twice (develop, then main during a promote), and
          # there is no good reason to ship it while either verdict is red.
          # Checking all of them also means this never has to assume what order
          # the API returns runs in.
          echo "==> CI conclusions for ${GITHUB_SHA}:"
          failed=0
          while IFS= read -r conclusion; do
            echo "    ${conclusion}"
            [ "${conclusion}" = "success" ] || failed=1
          done <<< "${conclusions}"

          if [ "${failed}" -ne 0 ]; then
            echo "!!! CI is not green for ${GITHUB_SHA} (see the list above)." >&2
            echo "!!! Fix develop and tag the fix; do not re-tag a red commit." >&2
            exit 1
          fi
          echo "==> CI is green"

      # Two seconds here rather than a confusing failure three minutes in. The
      # value is interpolated into remote command lines below, where it is
      # single-quoted: that survives spaces but not a single quote of its own.
      # Relative paths are refused because `current` stores an absolute target
      # and an SSH command starts in $HOME, not in the deploy root.
      - name: Check the deploy target
        env:
          DEPLOY_PATH: ${{ secrets.STRATO_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # The value is a secret, so it is never echoed -- the message says
          # what is wrong with it, not what it is.
          die() { echo "!!! STRATO_DEPLOY_PATH $1" >&2; exit 1; }
          [ -n "${DEPLOY_PATH}" ] || die "is empty"
          [ "${DEPLOY_PATH#/}" != "${DEPLOY_PATH}" ] || die "is not an absolute path"
          [ "$(printf '%s' "${DEPLOY_PATH}" | wc -l)" -eq 0 ] || die "contains a newline"
          case "${DEPLOY_PATH}" in
            *\'*) die "contains a single quote, which the remote commands below cannot quote" ;;
          esac

      # Everything the later steps need to reach the host lives in ~/.ssh/config
      # under the alias `strato`, so no step has to repeat the connection
      # details and neither the host nor the user appears on a command line.
      # printf rather than a heredoc: the values are secrets and must land in
      # the file verbatim, not as something the shell got a second look at.
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STRATO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf, not echo: `echo` mangles a value beginning with -n or -e,
          # and the trailing \n is what saves a key stored without one --
          # OpenSSH rejects a private key whose final line is unterminated.
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          {
            printf 'Host strato\n'
            printf '  HostName %s\n' "${SSH_HOST}"
            printf '  User %s\n' "${SSH_USER}"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            # IdentitiesOnly stops the agent offering other keys and burning
            # the server's MaxAuthTries before ours is tried; StrictHostKeyChecking
            # plus BatchMode turn an unknown host into a failure rather than a
            # prompt that would hang the job until the 30-minute timeout.
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
            printf '  ConnectTimeout 20\n'
            # A migration can legitimately run for minutes on a shared host, but
            # a connection that has silently died should not hold the job open.
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 8\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Fails before the build rather than after it if the key, the host key, or
      # the account is wrong.
      - name: Check the SSH connection
        run: ssh strato true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Node 22 ships npm 10.9.8, which mis-resolves chokidar and rejects the
      # npm-11-authored lockfile. Same pin as the CI workflow.
      - name: Pin npm 11 (matches the lockfile author)
        run: npm i -g npm@11

      # A sortable UTC timestamp keeps `ls releases/` in deploy order; the tag
      # after it says *what* is running, which is the point of tagging at all.
      # A workflow_dispatch has no tag, so it falls back to the short SHA and
      # keeps the old shape.
      #
      # The name is validated because it becomes a path segment on the server and
      # an argument to the activation script. The trigger's tag filter is not the
      # validation: a dispatch can be aimed at any ref and never passes through
      # it. Rejecting every character outside [0-9A-Za-z._-] is what stops a
      # ref name from meaning something to a shell or to a path.
      - name: Name the release
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is unset}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            label="${GITHUB_REF_NAME}"
          else
            label="$(git rev-parse --short HEAD)"
          fi
          name="$(date -u +%Y%m%d%H%M%S)-${label}"
          case "${name}" in
            # Leading 14-digit timestamp, then anything from the safe set. The
            # second pattern is the veto: any character outside it fails.
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-?*) ;;
            *) echo "!!! refusing to deploy under the release name '${name}'" >&2; exit 1 ;;
          esac
          case "${name}" in
            *[!0-9A-Za-z._-]*)
              echo "!!! release name '${name}' has characters that are not safe" >&2
              echo "!!! in a path or a command line. Refusing to deploy." >&2
              exit 1 ;;
          esac
          echo "RELEASE_NAME=${name}" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=${RUNNER_TEMP}/release" >> "$GITHUB_ENV"
          echo "==> Release ${name}"

      # Installs production dependencies, builds the SPA with the /reader base
      # href, assembles the tree, and sanity-checks it. The script's EXIT trap
      # that restores dev dependencies is skipped here because GitHub Actions
      # sets CI=true for every step; it would be harmless on this throwaway
      # checkout anyway.
      - name: Build the release
        run: ./deploy/strato/build-release.sh "${RELEASE_DIR}"

      # Travels with the release instead of being uploaded to a fixed path of
      # its own: one transfer fewer, no chance of overwriting the copy a
      # concurrent run is executing, and a release on disk stays activatable
      # later by exactly the script it was built against.
      - name: Add the activation script to the release
        run: cp deploy/strato/activate-release.sh "${RELEASE_DIR}/activate-release.sh"

      # No --delete: the destination is a fresh directory every time (the name
      # carries a timestamp), so it would have nothing to delete -- while an
      # empty or malformed RELEASE_NAME would aim it at releases/ itself and
      # empty the lot. The name is validated above and the source is checked
      # here; --delete would still be a loaded gun for no gain.
      #
      # The remote path is deliberately unquoted, unlike the ssh commands below.
      # Since 3.2.4 rsync backslash-escapes shell-active characters in a remote
      # argument itself (the runner has 3.2.7), so a space in DEPLOY_PATH is
      # handled for us and quotes of our own would become part of the path.
      - name: Upload the release
        env:
          DEPLOY_PATH: ${{ secrets.STRATO_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -f "${RELEASE_DIR}/public/index.php" \
            || { echo "!!! ${RELEASE_DIR} is not a built release" >&2; exit 1; }
          rsync -az --info=stats1 \
            "${RELEASE_DIR}/" \
            "strato:${DEPLOY_PATH}/releases/${RELEASE_NAME}/"

      # Links shared state, warms the cache, migrates, and flips `current` last.
      # A failure here leaves the previous release serving traffic, and ssh
      # returns the script's exit status, so the job goes red with it.
      #
      # Run through `bash` rather than chmod + execute: one round trip fewer and
      # one fewer thing to go wrong if the host ever mounts the webspace noexec.
      # Single quotes around the interpolated values are what makes a DEPLOY_PATH
      # containing a space survive the remote shell.
      - name: Activate the release
        env:
          DEPLOY_PATH: ${{ secrets.STRATO_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029  # expanding here is the point: the runner
          # knows the path and the release name, the server does not.
          ssh strato "bash '${DEPLOY_PATH}/releases/${RELEASE_NAME}/activate-release.sh' '${DEPLOY_PATH}' '${RELEASE_NAME}'"

      # Activation deliberately checks only the three .env.local settings whose
      # absence fails silently. Everything else -- ALTCHA_HMAC_KEY, MAILER_DSN,
      # a database that refuses the connection -- surfaces only once the app
      # serves a request, and InsecureProductionConfigGuard answers 500 to
      # every route when it is unhappy. Without this step that release would go
      # live and the deploy would report success. develop is continuously
      # deployed, so nobody is necessarily watching.
      #
      # Deliberately after the flip: the point is to exercise the release that
      # is actually serving. A failure here means the site is broken NOW and
      # wants a rollback, not that the deploy did not happen.
      - name: Smoke-test the live release
        run: |
          set -euo pipefail
          # --retry-all-errors is the load-bearing flag. Plain --retry only
          # repeats on connection failures and 5xx, and the error this step
          # actually hits is a 403: Apache has the mount cached from while
          # `current` was still dangling, and serves that for a beat after the
          # flip. The first real deploy went green on every check and red here.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            https://lars-pohlmann.de/reader/api/health \
            || { echo "!!! ${RELEASE_NAME} is live but /api/health is not answering." >&2
                 echo "!!! A 500 usually means .env.local: ALTCHA_HMAC_KEY or MAILER_DSN unset" >&2
                 echo "!!! makes InsecureProductionConfigGuard refuse every route." >&2
                 echo "!!! A 403 that outlives the retries means the mount is wrong, not stale." >&2
                 echo "!!! Roll back per deploy/strato/README.md." >&2
                 exit 1; }
          echo

          # Prove the Authorization header reaches PHP. Under cgi-fcgi Apache
          # keeps it unless the vhost forwards it, and a deployment that loses
          # it looks entirely healthy from here: /api/health is public, login
          # needs no header, and only the request *after* signing in fails. That
          # shipped once and presented as "the sign-in button does nothing".
          #
          # The probe needs no credentials. A deliberately invalid bearer token
          # makes the firewall reject even this public route, so:
          #   401 -> the header arrived (what we want)
          #   200 -> the header was eaten on the way in
          # Verified both ways against the live host by removing the rewrite
          # rule and putting it back.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H 'Authorization: Bearer deliberately-invalid' \
            https://lars-pohlmann.de/reader/api/health)"
          if [ "${code}" != "401" ]; then
            echo "!!! /api/health answered ${code} to an invalid bearer token, expected 401." >&2
            echo "!!! The Authorization header is not reaching PHP, so every request after" >&2
            echo "!!! a successful login will 401 and the app will bounce users back to the" >&2
            echo "!!! sign-in form. Check the HTTP_AUTHORIZATION rewrite in public/.htaccess." >&2
            exit 1
          fi
          echo "==> Authorization header reaches PHP"

      # Keep the five most recent releases so a rollback target always exists.
      #
      # The naive form of this (`ls -1t | tail -n +6 | xargs -r rm -rf`) decides
      # what to delete purely by modification time, and mtime is not the same
      # question as "which release is serving the site". A release directory's
      # mtime moves whenever anything is written into it, releases that were
      # uploaded but never activated stay on disk and are newer than the live
      # one, and a rollback makes `current` point at something that is not the
      # newest at all. Any of those can push the live release past position five
      # -- and deleting it takes the site down instantly, with the deploy
      # reporting success. So resolve `current` first and never delete its
      # target, whatever the sort order says. If `current` cannot be resolved,
      # nothing is deleted at all.
      #
      # This runs after the flip, so the new release is already live: a failure
      # in this step is a red build over a healthy site, not a failed deploy.
      - name: Prune old releases (the new release is already live)
        env:
          DEPLOY_PATH: ${{ secrets.STRATO_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029  # ditto: DEPLOY_PATH must expand here.
          # The script itself is quoted (<<'REMOTE') and expands on the server.
          ssh strato "bash -s -- '${DEPLOY_PATH}' 5" <<'REMOTE'
          set -eu
          root=$1
          keep=$2

          cd "$root/releases" || { echo "!!! no releases directory" >&2; exit 1; }

          # `cd` + `pwd -P` resolves a symlink and a real directory alike, and
          # fails on a dangling one -- which is the case where guessing would be
          # worst.
          live="$(cd "$root/current" 2>/dev/null && pwd -P)" || live=''
          if [ -z "$live" ]; then
            echo "!!! cannot resolve $root/current -- refusing to prune anything" >&2
            exit 1
          fi
          live="$(basename "$live")"
          echo "==> live release: $live"

          seen=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ -d "$name" ] || continue
            seen=$((seen + 1))
            if [ "$seen" -le "$keep" ]; then
              continue
            fi
            if [ "$name" = "$live" ]; then
              echo "    keeping $name (it is live, despite being older than $keep others)"
              continue
            fi
            echo "    removing $name"
            rm -rf -- "./$name"
          done <<EOF
          $(ls -1t)
          EOF
          echo "==> pruned"
          REMOTE
