name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: feedreader_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS (PSR-12)
        run: composer cs

      - name: Warm cache for PHPStan
        run: php bin/console cache:warmup

      - name: PHPStan
        run: composer stan

      # PHPMD codesize was a local-only discipline gate and silently broke once
      # (pdepend could not parse PHP 8.4 syntax, #183) — so the sweep now runs
      # here too. It is a static check, unaffected by the database matrix leg.
      - name: PHPMD (codesize)
        run: composer md

      # This repository doubles as phptramp's proving ground, so the gate runs
      # the tip of its develop branch rather than the commit in composer.lock —
      # a pin would report against stale code exactly while phptramp is being
      # worked on. Only that one package is re-resolved; everything else stays
      # lock-pinned and reproducible. The consequence is deliberate: CI here can
      # go red because phptramp changed, with no commit in this repo to explain
      # it (see #380).
      - name: Update phptramp to the tip of develop
        run: composer tramp:update

      # Tramp data: a parameter forwarded through a chain of methods that never
      # read it. #373 and #374 were both found by a manual sweep months after
      # the chains grew, which is the argument for a gate rather than a habit.
      # Thresholds live in phptramp.dist.json; --format github annotates the
      # offending hop inline, the way the mutation leg annotates escaped
      # mutants. Static, so the database matrix leg does not affect it.
      - name: phptramp (tramp data)
        run: |
          composer show phptramp/phptramp | grep -E '^(name|source|versions)'
          composer tramp -- --format github

      # Both DSNs are chosen here, in one place. MIGRATION_DATABASE_URL is
      # deliberately a different database from the one PHPUnit uses, so the
      # migration check below cannot disturb the suite: it also runs in dev,
      # whereas doctrine.yaml's when@test dbname_suffix puts PHPUnit on
      # feedreader_test_test (MySQL) and var/data_test.db (SQLite).
      - name: Select database DSN
        run: |
          if [ "${{ matrix.database }}" = "mysql" ]; then
            echo 'DATABASE_URL=mysql://root:root@127.0.0.1:3306/feedreader_test?serverVersion=8.4&charset=utf8mb4' >> "$GITHUB_ENV"
            echo 'MIGRATION_DATABASE_URL=mysql://root:root@127.0.0.1:3306/feedreader_migrations?serverVersion=8.4&charset=utf8mb4' >> "$GITHUB_ENV"
          else
            echo 'MIGRATION_DATABASE_URL=sqlite:///%kernel.project_dir%/var/migration-check.db' >> "$GITHUB_ENV"
          fi

      # Proves what the PHPUnit step structurally cannot. tests/bootstrap.php
      # builds its schema with doctrine:schema:create, straight from ORM
      # metadata, so no test ever executes a migration — a migration that is
      # missing, broken, or written in the wrong SQL dialect passes the entire
      # suite on both legs. That is not hypothetical: the initial schema
      # migration was generated on SQLite and emitted SQLite-only DDL
      # (AUTOINCREMENT, CLOB, NOT DEFERRABLE). Production is MySQL, deploys run
      # migrations before flipping the `current` symlink, and the first deploy
      # would have died on the first CREATE TABLE behind a green matrix.
      #
      # Runs on both legs, because the point is that each dialect is executable
      # on the engine that will actually execute it.
      - name: Verify the migration chain builds the schema from empty
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          if [ "${{ matrix.database }}" = "mysql" ]; then
            php bin/console doctrine:database:drop --force --if-exists
            php bin/console doctrine:database:create
          else
            # SQLite cannot enumerate databases, which --if-exists needs, and
            # the file IS the database — so deleting it is the drop. Starting
            # from a file that does not exist is the strictest form of "empty".
            rm -f var/migration-check.db
          fi

          php bin/console doctrine:migrations:migrate --no-interaction

          # The schema migrations build (production) must match the schema
          # metadata builds (tests). Drift between the two is the class of bug
          # that ships green, so it fails the build here.
          php bin/console doctrine:schema:validate

      - name: PHPUnit
        run: php bin/phpunit

  # Line coverage says a line ran; it does not say a test would notice if the
  # line were wrong. Infection changes the line and reports whether anything
  # failed, which is the property the suite is actually meant to have.
  #
  # Scoped to the files the branch changes, in the spirit of the PHPMD rule: a
  # file you touch has to be clean, and untouched code is not this branch's
  # problem. That keeps the job to a minute or two and lets the threshold land
  # without a tree-wide cleanup first. One leg only — the SQLite one; mutation
  # scores do not differ by database engine, and the MySQL leg already proves
  # the suite passes there.
  mutation:
    name: Mutation (changed files)
    runs-on: ubuntu-latest
    # Needs a base to diff against, which only a pull request has.
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
        with:
          # Infection diffs the branch against the PR base, so the shallow
          # default clone is not enough — the base ref has to be present.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite
          # The one job that needs a coverage driver: Infection maps each mutant
          # to the tests that reach it. PCOV over Xdebug because it is several
          # times faster and this job runs the suite many times over.
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Fetch the base branch
        run: git fetch --no-tags origin '${{ github.event.pull_request.base.ref }}'

      # Escaped mutants come back as PR annotations on the offending line, so a
      # gap is visible where the code is rather than only in the job log.
      #
      # --ignore-msi-with-no-mutations because a diff can legitimately produce
      # no mutants at all — a comment-only edit to a src file, say. Without it
      # Infection compares the threshold against an MSI of 0% and fails a PR
      # that has nothing to answer for.
      - name: Infection
        run: >-
          vendor/bin/infection
          --git-diff-filter=AM
          --git-diff-base='origin/${{ github.event.pull_request.base.ref }}'
          --threads=max
          --logger-github
          --no-progress
          --ignore-msi-with-no-mutations

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # node 22 ships npm 10.9.8, but the lockfile was authored by npm 11; npm 10
      # mis-resolves a transitive dep (chokidar) and rejects the lock. Pin npm 11.
      - name: Pin npm 11 (matches the lockfile author)
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      # ESLint + Prettier + Stylelint + Jest. Stylelint's color-no-hex covers the
      # .scss files (theme excepted); component styles are inline TS and kept
      # token-only by convention. The Playwright smoke needs the Docker stack and
      # is deliberately not part of this gate.
      - name: Gate (lint, format, stylelint, unit)
        run: npm run check

      - name: Build
        run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest ships shellcheck. The helper scripts (installer, updater,
      # frontend start/stop) are user-facing, so a lint break should fail CI.
      # The two container entrypoints share the same bash-3.2-safe standard.
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/test/*.sh docker/php/entrypoint-prod.sh docker/web/10-select-mode.sh

      # The Strato deploy probes a public route with an invalid bearer token to
      # prove Apache forwards Authorization. The status diagnosis controls
      # whether a healthy release is accepted, retried, or reported as broken.
      - name: check-authorization-header
        run: scripts/test/check-authorization-header.test.sh

      # The installer's three public-origin questions decide PUBLIC_URL, and
      # PUBLIC_URL is the OAuth redirect base and the link base in account
      # mail. A wrong answer there is only visible after an install, so the
      # mapping from answers to .env.prod values is tested here.
      - name: configure_public_url
        run: scripts/test/configure-public-url.test.sh

      # The installer is advertised as `curl ... | bash`, so bash reads it from
      # stdin while running it. A child that reads stdin eats the rest of the
      # script and the install stops early reporting success (#275). This
      # pipes a script into bash and proves the wrappers cannot do that.
      - name: piped-installer-not-truncated
        run: scripts/test/piped-installer-not-truncated.test.sh

      # The package question (#453) -- the first thing a fresh install asks,
      # and the one that decides the two questions below at once. It also
      # prints the measured memory figure of each package, so the test compares
      # those figures against the ones README.md states: an operator who reads
      # both must not find two different numbers.
      - name: configure_package
        run: scripts/test/configure-package.test.sh

      # The database question (#277). Its answer decides which compose profile
      # the stack runs with, so a wrong mapping either starts a MySQL container
      # nobody talks to or leaves a MySQL install without a database.
      - name: configure_database
        run: scripts/test/configure-database.test.sh

      # The search engine question (#432). Its answer decides which compose
      # profile the stack runs with, alongside the database's own, so the
      # combined profile list has to come out right in every combination -- a
      # wrong one either starts an engine container nobody talks to or leaves
      # a configured install without it.
      - name: configure_search_engine
        run: scripts/test/configure-search-engine.test.sh

      # The mail question, whose default decides whether a new instance can
      # send account mail at all. A wrong answer here is invisible until the
      # first registration nobody receives.
      - name: configure_mail
        run: scripts/test/configure-mail.test.sh

      # What the installer does when an earlier production install is still on
      # the machine (#272). Its volumes outlive their containers and hold
      # passwords the installer cannot reproduce, so the choice between
      # removing them and stopping has to be right every time.
      - name: previous-prod-install
        run: scripts/test/previous-prod-install.test.sh

      # What the installers put on the screen, and the options they accept
      # (#430). The default port each topology offers becomes a published
      # container port and the port in every account-mail link; --ref is parsed
      # on an entry point that runs through `curl | bash`, where a silent break
      # is invisible until an install goes wrong; and the closing block has to
      # repeat warnings raised minutes of container output earlier.
      - name: installer-output
        run: scripts/test/installer-output.test.sh

      # The all-skip guard for the weekly e2e rot check (#96). It decides
      # whether a Playwright run that reported success actually verified
      # anything, so it is exactly the kind of logic that must not rot itself.
      - name: assert-playwright-ran
        run: scripts/test/assert-playwright-ran.test.sh

      # The release-version stamper both the Docker image builds and the Strato
      # release build share (#500). A wrong tag-shape guard would ship a bundle
      # labelled with a branch name, and a broken rewrite would put every
      # install back on the 'dev' placeholder this bug is about.
      - name: stamp-version
        run: scripts/test/stamp-version.test.sh
