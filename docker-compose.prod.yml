# The PRODUCTION stack. Deliberately a standalone file, not an overlay on
# docker-compose.yml: an overlay would inherit the dev file's
# MAILER_DSN=smtp://mailpit:1025 -- the exact silent mail black hole issue #65
# exists to kill. Nothing here defaults to a dev service.
#
# Run it through the helper scripts (scripts/prod-start.sh reads .env.prod):
#   docker compose -p simple-feed-reader-prod -f docker-compose.prod.yml --env-file .env.prod ...
#
# Every ${VAR:?} below makes compose refuse to start with a message naming the
# missing variable -- fail loud at start, never fail open at runtime. See
# .env.prod.example for what each variable means.

name: simple-feed-reader-prod

# One environment block, two consumers: php-fpm and the worker must see the
# same configuration or they compute different DATABASE_URLs (#311).
x-app-environment: &app-environment
  # An empty DATABASE_URL means the bundled MySQL above, and the URL is
  # assembled here so the MYSQL_* values stay the single source of those
  # credentials. Every .env.prod written before the SQLite option leaves it
  # empty, so an existing install keeps its database untouched.
  #
  # A SQLite install sets it to sqlite:///%kernel.project_dir%/var/data.db
  # -- one file on the php-var volume, which already outlives the
  # container. The default is only expanded when DATABASE_URL is empty, so
  # MYSQL_PASSWORD is not required in that case.
  DATABASE_URL: "${DATABASE_URL:-mysql://${MYSQL_USER:-feedreader}:${MYSQL_PASSWORD:?set it in .env.prod}@mysql:3306/${MYSQL_DATABASE:-feedreader}?serverVersion=8.4&charset=utf8mb4}"
  # No default and no fallback: null:// discards mail and reports success,
  # and InsecureProductionConfigGuard 500s every request while it is set.
  MAILER_DSN: ${MAILER_DSN:?set a real mail transport in .env.prod}
  # Deliberate "no mail" mode (#230). When 1, InsecureProductionConfigGuard
  # accepts MAILER_DSN=null://null instead of 500ing. MAILER_DSN stays
  # required above, so a FORGOTTEN mailer still fails compose at start; the
  # installer's "No mail" choice writes both MAIL_DISABLED=1 and
  # MAILER_DSN=null://null together.
  MAIL_DISABLED: ${MAIL_DISABLED:-}
  MAIL_FROM: ${MAIL_FROM:?set it in .env.prod}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Simple Feed Reader}
  APP_SECRET: ${APP_SECRET:?set it in .env.prod}
  ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?set it in .env.prod}
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?set it in .env.prod}
  # One public origin fills all three URL roles (SPA links in mail, OAuth
  # redirect base, CLI-generated URLs).
  APP_FRONTEND_URL: ${PUBLIC_URL:?set it in .env.prod}
  APP_BACKEND_URL: ${PUBLIC_URL:?set it in .env.prod}
  DEFAULT_URI: ${PUBLIC_URL:?set it in .env.prod}
  # Pools live OUTSIDE var/cache/prod so the entrypoint's cache rebuild
  # never resets rate limits or ALTCHA replay protection. The php-var
  # volume makes them survive container recreates.
  CACHE_DIRECTORY: /app/var/cache-pools/app
  ADMIN_SETUP_SECRET: ${ADMIN_SETUP_SECRET:-}
  # Permissive, not `:?`: prod-start.sh's ensure_ai_key_secret generates
  # this value AFTER compose interpolation runs, so an instance upgrading
  # from before #305 has no such variable yet at this point. A `:?` guard
  # would fail compose right here on that instance -- exactly the outage
  # ensure_ai_key_secret exists to prevent.
  INSTANCE_SECRET_KEY: ${INSTANCE_SECRET_KEY:-}
  MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-}
  # Empty means no engine: MeilisearchIndex autowires cleanly with an empty
  # URL/key and EntrySearchWithFallback answers every search from the database
  # instead -- the permanent, correct state for an install that declined the
  # engine or cannot run containers at all (see backend/config/services.yaml).
  # `:-`, not `:?`: compose resolves every variable in this file BEFORE it
  # filters services by profile (see the mysql service below), so a required
  # guard here would abort every install that runs no engine.
  MEILISEARCH_URL: ${MEILISEARCH_URL:-}
  MEILISEARCH_KEY: ${MEILISEARCH_KEY:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
  APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID:-}
  APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID:-}
  APPLE_OAUTH_PRIVATE_KEY: ${APPLE_OAUTH_PRIVATE_KEY:-}

services:
  # The bundled database, behind a profile: a SQLite install runs two
  # containers instead of three and never starts this one. prod_compose in
  # scripts/lib.sh enables the profile exactly while DATABASE_URL in .env.prod
  # is empty, which is what "use the bundled MySQL" means there.
  #
  # The interpolation below is still evaluated while the profile is off --
  # compose resolves the whole file before it filters services -- so
  # MYSQL_ROOT_PASSWORD stays a required value on every install, SQLite or not.
  # scripts/install.sh generates both passwords either way.
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    # See the worker service: the whole stack shares one restart policy, so a
    # host reboot brings the database back alongside the consumer that needs
    # it. `docker compose down` still stops everything for good.
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedreader}
      MYSQL_USER: ${MYSQL_USER:-feedreader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The search engine, behind its own profile: declining it at install time,
  # or an install that cannot run another container at all, means the app
  # runs with no engine configured -- correct and permanent, not degraded, see
  # EntrySearchWithFallback. prod_compose_profiles in scripts/lib.sh enables
  # this profile exactly while MEILISEARCH_URL in .env.prod is non-empty.
  #
  # No depends_on anywhere in this file: the app is designed to run correctly
  # whether or not this container exists (see the dev compose file's own
  # meilisearch comment). Ordering it after php/worker would claim an
  # ordering requirement that is not real.
  #
  # No published port: only php and worker, on the internal compose network,
  # ever talk to this.
  meilisearch:
    image: getmeili/meilisearch:v1.13
    profiles: ["meilisearch"]
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-}
      MEILI_ENV: "production"
    volumes:
      - meili-data:/meili_data

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
      # The release version baked into version.json. scripts/prod-start.sh
      # derives and exports these; empty otherwise, so a bare `compose build`
      # leaves the app on its development-build fallback (issue #500). php and
      # worker share the same three args so both bake the identical image.
      args: &version-build-args
        APP_VERSION: ${APP_VERSION:-}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    restart: unless-stopped
    environment: *app-environment
    extra_hosts:
      # Lets MAILER_DSN=smtp://host.docker.internal:25 reach an MTA on the
      # host; harmless when unused. Works on Docker Engine variants where
      # host.docker.internal is not built in.
      - "host.docker.internal:host-gateway"
    volumes:
      # Logs and cache pools outlive the container; JWT keys outlive rebuilds.
      - php-var:/app/var
      - jwt-keys:/app/config/jwt
    depends_on:
      mysql:
        condition: service_healthy
        # A SQLite install leaves the mysql profile off, so the service is not
        # part of the run at all and php has to start without it.
        required: false

  # The #311 background worker: same image, different command. It drives
  # recommendation runs, sweeps due feeds, and purges the failure transport
  # (see backend/src/Service/Worker/WorkerSchedule.php). If it dies, the app
  # degrades to #308's poll-driven behaviour automatically -- no config.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
      args: *version-build-args
    # --memory-limit raised from 128M in #437: one recommendation wave reads
    # several answer streams at once, and 128M cut a live run short at 201 MB.
    command: ["php", "bin/console", "messenger:consume", "scheduler_worker", "--time-limit=3600", "--memory-limit=512M"]
    # messenger:consume exits by design at --time-limit, so something must
    # bring it back. It used to be the ONLY service with a restart policy,
    # which made a host or daemon reboot bring the worker back alone: the
    # entrypoint's `until [ -f var/.ready ]` gate then passed on the flag the
    # previous run had left on the persistent php-var volume, and the worker
    # hammered a stopped database every ten seconds (#311 final review,
    # Important 3). Every service in this stack now carries the same policy,
    # so "the worker came back" implies the stack came back.
    restart: unless-stopped
    environment: *app-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - php-var:/app/var
      - jwt-keys:/app/config/jwt
    depends_on:
      mysql:
        condition: service_healthy
        # Same as php: a SQLite install runs without the mysql profile.
        required: false
      php:
        # Start-order hint only; the entrypoint's var/.ready wait is the real
        # readiness gate.
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      # The same release version, baked into the SPA bundle's version.ts.
      args: *version-build-args
    restart: unless-stopped
    environment:
      WEB_MODE: ${WEB_MODE:-auto}
      # The EXTERNAL TLS port, for the http->https redirect target. The
      # container itself always listens on 443; the mapping publishes it.
      WEB_TLS_PORT: ${WEB_TLS_PORT:-443}
    ports:
      # The ONLY published ports of the whole stack -- mysql and php-fpm stay
      # on the internal network. Behind a local reverse proxy, set
      # WEB_BIND_ADDRESS=127.0.0.1 so nothing but the proxy can reach these.
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTP_PORT:-80}:80"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_TLS_PORT:-443}:443"
    volumes:
      - ./docker/certs-prod:/etc/nginx/certs:ro
    depends_on:
      - php

volumes:
  mysql-data:
  meili-data:
  php-var:
  jwt-keys:
